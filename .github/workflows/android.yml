# Compila el APK de Android (una app que abre el juego a pantalla completa) y lo publica en
# https://github.com/jlanuza94/El-Banquillo/releases/latest/download/El-Banquillo.apk
# El APK carga el juego desde la web: las novedades del juego llegan solas, sin instalar otro APK.
name: APK de Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
      KEY_ALIAS: elbanquillo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Clave de firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Si el repositorio tiene los secretos ANDROID_KEYSTORE_B64 y ANDROID_KEYSTORE_PASSWORD, se usa esa clave
          # (así cada APK se instala encima del anterior). Si no, se crea una clave temporal para esta compilación.
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$KEYSTORE_FILE"; PW="$KS_PW"
          else
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=El Banquillo, O=jlanuza94, C=ES"
          fi
          echo "::add-mask::$PW"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"; echo "KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
      - name: Compilar
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "::error title=Gradle::$(grep -E 'error:|What went wrong|FAILURE|Could not' -A4 build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Final del registro::$(tail -30 build.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1; }
      - name: Publicar
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk El-Banquillo.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "El Banquillo para Android" --notes "APK para Android. Descárgalo en el móvil e instálalo (Android te pedirá permiso para instalar apps de este origen). El juego se actualiza solo desde la web."
          gh release upload android-latest El-Banquillo.apk --clobber
          echo "::notice title=APK::Versión $VERSION_CODE publicada"
