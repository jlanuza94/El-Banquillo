// El mapa de la ciudad: dónde están esta noche tu camioneta y las de tus equipos.
const COL_EQ = ['#ff8a1f', '#69c97a', '#8ad4ff', '#c6a0ff', '#f497b5', '#f2e86d', '#ffb36b', '#9be38a', '#e9e9e9', '#ff6a5c', '#7fd6c2'];
function hashTxt(t) { let h = 7; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; }
function mapaCiudad() {
  const H = S.hoy; if (S.fase !== 'empresa' || !H.ordenes.length) return '';
  const W = 320, Hh = 170, base = [160, 88];
  const pos = H.ordenes.map(o => { const h = hashTxt(o.nombre + o.id); let x = 22 + h % 276, y = 18 + (h >>> 9) % 136; if (Math.hypot(x - base[0], y - base[1]) < 34) x = x < base[0] ? x - 36 : x + 36; return [clamp(x, 16, W - 16), y]; });
  const quien = H.ordenes.map((o, i) => i === H.sel ? 0 : (H.equipos || []).findIndex(e => e.o === i) + 1 || -1);
  const ayudan = (H.equipos || []).map((e, k) => e.o === 'mio' ? k + 1 : 0).filter(Boolean);
  const calles = [...[30, 64, 98, 132].map(y => `<path d="M0 ${y}H${W}"/>`), ...[40, 100, 160, 220, 280].map(x => `<path d="M${x} 0V${Hh}"/>`)].join('');
  const van = (k, [x, y]) => `<g class="van"><rect x="-7" y="-4" width="14" height="8" rx="2" fill="${COL_EQ[k]}" stroke="#0b1117" stroke-width="1"/><animateMotion dur="${(3 + k * .4).toFixed(1)}s" fill="freeze" path="M${base[0]} ${base[1]}L${x} ${y}"/></g>`;
  return `<div class="mapa"><span class="nota">${L('Toca un trabajo para elegirlo', 'Tap a job to pick it')}</span>
    <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${L('Mapa de la ciudad con tus trabajos', 'City map with your jobs')}">
      <rect width="${W}" height="${Hh}" fill="#141e27"/><g stroke="#24313d" stroke-width="5">${calles}</g><path d="M0 150Q120 128 200 156T${W} 146" stroke="#1d3a52" stroke-width="9" fill="none"/>
      <g transform="translate(${base[0]} ${base[1]})"><rect x="-13" y="-10" width="26" height="20" rx="3" fill="#2a3946" stroke="#ffd23f" stroke-width="1.5"/><text y="4" text-anchor="middle" font-size="9" fill="#ffd23f">${L('TALLER', 'SHOP')}</text></g>
      ${H.ordenes.map((o, i) => { const [x, y] = pos[i], q = quien[i], col = q >= 0 ? COL_EQ[q] : o.firmado ? '#9aa7b2' : '#56636e';
        return `<g data-o="${i}" class="pin" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${o.gigante ? 11 : 8}" fill="${col}" stroke="#0b1117" stroke-width="2" ${q >= 0 ? '' : 'opacity=".75"'}/><text x="${x}" y="${y + 3.5}" text-anchor="middle" font-size="${o.gigante ? 11 : 9}" fill="#0b1117" font-weight="700">${o.finde ? '★' : o.gigante ? 'G' : o.clienteId ? 'F' : i + 1}</text></g>`; }).join('')}
      ${quien.map((q, i) => q >= 0 ? van(q, [pos[i][0], pos[i][1] + 15]) : '').join('')}${ayudan.map((k, j) => van(k, pos[H.sel] ? [pos[H.sel][0] + (j % 2 ? 1 : -1) * (16 + 14 * Math.floor(j / 2)), pos[H.sel][1] + 15] : base)).join('')}
    </svg>
    <div class="leyenda"><span><i style="background:${COL_EQ[0]}"></i>${L('Tú', 'You')}</span>${(H.equipos || []).map((e, k) => e.o !== null && e.o !== undefined ? `<span><i style="background:${COL_EQ[k + 1]}"></i>${L('Equipo', 'Team')} ${k + 2}${e.o === 'mio' ? L(' (contigo)', ' (with you)') : ''}</span>` : '').join('')}<span><i style="background:#56636e"></i>${L('Sin firmar', 'Not signed')}</span><span>${L('G gigante · F cliente fijo', 'G giant · F regular client')}</span></div></div>`;
}

function tarjetaCorta(o, i) {
  const chip = o.leccion ? L(LECCIONES[o.leccion].chip, EN.leccion[o.leccion][0]) : o.finde ? '🏆 ' + L('Reto de fin de semana', 'Weekend challenge') : o.clienteId ? L('Cliente fijo', 'Regular client') : o.duelo ? L('Duelo', 'Duel') : o.gigante ? L('Gigante', 'Giant') : o.pedido ? L(pedido(o.pedido).chip, EN.pedidoChip[o.pedido]) : '';

    <span class="nota">${chip ? `<b class="chip-txt ${o.duelo ? 'mal' : ''}">${esc(chip)}</b> · ` : ''}${nCocina(o.cocina)}${o.campanas > 1 ? ` · ${o.campanas} ${L('campanas', 'hoods')}` : ''} · ${o.micras.toLocaleString('es-MX')} µm${o.firmado ? '' : ` · <i>${L('sin firmar', 'not signed')}</i>`}</span>
  </button>`;
}
function tarjetaOrden(o, i) {
  const C = COCINAS[o.cocina], H = S.hoy;
  if (i !== H.sel) return tarjetaCorta(o, i);
  const faltanAyud = o.ayud - H.ayud.length;

    ${o.eventos.length ? o.eventos.map(e => `<span class="pista">${esc(L(PISTAS[e], EN.pista[e]))}</span>`).join('') : `<span class="pista">${L('Todo tranquilo. Sospechoso.', 'All quiet. Suspicious.')}</span>`}

    ${sig && S.rep >= sig.rep ? tarjetaEtapa(sig) : ''}

    ${vEquipoB()}

// Negociar el precio antes de aceptar un trabajo. Si insistes de más, el cliente se va con El Cuñado.
function pantallaNegociar(i, msg) {
  const H = S.hoy, o = H.ordenes[i], C = CARACTER[o.caracter];
  if (o.pac === undefined) o.pac = C.pac;
  const prob = p => p >= .7 ? L('Seguramente acepta', 'Will probably accept') : p >= .4 ? L('Puede que sí, puede que no', 'Maybe yes, maybe no') : L('Difícil', 'Unlikely');
  const intento = (o.intentos || 0) * .1, gar = C.garantia || 1.3;
  pantalla(`<div class="rotulo">${L('Negociar', 'Negotiate')}<span>${esc(o.nombre)}</span></div>
    <div class="jefe">${cara('#e9e9e9', o.nombre[0])}<div><b>${L(C.n, EN.trato[o.caracter][0])} · ${L('paciencia', 'patience')} ${'●'.repeat(Math.max(0, o.pac))}${'○'.repeat(Math.max(0, C.pac - o.pac))}</b>${esc(msg || C.hola)}</div></div>
    <p class="nota">${esc(L(C.txt, EN.trato[o.caracter][1]))}</p>
    <div class="fila"><span>${L('Oferta de ahora', 'Current offer')}</span><span class="pago">${dinero(o.pago)}</span></div>
    <div class="opciones neg">
      <button class="btn prim" data-n="ok">${L('Firmar por', 'Sign for')} ${dinero(o.pago)}<small>${L('Trato hecho. Apretón de manos con grasa.', 'Deal. A greasy handshake.')}</small></button>
      ${o.contra ? `<button class="btn" data-n="contra">${L('Aceptar su contraoferta', 'Accept the counteroffer')}: ${dinero(o.contra)}<small>${L('Ni tú ni yo.', 'Meet in the middle.')}</small></button>` : ''}
      <button class="btn" data-n="15">${L('Pedir un 15 % más', 'Ask for 15% more')}: ${dinero(r10(o.pago * 1.15))}<small>${prob(C.p15 - intento + .1 * hab('regateo'))}. ${L('Si dice que no, pierde paciencia.', 'If they say no, they lose patience.')}</small></button>
      <button class="btn" data-n="30">${L('Pedir un 30 % más', 'Ask for 30% more')}: ${dinero(r10(o.pago * 1.3))}<small>${prob(C.p30 - intento + .1 * hab('regateo'))}. ${L('Arriesgado.', 'Risky.')}</small></button>
      ${o.garantia ? '' : `<button class="btn" data-n="gar">${L('Garantizar una A', 'Guarantee an A')}: ${dinero(r10(o.pago * gar))}<small>${L('Si el inspector no pone A o A+, devuelves el 30 % y pierdes reputación.', 'If the inspector doesn\'t give an A or A+, you refund 30% and lose reputation.')}</small></button>`}
      <button class="btn" data-n="volver">${L('Pensarlo', 'Think about it')}<small>${L('Volver sin decidir.', 'Go back without deciding.')}</small></button>
    </div>`);
  P.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    const k = b.dataset.n; audio();
    if (k === 'volver') return pantallaCamioneta();
    if (k === 'ok') { o.negociado = o.firmado = true; sCaja(); guardar(); return pantallaCamioneta(); }
    if (k === 'contra') { o.pago = o.contra; o.contra = null; o.negociado = o.firmado = true; sCaja(); guardar(); return pantallaCamioneta(); }
    if (k === 'gar') { o.pago = r10(o.pago * gar); o.garantia = true; o.negociado = o.firmado = true; sCaja(); guardar(); return pantallaCamioneta(); }
    const sube = k === '15' ? 1.15 : 1.3, p = (k === '15' ? C.p15 : C.p30) - intento + .1 * hab('regateo');
    o.intentos = (o.intentos || 0) + 1;
    if (azar(p)) { o.pago = r10(o.pago * sube); o.contra = null; tono(880, .12, .08, 'triangle'); guardar(); return pantallaNegociar(i, uno(['Está bien, está bien. Pero que brille.', 'Ándale pues. Me caíste bien.', 'Trato. Pero si veo una mancha, te llamo a las tres de la mañana.'])); }
    o.pac--; tono(300, .2, .08, 'triangle', 200);
    if (o.pac <= 0) {
      H.ordenes.splice(i, 1);
      if (H.sel >= i && H.sel > 0) H.sel--;
      for (const e of H.equipos || []) if (e.o !== null) e.o = e.o === i ? null : e.o > i ? e.o - 1 : e.o;
      H.avisos.push(`${o.nombre} se cansó de regatear y llamó a ${RIVAL}.`);
      guardar();
      pantalla(`<div class="rotulo">Se fue<span>${esc(o.nombre)}</span></div><div class="cita"><b>${esc(o.nombre)}</b>${esc(uno(['¿Sabe qué? Ya llamé a El Cuñado. Cobra menos. Y contesta rápido.', 'Mejor lo dejamos. Me duele la cabeza.', 'No, no y no. Adiós.']))}</div>
        <div class="acciones"><button class="btn prim" id="volverN">Volver</button></div>`);
      $('#volverN').onclick = pantallaCamioneta; return;
    }
    if (C.contra) { o.contra = r10(o.pago * (1 + rnd(.05, .1))); guardar(); return pantallaNegociar(i, `${C.no} Mi oferta final: ${dinero(o.contra)}.`); }
    guardar(); pantallaNegociar(i, C.no);
  });
}

// Los equipos extra: cada camioneta lleva un compañero (opcional) y hasta 3 ayudantes a otro trabajo la misma noche.
function equiposHoy() {
  const H = S.hoy, n = S.eq.flota || 0;
  H.equipos = (H.equipos || []).slice(0, n);
  while (H.equipos.length < n) H.equipos.push({ o: null, comp: null, ayud: [] });
  return H.equipos;
}
function ocupados(excepto) {   // quién ya va en otra camioneta
  const H = S.hoy, comps = new Set([H.comp]), ayud = new Set(H.ayud);

  return { comps, ayud };
}

    ${S.angelica ? `<div class="jefe">${cara(ANGELICA.color, 'A')}<div><b>Angélica · ${L('coordinadora', 'coordinator')}</b>${esc(TRAD(H.angelica) || L('Firma los contratos y yo armo los equipos con la gente que haga falta para cada trabajo.', 'Sign the contracts and I\'ll put together teams with the people each job needs.'))}<div class="acciones" style="margin-top:6px"><button class="btn prim peq" id="organizar">${L('Que Angélica organice', 'Let Angélica organize')}</button></div></div></div>` : ''}
    ${eqs.map((e, k) => {
      const { comps, ayud } = ocupados(e), o = e.o !== null ? H.ordenes[e.o] : null;
      const libresO = H.ordenes.map((x, i) => [x, i]).filter(([x, i]) => !x.duelo && x.firmado && (!usadas.has(i) || i === e.o));
      const libresP = [...(e.comp ? [] : S.fijos.filter(id => !comps.has(id))).map(id => [`c:${id}`, `${COMPANEROS[id].n} (${L('compañero', 'partner')})`]),
        ...S.cuadrilla.filter(c => !ayud.has(c.id) && !e.ayud.includes(c.id)).map(c => [`a:${c.id}`, `${c.n} · ${L('fuerza', 'strength')} ${Math.round(c.fuerza * 100)}`])];
      const gente = [...(e.comp ? [[`c:${e.comp}`, COMPANEROS[e.comp].n]] : []), ...e.ayud.map(id => S.cuadrilla.find(c => c.id === id)).filter(Boolean).map(c => [`a:${c.id}`, c.n])];

function organizar() {
  const H = S.hoy, eqs = equiposHoy();
  eqs.forEach(e => { e.o = null; e.comp = null; e.ayud = []; });
  const comps = S.fijos.filter(id => id !== H.comp), gente = S.cuadrilla.filter(c => !H.ayud.includes(c.id)).sort((a, b) => b.fuerza * (b.cuidado || 3) - a.fuerza * (a.cuidado || 3));
  const mio = H.ordenes[H.sel], trabajos = H.ordenes.map((o, i) => [o, i]).filter(([o, i]) => i !== H.sel && o.firmado && !o.duelo && !o.gigante).sort((a, b) => b[0].pago - a[0].pago);
  const plan = mio && mio.gigante ? [['mio', 3], ['mio', 3], ...trabajos.map(([o, i]) => [i, sugerido(o)])] : trabajos.map(([o, i]) => [i, sugerido(o)]);
  let armados = 0, sinGente = 0;
  for (const e of eqs) {
    const [o, n] = plan.shift() || [];
    if (o === undefined) break;
    if ((comps.length ? 1 : 0) + gente.length < Math.min(n, 2)) { sinGente++; continue; }
    e.o = o; if (comps.length) e.comp = comps.shift();
    while (e.ayud.length + (e.comp ? 1 : 0) < n && gente.length && e.ayud.length < 3) e.ayud.push(gente.shift().id);
    if (e.ayud.length + (e.comp ? 1 : 0) < n) sinGente++; else armados++;
  }
  const quedan = plan.length;
  return `${uno(ANGELICA.frases)} ${armados} ${armados === 1 ? 'equipo sale' : 'equipos salen'} esta noche.${sinGente ? ` Me falta gente para ${sinGente} ${sinGente === 1 ? 'equipo' : 'equipos'}: contrata más.` : ''}${quedan && !sinGente ? ` Hay ${quedan} ${quedan === 1 ? 'trabajo firmado' : 'trabajos firmados'} sin camioneta: compra más camionetas.` : ''}`;
}
const conSeguro = d => S.fase === 'empresa' && EQ().seguro ? r10(d / 2) : d;   // con seguro, cada daño cuesta la mitad
function resolverB(b) {
  const o = b.orden, gente = [...(b.comp ? [{ ...COMPANEROS[b.comp], id: null }] : []), ...b.ayud.map(id => S.cuadrilla.find(c => c.id === id)).filter(Boolean)];
  const fuerza = gente.reduce((a, g) => a + g.fuerza, 0), dif = o.micras / 1800 * o.campanas * (1 + o.filtros / 8) * (o.ayud > b.ayud.length ? 1.5 : 1);
  const ayudG = gente.filter(g => g.animo), animo = ayudG.length ? ayudG.reduce((a, g) => a + g.animo, 0) / ayudG.length : 3;
  let p = .2 + fuerza / dif * .45 + kit((b.k || 2) - 2) * .08 + (animo - 3) * .05 + (S.angelica ? .05 : 0) + .05 * hab('capacita');
  const cosas = []; let dano = 0;
  const torpe = gente.find(g => g.cuidado && azar((5 - g.cuidado) * .08));
  if (torpe) { dano += uno([20, 40]); cosas.push(`${torpe.n} tiró algo que no debía.`); }
  if (b.comp === 'lupe') { p += .15; cosas.push('Lupe revisó cada esquina dos veces. Y a los ayudantes, tres.'); }
  if (b.comp === 'beto' && azar(.4)) { dano = uno([40, 80, 120]); cosas.push(uno(['Beto rompió una lámpara del techo con la escalera.', 'Beto confundió el desengrasante con el refresco del chef.', 'Beto se quedó encerrado en la cámara fría veinte minutos.'])); }
  if (b.comp === 'chuy' && azar(.35)) { p -= .25; cosas.push('Chuy se durmió en el ducto. Lo despertó el gerente a las cinco.'); }
  p = clamp(p, .05, .95);
  const aprobado = azar(p), notaA = aprobado && azar(p * .7);
  if (o.pedido) cosas.push(aprobado ? 'Cumplieron el pedido especial del cliente.' : 'Se les olvidó el pedido especial. El cliente no está contento.');
  if (!cosas.length) cosas.push(uno(['Trabajaron callados, como profesionales. Raro, pero bien.', 'Pusieron cumbia y limpiaron a buen ritmo.', 'El gerente les invitó un café. Dicen que estaba bueno.']));
  const lineas = [[`Equipo B en ${o.nombre}${aprobado ? '' : ' (no pasó: pago parcial)'}`, aprobado ? o.pago : r10(o.pago * .4)], ['Equipo B: sueldos', -gente.reduce((a, g) => a + r10((g.sueldo || 0) * (g.prueba ? .8 : 1) * sueldoMult()), 0)], ['Equipo B: gasolina', -GASOLINA]];
  if (dano) lineas.push([`Equipo B: daños${EQ().seguro ? ' (el seguro paga la mitad)' : ''}`, -conSeguro(dano)]);
  if (o.garantia && !notaA) lineas.push(['Equipo B: garantía de A incumplida', -r10(o.pago * .3)]);
  return { o, aprobado, notaA, gente, lineas, cosas, k: b.k, rep: (aprobado ? 3 : -5) + (o.garantia ? (notaA ? 1 : -3) : 0) };
}

  const sal = $('#salir'); if (sal) sal.onclick = () => {

    const equipo = [...c.solo ? [] : [{ principal: true, n: c.n, color: c.color, fuerza: c.fuerza, sueldo: S.fase === 'aprendiz' ? 0 : c.sueldo }], ...S.cuadrilla.filter(x => H.ayud.includes(x.id)).map(x => ({ id: x.id, n: x.n, color: x.color, fuerza: x.fuerza, frase: x.frase, sueldo: x.prueba ? r10(x.sueldo * .8) : x.sueldo, cuidado: x.cuidado || 3, puntual: x.puntual || 3, esp: x.esp, tipo: x.tipo, rasgo: x.rasgo }))];
    // Una camioneta solo sale si lleva la gente que pide el trabajo.

    const conGente = e => gen(e) >= 2;
    const equipos = eqs.filter(({ e }) => typeof e.o === 'number' && e.o !== H.sel && H.ordenes[e.o] && H.ordenes[e.o].firmado && gen(e) >= sugerido(H.ordenes[e.o])).map(({ e, k }) => ({ orden: H.ordenes[e.o], comp: e.comp, ayud: [...e.ayud], k }));
    const ayudan = o.gigante ? eqs.filter(({ e }) => e.o === 'mio' && conGente(e)).map(({ e, k }) => ({ comp: e.comp, ayud: [...e.ayud], k })).slice(0, o.finde ? 2 : 99) : [];
    empezarTurno({ ...o, comp: H.comp, equipo, retraso: H.retraso || 0, animo: !!H.animo, donas: !!H.donas, retos: H.retos || [], equipos, ayudan, espumaExtra: H.espumaExtra || 0 });

    tono(660, .1, .06, 'triangle'); guardar(); pantallaCamioneta();

  const fa = $('#ficharAngelica'); if (fa) fa.onclick = () => { S.dinero -= ANGELICA.adelanto; S.angelica = true; sCaja(); guardar(); pantallaCamioneta(); };
  const org = $('#organizar'); if (org) org.onclick = () => { H.angelica = organizar(); tono(880, .1, .08, 'triangle'); guardar(); pantallaCamioneta(); };
  const ae = $('#anuncioEmpleo'); if (ae) ae.onclick = () => { S.dinero -= 60; S.candidatos = genCandidatos(4 + (S.eq.flota || 0)); sCaja(); guardar(); pantallaCamioneta(); };
  P.querySelectorAll('[data-kit]').forEach(b => b.onclick = () => { const k = +b.dataset.kit; S.kits = S.kits || []; const sig = KITS[kit(k) + 1]; S.dinero -= sig.p; S.kits[k] = kit(k) + 1; sCaja(); guardar(); pantallaCamioneta(); });
  P.querySelectorAll('[data-fijo]').forEach(b => b.onclick = () => { const c = S.cuadrilla.find(x => x.id === +b.dataset.fijo); c.prueba = false; sCaja(); guardar(); pantallaCamioneta(); });
  P.querySelectorAll('[data-contratar]').forEach(b => b.onclick = () => {

    if (H.ayud.length < PLAZAS[S.eq.camioneta]) H.ayud.push(c.id);

    const id = +b.dataset.despedir;
    S.cuadrilla = S.cuadrilla.filter(x => x.id !== id); H.ayud = H.ayud.filter(x => x !== id);

  P.querySelectorAll('[data-tun]').forEach(b => b.onclick = () => {

    if (t.id === 'bocina') bocina(); else tono(880, .1, .08); guardar(); pantallaCamioneta();
  });
  P.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = TIENDA.find(x => x.id === b.dataset.t); S.dinero -= t.p; t.f(S); guardar(); tono(880, .1, .08); pantallaCamioneta(); });
}

function pantallaAjustes(enTurno, desdeInicio) {

    ['resaltar', L('Resaltar suciedad', 'Highlight dirt'), L('Lo que falta parpadea en naranja.', 'What is left blinks orange.')],

    ['sonido', L('Sonido', 'Sound'), L('Raspados, chorros, spray y alarmas.', 'Scraping, water jets, spray and alarms.')],
    ['radio', 'Radio Grasa FM', L('Música inventada y un locutor nocturno durante el turno.', 'Made-up music and a late-night DJ during your shift.')],
    ['vibrar', L('Vibración', 'Vibration'), L('El celular vibra con los combos, al migdalear, con el espejo y con la nota del inspector. En iPhone no se puede.', 'The phone vibrates on combos, while polishing, on mirror finishes and with the inspector\'s grade. Not available on iPhone.')],

    ${selectorIdioma()}
    ${enTurno && M.retos.length ? `<div class="retos"><b>${L('Retos de esta noche', 'Tonight\'s challenges')}</b>${M.retos.map(id => `<span>☆ ${esc(tReto(reto(id)))}</span>`).join('')}</div>` : ''}
    ${op.map(([k, n, d]) => `<button class="ajuste" data-k="${k}" aria-pressed="${!!S.aj[k]}"><span><b>${n}</b><small>${d}</small></span><span class="interruptor"></span></button>`).join('')}
    ${Object.keys(S.hab || {}).length ? `<div class="cita"><b>${L('Tus habilidades', 'Your skills')}</b>${Object.entries(S.hab).filter(([, n]) => n).map(([k, n]) => `${L(...HAB[k].n)}${HAB[k].max > 1 ? ' ' + 'I'.repeat(n) : ''}`).join(' · ')}</div>` : ''}
    <div class="cita"><b>${L('Cómo se juega', 'How to play')}</b>${L('Antes de limpiar: cierra pilotos, corta la luz, cubre la cocina y envuelve la campana con plástico. Luego, pasadas cortas con la rasqueta; varias seguidas en la misma dirección hacen combo. La espuma ablanda la costra si esperas un par de segundos. Mantén el botón redondo para abrir la rueda de herramientas. Si la campana no cabe en la pantalla, arrastra con dos dedos (o con uno sobre la pared o el suelo) para mover la vista. El aviso naranja del borde te dice si falta algo por ese lado: tócalo y te lleva. En ordenador, las flechas del teclado y las teclas 1 a 4.', 'Before cleaning: shut off the pilot lights, cut the power, cover the kitchen and wrap the hood in plastic. Then make short strokes with the scraper; several in a row in the same direction make a combo. Foam softens the crust if you wait a couple of seconds. Hold the round button to open the tool wheel. If the hood does not fit on screen, drag with two fingers (or with one on the wall or floor) to move the view. The orange tab on the edge tells you something is left on that side: tap it to go there. On a computer, use the arrow keys and keys 1 to 4.')}</div>
    <div class="acciones">${enTurno ? `<button class="btn prim" id="volver">${L('Seguir el turno', 'Back to work')}</button><button class="btn" id="abandonar">${L('Llamar al inspector ya', 'Call the inspector now')}</button>` : `<button class="btn prim" id="volver">${L('Volver', 'Back')}</button><button class="btn" id="menu">${L('Menú principal', 'Main menu')}</button>`}</div>`);
  enlazarIdioma(() => { pantallaAjustes(enTurno, desdeInicio); if (M) pintarHud(true); });
  P.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k; S.aj[k] = !S.aj[k]; b.setAttribute('aria-pressed', S.aj[k]); U.hl.value = M && M.fase === 'turno' ? hlBase() : 0; guardar();
    if (k === 'ahorro') { calidad(); redimensionar(); }

  });
  $('#volver').onclick = () => { if (enTurno) { P.hidden = true; M.pausa = false; } else if (desdeInicio) pantallaInicio(); else pantallaCamioneta(); };

// La nota explicada: de dónde salen los puntos, cuánto faltó para la siguiente letra y qué cambiar la próxima vez.
function explicarNota({ pts, n, zonas, limpio, aprobado, espejo, pulido, finMin, ped, pedOk, d, ganaDuelo }) {
  const rapidez = aprobado ? Math.round(clamp((480 - finMin) / 480, 0, .5) * 20) : 0, p = M.prep;
  const prep = (p.gas ? 2 : 0) + (p.luz ? 2 : 0) + Math.round(p.cubierto * 3) + (p.bolsa ? 3 : 0);
  const filas = [
    [L('Limpieza de las zonas', 'Zone cleaning'), Math.round(limpio * 45), 45],
    [L(`Todo bajo ${LIMITE} µm`, `Everything under ${LIMITE} µm`), aprobado ? 15 : 0, 15],
    [L('Migdaleado y espejo', 'Polish and mirror'), Math.round(pulido * 12) + (espejo ? 5 : 0), 17],
    [L('Rapidez', 'Speed'), rapidez, 10],
    [L('Preparación', 'Prep'), prep, 10],
  ];
  if (M.danos.length) filas.push([L(`Daños (${M.danos.length})`, `Damage (${M.danos.length})`), -4 * M.danos.length, 0]);
  if (M.enojado) filas.push([L('Gerente enojado', 'Angry manager'), -5, 0]);
  if (ped && !ped.tacos) filas.push([L('Pedido del cliente', 'Client request'), pedOk ? 5 : -6, 5]);
  if (d) filas.push([L('Duelo', 'Duel'), ganaDuelo ? 4 : -2, 4]);
  const sig = [...NOTAS].reverse().find(x => x[0] > pts);
  const tips = [];
  const sucias = zonas.filter(z => z.m > LIMITE);
  if (sucias.length) tips.push(L(`Faltó bajar de ${LIMITE} µm: ${sucias.map(z => `${z.n} (${z.m.toLocaleString('es-MX')} µm)`).join(', ')}. Sin eso no se aprueba.`, `Not under ${LIMITE} µm: ${sucias.map(z => `${z.n} (${z.m.toLocaleString('es-MX')} µm)`).join(', ')}. You can't pass without it.`));
  const faltaPrep = [!p.gas && L('cerrar el gas', 'turn off the gas'), !p.luz && L('cortar la luz', 'cut the power'), p.cubierto < 1 && L('cubrir los aparatos', 'cover the appliances'), !p.bolsa && L('plástico y bolsa', 'plastic and bag')].filter(Boolean);
  if (faltaPrep.length) tips.push(L(`En la preparación faltó: ${faltaPrep.join(', ')}. Son ${10 - prep} puntos fáciles y evitan daños.`, `Prep was missing: ${faltaPrep.join(', ')}. That's ${10 - prep} easy points and it prevents damage.`));
  if (M.danos.length) tips.push(L(`Cada daño quita 4 puntos (y a veces dinero): ${M.danos.slice(0, 2).map(x => TRAD(x.t)).join('; ')}.`, `Each damage costs 4 points (and sometimes money): ${M.danos.slice(0, 2).map(x => TRAD(x.t)).join('; ')}.`));
  if (aprobado && pulido < .8) tips.push(L(`Migdaleaste el ${Math.round(pulido * 100)} % de la campana: pásale el pulidor a todo el metal limpio (hasta 12 puntos).`, `You polished ${Math.round(pulido * 100)}% of the hood: run the polisher over all the clean metal (up to 12 points).`));
  if (aprobado && !espejo) tips.push(L('Si bajas todo a 50 µm o menos sale «metal desnudo»: +5 puntos y más reputación.', 'Get everything to 50 µm or less for «bare metal»: +5 points and more reputation.'));
  if (M.enojado) tips.push(L('El gerente se enojó: contéstale cuando pregunta o termina antes de que pierda la paciencia.', 'The manager got angry: answer him when he asks, or finish before he runs out of patience.'));
  if (rapidez < 5 && aprobado) tips.push(L(`Llamaste al inspector a las ${hora(finMin)}: llamarlo antes da hasta 10 puntos.`, `You called the inspector at ${hora(finMin)}: calling earlier gives up to 10 points.`));
  return `<div class="cita por-que"><b>${L('¿Por qué esta nota?', 'Why this grade?')} · ${pts} ${L('puntos', 'points')}</b>

// El antes y el después: se guarda en el álbum cuando ya hay nota y foto.
function fotoParte(m) {
  if (m.fotoDespues === undefined || m.nota === undefined || m.fotoGuardada) return;
  m.fotoGuardada = true;
  const antes = m.fotoAntes && m.fotoAntes.startsWith('data:') ? m.fotoAntes : null, despues = m.fotoDespues || null;
  if (!despues) return;
  const f = { noche: m.nocheParte, nombre: m.nombre, nota: m.nota, antes, despues };
  guardarFoto(f);
  const el = $('#fotoParte'); if (el) el.innerHTML = tarjetaFoto(f);
  if (fotos().length >= 6 && !S.medallas.fotos) { S.medallas.fotos = S.noche; guardar(); if (el) el.insertAdjacentHTML('beforeend', `<div class="medallas">${tarjetaMedalla(medalla('fotos'), true)}</div>`); }
}
const tarjetaFoto = f => `<figure class="foto"><div class="foto-par">${f.antes ? `<div><img src="${f.antes}" alt="${L('Antes', 'Before')}"><span>${L('Antes', 'Before')}</span></div>` : ''}<div><img src="${f.despues}" alt="${L('Después', 'After')}"><span>${L('Después', 'After')}</span></div></div>

// Evaluar a los equipos: felicitar o regañar cambia su ánimo (y a veces su cuidado). Con el ánimo en cero, renuncian.
function pantallaEvaluar(items) {
  pantalla(`<div class="rotulo">${L('Evalúa a tus equipos<span>Lo que hicieron esta noche</span>', 'Review your teams<span>What they did tonight</span>')}</div>
    ${items.map((it, i) => `<div class="evalua" data-ei="${i}"><div class="fila"><b>${esc(TRAD(it.t))}</b><span class="nota-mini" style="--c:${COL_NOTA[it.nota]}">${it.nota}</span></div>
      <span class="nota">${esc(it.gente.map(g => g.n + (g.animo ? ` (${L('ánimo', 'morale')} ${'●'.repeat(g.animo)})` : '')).join(', '))}</span><span>${esc(TRAD(it.txt))}</span>
      <div class="acciones"><button class="btn peq prim" data-ev="${i}|fel">${L('Felicitar', 'Praise')}</button><button class="btn peq" data-ev="${i}|reg">${L('Regañar', 'Scold')}</button><button class="btn peq" data-ev="${i}|nada">${L('Dejarlo así', 'Leave it')}</button></div><p class="respuesta-ev"></p></div>`).join('')}
    <p class="nota">${L('Felicitar sube el ánimo (y con buen ánimo trabajan mejor). Regañar por un mal trabajo les baja el ánimo pero a veces aprenden a tener más cuidado; regañar a quien lo hizo bien… mejor no.', 'Praise raises morale (and good morale means better work). Scolding bad work lowers morale but sometimes they learn to be more careful; scolding people who did well… better not.')}</p>
    <div class="acciones"><button class="btn prim" id="seguirEv">${L('Seguir', 'Continue')}</button></div>`);
  P.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => {
    const [i, k] = b.dataset.ev.split('|'), it = items[+i], caja = P.querySelector(`[data-ei="${i}"]`);
    caja.querySelectorAll('[data-ev]').forEach(x => x.disabled = true);
    const ayud = it.gente.map(g => g.id && S.cuadrilla.find(c => c.id === g.id)).filter(Boolean), se = [];
    let txt;
    if (k === 'fel') { ayud.forEach(c => { c.animo = Math.min(5, (c.animo || 3) + 1 + (hab('ambiente') >= 2 ? 1 : 0)); if (!it.bien && azar(.3)) c.cuidado = Math.max(1, c.cuidado - 1); }); txt = it.bien ? L('«¡Gracias, jefe! Así da gusto.»', '«Thanks, boss! That\'s how you do it.»') : L('«¿En serio? ¡Gracias! (Se van muy relajados.)»', '«Really? Thanks! (They leave very relaxed.)»'); tono(880, .12, .08, 'triangle'); }
    else if (k === 'reg') {
      // Regañar a quien hizo bien su trabajo duele el doble (y el triple si sacó A); y a veces lo van contando por ahí.
      ayud.forEach(c => { const baja = it.bien ? (it.nota === 'A' ? 3 : 2) : 1; c.animo = (c.animo || 3) - (hab('ambiente') ? Math.ceil(baja / 2) : baja); if (!it.bien && azar(.5)) c.cuidado = Math.min(5, c.cuidado + 1); });
      txt = it.bien ? L('«¿Y ahora qué hicimos? Si quedó bien…» (Se van ofendidos.)', '«What did we do now? It turned out fine…» (They leave offended.)') : L('«Tiene razón, jefe. No vuelve a pasar.»', '«You\'re right, boss. It won\'t happen again.»'); tono(300, .2, .08, 'triangle', 200);
      if (it.bien && S.fase === 'empresa' && S.clientes.length && azar(it.nota === 'A' ? .2 : .1)) {
        const cl = uno(S.clientes); S.clientes = S.clientes.filter(x => x !== cl); perdido(cl);
        txt += L(` Se fueron quejando de ti por todo el barrio. ${RIVAL} se enteró y le dijo a ${cl.nombre} que tu empresa «trata mal a su gente». ${cl.nombre} se fue con él. Gánale un duelo para recuperarlo.`, ` They went around the whole neighborhood complaining about you. ${RIVAL} heard and told ${cl.nombre} your company «treats its people badly». ${cl.nombre} went with him. Beat him in a duel to win them back.`);
      }
    }
    else txt = L('Asienten y se van a la camioneta.', 'They nod and head to the truck.');
    for (const c of ayud) if (c.animo <= 0) { S.cuadrilla = S.cuadrilla.filter(x => x !== c); se.push(c.n); }
    if (k === 'reg' && ayud.some(c => c.animo === 1 && !se.includes(c.n))) txt += L(' Con el ánimo por los suelos van a llegar tarde más seguido.', ' With morale on the floor they\'ll be late more often.');
    if (se.length) txt += L(` ${se.join(' y ')} ${se.length > 1 ? 'renunciaron' : 'renunció'}. ${se.length > 1 ? 'Dejaron sus rasquetas' : 'Dejó la rasqueta'} en tu escritorio.`, ` ${se.join(' and ')} quit. ${se.length > 1 ? 'They left their scrapers' : 'Left the scraper'} on your desk.`);
    caja.querySelector('.respuesta-ev').textContent = txt; guardar();
  });
  $('#seguirEv').onclick = () => { guardar(); siguiente(); };
}

// El árbol: una rama a la vez, de abajo (lo básico) hacia arriba (el maestro).
let ramaVista = 'limpieza', reinicioPend = false;
function pantallaArbol(volver) {
  S.hab = S.hab || {}; S.puntos = S.puntos || 0;
  const r = ARBOL.find(x => x.id === ramaVista) || ARBOL[0], gastado = enRama(r), costo = 500 * S.nivel, total = Object.values(S.hab).reduce((a, n) => a + n, 0);
  pantalla(`<div class="rotulo">${L('Habilidades', 'Skills')}<span>${S.puntos ? `⭐ ${S.puntos} ${S.puntos === 1 ? L('punto para gastar', 'point to spend') : L('puntos para gastar', 'points to spend')}` : L('Sin puntos: sube de nivel para ganar más', 'No points: level up to earn more')}</span></div>
    <div class="ramas">${ARBOL.map(x => `<button data-rama="${x.id}" aria-pressed="${x.id === r.id}"><i>${x.ico}</i><b>${L(...x.n)}</b><small>${enRama(x)}/${x.hab.reduce((a, h) => a + h.max, 0)}</small></button>`).join('')}</div>
    <div class="camino">${[...r.hab].reverse().map(h => {
      const n = hab(h.id), lleno = n >= h.max, abierto = gastado >= h.pide || n > 0, puede = !lleno && abierto && S.puntos > 0;
      return `<div class="nodo ${lleno ? 'lleno' : n ? 'parte' : abierto ? 'abierto' : 'cerrado'}${h.pide >= 8 ? ' maestro' : ''}">
        <div class="bola">${lleno ? '✓' : abierto ? r.ico : '🔒'}</div>
        <div class="txt"><div class="fila"><b>${L(...h.n)}</b><span class="rangos">${'●'.repeat(n)}${'○'.repeat(h.max - n)}</span></div>
          <span class="nota">${L(...h.d)}</span>
          ${abierto ? '' : `<small class="pide">${L(`Pide ${h.pide} ${h.pide === 1 ? 'punto' : 'puntos'} en ${r.n[0]} (llevas ${gastado})`, `Needs ${h.pide} ${h.pide === 1 ? 'point' : 'points'} in ${r.n[1]} (you have ${gastado})`)}</small>`}
          ${puede ? `<button class="btn prim peq" data-h="${h.id}">${L('Aprender', 'Learn')} · ⭐ 1</button>` : ''}</div></div>`;
    }).join('')}</div>
    <div class="acciones"><button class="btn prim" id="arbolListo">${L('Listo', 'Done')}</button>${total ? `<button class="btn" id="reiniciar" ${S.dinero < costo ? 'disabled' : ''}>${reinicioPend ? L('¿Seguro? Toca otra vez', 'Sure? Tap again') : L('Reiniciar', 'Reset')} · ${dinero(costo)}</button>` : ''}</div>
    <p class="nota">${L('Reiniciar te devuelve todos los puntos para repartirlos de nuevo.', 'Resetting gives you back all your points to spend again.')}</p>`);
  P.querySelectorAll('[data-rama]').forEach(b => b.onclick = () => { ramaVista = b.dataset.rama; reinicioPend = false; pantallaArbol(volver); });
  P.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { S.hab[b.dataset.h] = hab(b.dataset.h) + 1; S.puntos--; reinicioPend = false; guardar(); sDing(); pantallaArbol(volver); });
  $('#arbolListo').onclick = () => { reinicioPend = false; volver(); };
  const re = $('#reiniciar');
  if (re) re.onclick = () => {
    if (!reinicioPend) { reinicioPend = true; return pantallaArbol(volver); }
    reinicioPend = false; S.dinero -= costo; S.puntos += total; S.hab = {}; guardar(); sCaja(); pantallaArbol(volver);
  };
}
