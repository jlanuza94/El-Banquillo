<title>Hood Cleaners: The Night Shift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Turno de noche: pantalla a sangre con la cocina en 3D; paneles de acero oscuro, grasa ámbar y naranja de seguridad para lo que se toca. */
:root {
  --noche: #131d26;
  --panel: rgba(28, 42, 53, .94);
  --panel-solido: #1c2a35;
  --panel-2: #243542;
  --linea: #344957;
  --acero: #d3dae0;
  --tenue: #8fa1ae;
  --grasa: #e0a040;
  --hivis: #ff8a1f;
  --hivis-tinta: #1a1004;
  --espuma: #9fe0ef;
  --ok: #69c97a;
  --mal: #ff6a5c;
  --f-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --f-cuerpo: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --lado-i: max(16px, env(safe-area-inset-left, 0px));
  --lado-d: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--noche); color: var(--acero); font-family: var(--f-cuerpo); font-size: 15px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
input { font: inherit; -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--hivis); outline-offset: 2px; }
#juego { position: fixed; inset: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.vineta { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(4,8,12,.42) 100%); }

/* HUD del turno */
.hud-arriba { position: absolute; left: 0; right: 0; top: 0; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); padding-bottom: 18px; display: grid; gap: 6px; pointer-events: none; background: linear-gradient(rgba(10,16,22,.75), rgba(10,16,22,0)); }
.hud-fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.reloj { font-family: var(--f-mono); font-size: 26px; font-weight: 600; color: var(--hivis); font-variant-numeric: tabular-nums; line-height: 1; }
.cliente { font-family: var(--f-cond); font-weight: 700; font-size: 16px; letter-spacing: .03em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-ico { pointer-events: auto; background: var(--panel); border: 1px solid var(--linea); border-radius: 6px; width: 40px; height: 40px; display: grid; place-items: center; font-size: 14px; flex: none; }
.tiempo { height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
.tiempo div { height: 100%; background: var(--hivis); }
.chat { display: grid; gap: 5px; justify-items: start; }
.burbuja { pointer-events: auto; max-width: min(88%, 400px); background: rgba(17,25,33,.8); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); border: 1px solid var(--linea); border-radius: 4px 12px 12px 12px; padding: 5px 9px; display: grid; grid-template-columns: 24px 1fr; gap: 7px; align-items: start; animation: entra .25s ease-out; font-size: 13px; line-height: 1.3; }
/* Lo que dicen se lee en dos o tres líneas; tocar el globo lo cierra. */
.burbuja > div > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.burbuja .cara { width: 24px; height: 24px; border-radius: 50% 50% 6px 6px; display: grid; place-items: center; font-family: var(--f-display); font-size: 11px; color: var(--hivis-tinta); }
.burbuja b { font-family: var(--f-cond); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); display: block; }
/* La radio pasa en una cinta de una línea, debajo de los pasos, sin tapar la cocina. */
.cinta { pointer-events: none; display: flex; align-items: center; height: 22px; overflow: hidden; white-space: nowrap; background: rgba(36,22,58,.72); border: 1px solid rgba(198,160,255,.35); border-radius: 999px; font-size: 12.5px; color: #e6d8ff; }
.cinta b { flex: none; font-family: var(--f-cond); font-size: 11px; letter-spacing: .06em; color: #10161c; background: #c6a0ff; border-radius: 999px; padding: 0 8px; line-height: 20px; margin-left: 1px; }
.cinta div { flex: 1; overflow: hidden; min-width: 0; }
.cinta span { display: inline-block; padding-left: 100%; animation: cinta var(--dur, 12s) linear forwards; }
@keyframes cinta { to { transform: translateX(-100%); } }
.burbuja .resp { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
@keyframes entra { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

.hud-abajo { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); padding-top: 24px; display: grid; gap: 8px; pointer-events: none; background: linear-gradient(rgba(10,16,22,0), rgba(10,16,22,.8)); }
.zonas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.zonas button { pointer-events: auto; background: var(--panel); border: 1px solid var(--linea); border-radius: 6px; padding: 5px 8px; text-align: left; display: grid; min-width: 0; }
.zonas button[aria-pressed="true"] { border-color: var(--hivis); }
.zonas b { font-family: var(--f-cond); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zonas span { font-family: var(--f-mono); font-size: 12px; color: var(--tenue); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; min-width: 0; white-space: nowrap; }
.zonas em { font-style: normal; flex: none; }
.zonas em small { font-size: inherit; }
.zonas .con-q em small { display: none; }   /* con etiqueta, el número solo: así cabe el nombre del equipo */
.zonas .con-q span { font-size: 11px; gap: 3px; }
.zonas .con-q i { font-size: 10px; padding: 0 4px; }
.zonas button { padding-left: 6px; padding-right: 6px; }
/* Quién trabaja la zona: una etiqueta corta de color en lugar del nombre completo del equipo. */
.zonas i { font-style: normal; font-family: var(--f-cond); font-weight: 700; font-size: 11px; letter-spacing: .03em; padding: 0 5px; border-radius: 4px; background: var(--zq, #3a4652); color: #10161c; overflow: hidden; text-overflow: ellipsis; min-width: 0; line-height: 1.45; }
.zonas i:empty { display: none; }
.zonas i.rev { background: var(--grasa); }
.zonas i.ok { background: none; color: var(--ok); padding: 0; }
.zonas .listo span { color: var(--ok); }
.zonas button:disabled { opacity: .4; }
.botones-hud { display: flex; gap: 6px; flex-wrap: wrap; }
.btn.robot { background: #2a3d4a; border-color: #7fd3e6; color: #bfeefa; }
.zonas button.revisar { border-color: var(--grasa); box-shadow: 0 0 0 1px var(--grasa); }
.filas-reparto { display: grid; gap: 6px; max-height: 40vh; overflow-y: auto; }
.filas-reparto label { display: grid; grid-template-columns: 1fr 1.2fr; gap: 8px; align-items: center; font-family: var(--f-cond); font-weight: 700; font-size: 15px; }
.filas-reparto select, .evalua select { font: inherit; font-size: 14px; background: var(--panel-solido); color: var(--acero); border: 1px solid var(--linea); border-radius: 6px; padding: 6px; }
.mandos { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.herr-btn { pointer-events: auto; width: 78px; height: 78px; border-radius: 50%; background: var(--panel-solido); border: 3px solid var(--hivis); display: grid; place-items: center; align-content: center; touch-action: none; flex: none; }
.herr-btn svg { width: 34px; height: 34px; }
.herr-btn small { font-family: var(--f-cond); font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
.info { display: grid; gap: 4px; justify-items: start; min-width: 0; }
.ayuda { font-size: 13px; color: var(--acero); text-shadow: 0 1px 2px #000; min-height: 1.4em; }
.ayuda:not(:empty) { background: rgba(10,16,22,.62); padding: 2px 8px; border-radius: 6px; }
.pasos { display: flex; flex-wrap: wrap; gap: 4px; }
/* Mientras mueves la vista, el HUD se aparta para ver la cocina. */
.hud-arriba, .hud-abajo, #herrBtn { transition: opacity .2s; }
body.moviendo .hud-arriba, body.moviendo .hud-abajo, body.moviendo #herrBtn { opacity: .25; }
.tuto { pointer-events: none; background: #ffd23f; color: #1a1004; border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 15px; line-height: 1.3; box-shadow: 0 4px 14px #0008; }
.tuto small { display: block; font-family: var(--f-cond); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; opacity: .7; }
@keyframes tutoBrilla { 0%, 100% { box-shadow: 0 0 0 0 #ffd23f00; } 50% { box-shadow: 0 0 0 5px #ffd23f; } }
body[data-recom="rasqueta"] [data-hb="rasqueta"], body[data-recom="espuma"] [data-hb="espuma"], body[data-recom="hidro"] [data-hb="hidro"],
body[data-tuto="espuma"] [data-hb="espuma"], body[data-tuto="zonas"] #zonas button, body[data-tuto="siguiente"] #siguiente { animation: tutoBrilla 1.1s ease-in-out infinite; border-radius: 10px; }
.pasos span { font-family: var(--f-cond); font-weight: 700; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: var(--panel-2); color: var(--tenue); }
.pasos .hecho { color: var(--ok); }
.pasos .act { background: var(--hivis); color: var(--hivis-tinta); }
.barra-herr { display: flex; gap: 6px; pointer-events: auto; }
.barra-herr button { width: 56px; height: 54px; border-radius: 8px; background: var(--panel); border: 2px solid var(--linea); display: grid; place-items: center; align-content: center; padding: 2px; }
.barra-herr button[aria-pressed="true"] { border-color: var(--hivis); background: var(--panel-2); }
.barra-herr svg { width: 24px; height: 24px; }
.barra-herr small { font-family: var(--f-cond); font-weight: 700; font-size: 10.5px; text-transform: uppercase; line-height: 1.1; }
.barra-herr .gasto { color: var(--espuma); font-family: var(--f-mono); font-size: 10px; }
.combo { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: 40px; color: var(--hivis); text-shadow: 0 3px 0 var(--hivis-tinta), 0 0 18px rgba(255,138,31,.5); pointer-events: none; opacity: 0; white-space: nowrap; }
.combo.ve { animation: combo .7s ease-out; }
.combo-med { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 4px; display: grid; grid-template-columns: auto auto; align-items: center; gap: 3px 8px; padding: 4px 10px 5px; border-radius: 10px; background: rgba(17,25,33,.78); border: 1px solid var(--linea); pointer-events: none; }
.combo-med b { font-family: var(--f-display); font-size: 15px; color: var(--acero); letter-spacing: .03em; }
.combo-med[data-nivel="2"] b { color: var(--hivis); }
.combo-med[data-nivel="3"] b { color: #ffd23f; text-shadow: 0 0 8px rgba(255,210,63,.6); }
.combo-med .pasos-c { display: flex; gap: 3px; align-items: center; }
.combo-med .pasos-c i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--tenue); }
.combo-med .pasos-c i.si { background: var(--hivis); border-color: var(--hivis); }
.combo-med .pasos-c i.corte { margin-right: 5px; }
.combo-med .pasos-c small { font-family: var(--f-mono); font-size: 11px; color: var(--tenue); }
.combo-med .ventana { grid-column: 1 / -1; height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
.combo-med .ventana span { display: block; height: 100%; background: var(--hivis); animation: ventanaCombo 1.3s linear forwards; }
@keyframes ventanaCombo { from { width: 100%; } to { width: 0; } }
@keyframes combo { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
.falta { position: absolute; top: 50%; transform: translateY(-50%); border: 0; background: var(--hivis); color: var(--hivis-tinta); font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; padding: 10px 8px; box-shadow: 0 0 18px rgba(255,138,31,.6); animation: falta 1s ease-in-out infinite alternate; writing-mode: vertical-rl; }
#faltaI { left: 0; border-radius: 0 10px 10px 0; padding-left: max(8px, env(safe-area-inset-left, 0px)); transform: translateY(-50%) rotate(180deg); }
#faltaD { right: 0; border-radius: 10px 0 0 10px; padding-right: max(8px, env(safe-area-inset-right, 0px)); }
@keyframes falta { to { opacity: .55; } }
.aqui { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 2; }
.aqui::before { content: ""; position: absolute; left: -26px; top: -26px; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--hivis); box-shadow: 0 0 0 2px rgba(0,0,0,.35), 0 0 14px rgba(255,138,31,.6); animation: aquiLate 1s ease-in-out infinite; }
.aqui span { position: absolute; left: 0; top: -50px; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; background: var(--hivis); color: var(--hivis-tinta); border-radius: 999px; padding: 1px 8px; }
@keyframes aquiLate { 0%, 100% { transform: scale(.85); opacity: 1; } 50% { transform: scale(1.12); opacity: .7; } }

/* Rueda de herramientas */
.rueda { position: absolute; width: 250px; height: 250px; margin: -125px 0 0 -125px; pointer-events: none; }
.rueda .sector { position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: var(--panel-solido); border: 2px solid var(--linea); display: grid; place-items: center; align-content: center; text-align: center; }
.rueda .sector svg { width: 28px; height: 28px; }
.rueda .sector small { font-family: var(--f-cond); font-weight: 700; font-size: 11px; text-transform: uppercase; line-height: 1.05; }
.rueda .sector.sel { border-color: var(--hivis); background: var(--panel-2); transform: scale(1.12); }
.rueda .sector.off { opacity: .35; }
.rueda .centro { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--hivis); }

/* Marcas sobre la escena 3D (preparación) */
.marca { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); background: var(--hivis); color: var(--hivis-tinta); border: 2px solid rgba(255,255,255,.4); border-radius: 999px; padding: 6px 11px; font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 3px 10px rgba(0,0,0,.5); animation: marca .7s ease-in-out infinite alternate; }
.marca.punto { width: 30px; height: 30px; padding: 0; }
.marca.hecha { background: var(--ok); animation: none; pointer-events: none; }
@keyframes marca { to { transform: translate(-50%, -50%) scale(1.1); } }

/* Pantallas (camioneta, taller, parte…) */
.pantalla { position: absolute; inset: 0; overflow-y: auto; background: linear-gradient(rgba(13,20,27,.5), rgba(13,20,27,.93) 38%); padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); }
.hoja { max-width: 580px; margin: 0 auto; display: grid; gap: 14px; }
.hoja p { margin: 0; }
.rotulo { font-family: var(--f-display); font-size: clamp(26px, 7.5vw, 38px); line-height: .95; color: var(--acero); text-wrap: balance; }
.rotulo span { color: var(--hivis); display: block; font-size: .6em; margin-top: 4px; }
.datos { display: flex; flex-wrap: wrap; gap: 6px; }
.dato { background: var(--panel); border: 1px solid var(--linea); border-radius: 4px; padding: 4px 10px; display: grid; }
.dato b { font-family: var(--f-mono); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dato i { font-style: normal; font-family: var(--f-cond); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--tenue); }
.dato small { font-size: 11px; color: var(--tenue); }
.jefe { background: var(--panel); border-left: 3px solid var(--grasa); padding: 10px 12px; border-radius: 0 6px 6px 0; display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
.cara { width: 40px; height: 40px; border-radius: 50% 50% 8px 8px; display: grid; place-items: center; font-family: var(--f-display); color: var(--hivis-tinta); }
.jefe b { font-family: var(--f-cond); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); display: block; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 2px solid var(--linea); position: sticky; top: 0; z-index: 4; background: rgb(13,20,27); margin-top: -4px; padding-top: 4px; }
.barra-salir { position: sticky; bottom: 0; z-index: 4; display: flex; align-items: center; gap: 10px; justify-content: space-between; background: rgba(13,20,27,.97); border-top: 2px solid var(--hivis); margin: 0 -8px; padding: 10px 8px max(10px, env(safe-area-inset-bottom, 0px)); }
.barra-salir > div { display: grid; min-width: 0; }
.barra-salir b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-salir .btn { flex: none; min-height: 48px; }
.mapa { display: grid; gap: 6px; }
.tablero { display: grid; gap: 6px; background: var(--panel); border: 1px solid #e58fbf55; border-radius: 10px; padding: 10px; }
.fila-tab { display: grid; grid-template-columns: auto auto auto 1fr; gap: 2px 8px; align-items: center; font-size: 14px; padding: 4px 6px; border-radius: 6px; }
.fila-tab.tuya { background: #ff8a1f22; outline: 1px solid var(--hivis); }
.fila-tab .hora { font-family: var(--f-mono); color: var(--tenue); font-size: 12px; }
.fila-tab i { width: 10px; height: 10px; border-radius: 3px; }
.fila-tab .dest { grid-column: 2 / -1; color: var(--tenue); font-size: 13px; }
.mapa svg { width: 100%; height: auto; border-radius: 10px; border: 2px solid var(--linea); display: block; }
.mapa .pin:active circle { stroke: #fff; }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--tenue); }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.orden.finde { border-color: var(--hivis); }
.misiones i { font-style: normal; font-family: var(--f-mono); font-size: 12px; color: var(--hivis); }
.misiones em { font-style: normal; font-size: 12px; color: var(--tenue); }
.tabs button { background: none; border: 0; padding: 12px 10px; min-height: 44px; font-family: var(--f-cond); font-weight: 700; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; color: var(--tenue); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--acero); border-color: var(--hivis); }
.tabs .cuenta { font-family: var(--f-mono); font-size: 12px; background: var(--hivis); color: var(--hivis-tinta); border-radius: 8px; padding: 0 5px; margin-left: 4px; }
h2.sec { margin: 4px 0 0; font-family: var(--f-cond); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); font-weight: 700; }
.orden { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 12px 14px; display: grid; gap: 7px; text-align: left; width: 100%; }
button.orden[aria-pressed="true"] { border-color: var(--hivis); box-shadow: inset 0 0 0 1px var(--hivis); }
.orden.corta { padding: 9px 12px; gap: 3px; }
.orden.corta h3 { font-size: 18px; }
.orden.corta .nota { font-size: 13px; }
.chip-txt { color: var(--hivis); font-weight: 600; }
.chip-txt.mal { color: var(--mal); }
details.plegable { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; }
details.plegable > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-family: var(--f-cond); font-weight: 700; font-size: 16px; letter-spacing: .03em; }
details.plegable > summary::-webkit-details-marker { display: none; }
details.plegable > summary::after { content: '▾'; color: var(--tenue); transition: transform .2s; }
details.plegable[open] > summary::after { transform: rotate(180deg); }
details.plegable > summary small { font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--tenue); margin-left: auto; }
details.plegable > .dentro { display: grid; gap: 10px; padding: 0 10px 10px; }
.companeros.compacto { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.companeros.compacto .comp { padding: 7px; grid-template-columns: 30px 1fr; gap: 6px; align-items: center; }
.companeros.compacto .cara { width: 30px; height: 30px; font-size: 14px; }
.companeros.compacto .comp b { font-size: 15px; }

.cita { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; font-size: 15px; }

.portada { min-height: 34vh; display: grid; align-content: end; gap: 10px; }
.inicio { display: grid; gap: 18px; }
.menu-inicio { display: grid; gap: 12px; align-content: start; }
.letrero { display: flex; align-items: center; gap: 12px; }
.letrero .logo { width: clamp(56px, 16vw, 78px); flex: none; filter: drop-shadow(0 0 10px #ff8a1f88); animation: logoGota 3.2s ease-in-out infinite; }
@keyframes logoGota { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(2px); } }
.neon { font-family: var(--f-display); font-size: clamp(36px, 11vw, 60px); line-height: .92; color: #fff4e6; text-shadow: 0 0 4px #fff, 0 0 12px #ff8a1f, 0 0 26px #ff8a1f, 0 0 44px #ff5a1f; animation: neon 6s linear infinite; }

.lema { color: var(--acero); font-size: 16px; max-width: 34ch; opacity: .9; }
.en-radio { display: inline-flex; align-items: center; gap: 8px; justify-self: start; background: #c6a0ff1a; border: 1px solid #c6a0ff55; border-radius: 999px; padding: 6px 12px 6px 10px; }

.continuar { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; align-items: center; text-align: left; background: linear-gradient(135deg, #24384a, #1c2a35); border: 2px solid var(--hivis); border-radius: 14px; padding: 12px 14px; color: var(--acero); box-shadow: 0 6px 22px #0007, inset 0 1px 0 #ffffff14; cursor: pointer; }

.mini-furgo .furgo { width: 96px; }
.cont-txt { display: grid; gap: 2px; min-width: 0; }
.cont-txt small { font-family: var(--f-cond); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--hivis); font-size: 13px; }

.cont-datos { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; }

.cont-flecha { font-size: 22px; color: var(--hivis); }
.botones-inicio { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn.grande { min-height: 54px; font-size: 18px; }
.idioma { display: inline-flex; gap: 6px; justify-self: center; }
.idioma .btn[aria-pressed="true"] { background: var(--hivis); color: var(--hivis-tinta); border-color: var(--hivis); }
.pie { text-align: center; color: var(--tenue); font-size: 12px; font-family: var(--f-mono); opacity: .7; }
.rotulo.grande { font-size: clamp(40px, 12vw, 64px); }
.empresa { display: grid; grid-template-columns: minmax(0, 190px) 1fr; gap: 12px; align-items: center; }

.color { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--linea); }
.color[aria-pressed="true"] { border-color: var(--acero); box-shadow: 0 0 0 2px var(--hivis); }
.rango { background: var(--panel); border: 1px dashed var(--linea); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.ajuste { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; text-align: left; width: 100%; }

[aria-pressed="true"] .interruptor::after { left: 21px; }

/* Eventos y panel de preparación */
.evento { position: absolute; left: 0; right: 0; bottom: 0; padding-left: var(--lado-i); padding-right: var(--lado-d); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; pointer-events: none; }
.evento .carta { pointer-events: auto; width: 100%; max-width: 480px; background: var(--panel-solido); border: 2px solid var(--hivis); border-radius: 10px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.6); animation: entra .25s ease-out; }

.evento p { margin: 0; }
.evento .opciones { display: grid; gap: 6px; }
.evento .opciones .btn { text-align: left; text-transform: none; font-family: var(--f-cuerpo); font-weight: 600; font-size: 15px; letter-spacing: 0; touch-action: none; }
.evento .opciones .btn small { display: block; font-weight: 400; font-size: 13px; opacity: .8; }
.prep .carta { border-color: var(--linea); padding: 10px 12px; gap: 6px; }
.prep h3 { font-size: 17px; }
.prep .fila .reloj { font-size: 17px; }
.prep .txt { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.prep .txt.abierto { display: block; }
.prep .pie { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.prep .pie .nota { min-width: 0; }
.prep .pie .btn { flex: none; padding: 9px 12px; font-size: 15px; }
.cuenta-atras { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
.cuenta-atras div { height: 100%; background: var(--mal); }
.blanco.llave { left: 50%; top: 42%; width: 170px; height: 170px; margin: -85px 0 0 -85px; background: #d2382b; border: 6px solid #fff; color: #fff; font-size: 22px; line-height: 1.05; text-align: center; padding: 12px; transition: transform .15s; animation: none; box-shadow: 0 0 0 8px #d2382b55; }
.blanco.llave small { display: block; font-size: 14px; margin-top: 6px; opacity: .85; }
.blanco { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: #c9c9c9; border: 4px dashed #6f6f6f; display: grid; place-items: center; font-family: var(--f-cond); font-weight: 700; color: #222; font-size: 15px; text-transform: uppercase; animation: late .6s ease-in-out infinite alternate; }
@keyframes late { to { transform: scale(1.08); } }
.cargando { min-height: 100%; display: grid; place-items: center; text-align: center; }
.blanco.cuca { background: none; border: 0; border-radius: 0; animation: none; width: 76px; height: 76px; margin: -38px 0 0 -38px; transition: left .7s ease-in-out, top .7s ease-in-out; }
.blanco.cuca svg { transition: transform .3s; filter: drop-shadow(0 3px 4px rgba(0,0,0,.6)); }

/* Radio y duelo en el HUD */

.duelo { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px; align-items: center; font-family: var(--f-cond); font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.duelo .barra div { background: var(--ok); }
.duelo .barra.rival div { background: var(--mal); }

/* Parte: nota, medallas, fotos */
.parte-cab { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.nota-grande { width: 78px; height: 78px; border-radius: 12px; border: 3px solid var(--c); color: var(--c); background: var(--panel); display: grid; place-items: center; font-family: var(--f-display); font-size: 38px; animation: sello .5s ease-out; }
@keyframes sello { 0% { transform: scale(2.2) rotate(-12deg); opacity: 0; } 70% { transform: scale(.92) rotate(3deg); opacity: 1; } 100% { transform: none; } }
.medallas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px; }
.medalla { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 8px 10px; }
.medalla .ico { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe680, #d99a1e); color: var(--hivis-tinta); display: grid; place-items: center; font-family: var(--f-display); font-size: 15px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }

.medalla.bloq { opacity: .45; }
.medalla.bloq .ico { background: var(--panel-2); color: var(--tenue); }
.medalla.nueva { border-color: var(--grasa); animation: entra .4s ease-out; }
.notas { display: flex; flex-wrap: wrap; gap: 4px; }
.notas span { font-family: var(--f-display); font-size: 14px; color: var(--c); border: 1px solid var(--c); border-radius: 4px; min-width: 26px; text-align: center; padding: 1px 3px; }
.estilo { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; }
.estilo > b { font-family: var(--f-cond); font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
.muestra { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.4); }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.foto { margin: 0; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 8px; display: grid; gap: 6px; }
.foto-par { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.foto-par div { position: relative; }
.foto-par img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; display: block; }
.foto-par span { position: absolute; left: 4px; top: 4px; background: rgba(10,16,22,.8); font-family: var(--f-cond); font-weight: 700; font-size: 11px; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; }
.foto figcaption { font-size: 13px; color: var(--tenue); }

/* Pedidos especiales y lo que pasa de día */
.pedido { font-size: 14px; }
.pedido b { color: var(--grasa); }
.pedido i { font-style: normal; color: var(--ok); }
.orden.dia { border-color: var(--grasa); }
.orden.dia { padding: 10px 12px; gap: 5px; box-sizing: border-box; }
/* Árbol de habilidades */
.dato.nivel { color: inherit; font: inherit; text-align: left; cursor: pointer; }
.dato.nivel .puntos { font-size: 12px; background: var(--hivis); color: var(--hivis-tinta); border-radius: 8px; padding: 0 5px; vertical-align: 2px; animation: falta 1s ease-in-out infinite alternate; }
.ramas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.ramas button { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 6px 4px; display: grid; justify-items: center; gap: 1px; color: inherit; }
.ramas button[aria-pressed="true"] { border-color: var(--hivis); background: var(--panel-2); }
.ramas i { font-style: normal; font-size: 20px; }
.ramas b { font-family: var(--f-cond); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.ramas small { font-family: var(--f-mono); font-size: 11px; color: var(--tenue); }
.camino { display: grid; gap: 10px; position: relative; }
.camino::before { content: ""; position: absolute; left: 21px; top: 22px; bottom: 22px; width: 3px; background: var(--linea); border-radius: 2px; }
.nodo { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; position: relative; }
.nodo .bola { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; background: var(--panel-solido); border: 3px solid var(--linea); z-index: 1; }
.nodo .txt { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.nodo .txt b { font-family: var(--f-cond); font-size: 17px; }
.nodo .rangos { color: var(--hivis); letter-spacing: 2px; font-size: 13px; }
.nodo .pide { color: var(--tenue); font-size: 12px; }
.nodo .btn { justify-self: start; }
.nodo.cerrado { opacity: .5; }
.nodo.abierto .bola { border-color: var(--hivis); }
.nodo.parte .bola { border-color: var(--hivis); background: rgba(255,138,31,.2); }
.nodo.lleno .bola { border-color: var(--ok); background: rgba(105,201,122,.25); color: var(--ok); }
.nodo.maestro .txt { border-color: #c6a0ff88; }
.nodo.maestro .bola { box-shadow: 0 0 0 3px #c6a0ff44; }
.orden.dia > .chip { justify-self: start; }
.orden.dia h3 { font-size: 18px; }
.orden.dia p { font-size: 14px; }
.orden.dia .opciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
.orden.dia .opciones .btn { text-align: left; text-transform: none; font-family: var(--f-cuerpo); font-weight: 600; font-size: 14px; letter-spacing: 0; padding: 7px 10px; min-height: 0; }
.orden.dia .opciones .btn small { display: block; font-weight: 400; font-size: 12px; opacity: .8; }
/* Menú de la noche compacto: que lo importante (los trabajos) se vea sin deslizar. */
.hoja:has(> .lado-cab) { gap: 10px; }
.lado-cab, .lado-main { display: contents; }
.cab { display: grid; gap: 8px; }
.cab .empresa { grid-template-columns: 84px 1fr; gap: 10px; }
.cab .empresa .rotulo { font-size: clamp(20px, 5.4vw, 28px); }
.cab .rotulo span { font-size: .55em; margin-top: 2px; }
.cab .datos { display: grid; grid-template-columns: auto auto 1fr auto; gap: 5px; }
.cab .dato { padding: 3px 8px; min-width: 0; }
.cab .dato b { font-size: 15px; }
.cab .dato i { font-size: 10px; }
.cab .dato small { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jefe.corto { width: 100%; text-align: left; color: inherit; border: 0; grid-template-columns: 28px 1fr; gap: 8px; padding: 6px 10px; font-size: 14px; }
.jefe.corto .cara { width: 28px; height: 28px; font-size: 12px; }
.jefe.corto b { font-size: 11px; }
.jefe.corto span, .cita.corto { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.jefe.corto.abierto span { -webkit-line-clamp: unset; }
.cita.corto { font-size: 13.5px; padding: 6px 10px; -webkit-line-clamp: 3; }
a.btn { display: inline-block; text-decoration: none; }
/* Inicio: la camioneta llega de noche */
.calle { position: relative; height: 130px; margin: 0 calc(-1 * var(--lado-i)) 4px calc(-1 * var(--lado-d)); overflow: hidden; }
.ciudad { position: absolute; inset: 0; width: 100%; height: 100%; }
.estrella { animation: titila 2.4s ease-in-out infinite alternate; }
@keyframes titila { from { opacity: .25; } to { opacity: 1; } }
.furgo-anda { position: absolute; left: 50%; bottom: 4px; width: 180px; margin-left: -90px; animation: llega 2.8s cubic-bezier(.2, .75, .3, 1) both; }
.furgo-anda::after { content: ""; position: absolute; left: 96%; bottom: 14px; width: 120px; height: 34px; background: linear-gradient(90deg, rgba(255,236,170,.45), rgba(255,236,170,0)); clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 70%); pointer-events: none; }
.furgo-anda svg { animation: bache .35s ease-in-out 8 alternate; }
.furgo-anda .rueda { animation: gira .35s linear 8; }
@keyframes llega { from { transform: translateX(-100vw); } to { transform: none; } }
@keyframes bache { to { transform: translateY(-2px); } }
@keyframes gira { to { transform: rotate(360deg); } }
.en-radio { font-family: var(--f-mono); font-size: 12px; color: #c6a0ff; }
#oscuro { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at var(--x, 50%) var(--y, 45%), rgba(0,0,0,0) 0, rgba(0,0,0,.25) 90px, rgba(0,0,0,.94) 190px); }
.retos { background: var(--panel); border: 1px solid #ffd23f55; border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; }
.retos b { font-family: var(--f-cond); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: #ffd23f; }
.retos span { font-size: 14px; }
.retos .ok { color: var(--ok); }
