spués. Pero cobra.": "Don Rigo's tip: get paid before you scrape. Or after. But get paid.", "Hoy te toca una fácil. Mentira, ninguna es fácil.": "You've got an easy one today. Kidding, none of them are easy.", "Si te preguntan, la camioneta siempre hizo ese ruido.": "If anyone asks, the van always made that noise.", "El seguro no cubre mapaches. Lo pregunté.": "Insurance doesn't cover raccoons. I asked.", "Si algo explota, tú no estabas.": "If anything explodes, you weren't there.", "Recuerda: el cliente siempre tiene razón, hasta que paga.": "Remember: the customer is always right, until they pay.", "Los clientes no se consiguen solos. Bueno, a veces sí, pero no cuentes con eso.": "Clients don't find themselves. Well, sometimes they do, but don't count on it.", "El dueño se mira en la campana y se peina.": "The owner checks his reflection in the hood and fixes his hair.", "El chef pasa el dedo por el ducto y no dice nada. Es lo más cerca de un elogio que vas a recibir.": "The chef runs a finger along the duct and says nothing. That's the closest to a compliment you'll ever get.", "El gerente le saca una foto a la campana. «Para mi mamá», dice.": "The manager snaps a photo of the hood. “For my mom,” he says.", "El dueño te ofrece un café. Está frío, pero es un gesto.": "The owner offers you a coffee. It's cold, but it's the thought that counts.", "El gerente te enseña una mancha con la linterna del móvil. Durante cuatro minutos.": "The manager shows you a stain with his phone flashlight. For four minutes.", "El chef suspira tan fuerte que se apaga un piloto.": "The chef sighs so hard a pilot light goes out.", "El dueño dice que la próxima vez llama a su cuñado.": "The owner says next time he's calling his brother-in-law.", "«¿Esto es lo limpio?», pregunta el dueño. Nadie contesta.": "“This is clean?” the owner asks. Nobody answers.", "Brazo de acero": "Arm of Steel", "La rasqueta quita un 15 % más.": "The scraper removes 15% more.", "Pulmones de buzo": "Diver's Lungs", "Cada turno dura 15 segundos más.": "Each shift lasts 15 seconds longer.", "Labia de vendedor": "Gift of Gab", "+5 % de propina, y el gerente pregunta menos.": "+5% tips, and the manager asks fewer questions.", "Mano para la espuma": "Foam Whisperer", "La espuma rinde un 40 % más.": "Foam goes 40% further.", "Jefe nato": "Born Leader", "Tu cuadrilla limpia un 20 % más rápido.": "Your crew cleans 20% faster.", "Don de gentes": "People Person", "Los clientes te ofrecen contrato fijo más a menudo.": "Clients offer you a steady contract more often.", "Ojo de inspector": "Inspector's Eye", "La asistencia de apuntado llega el doble de lejos.": "Aim assist reaches twice as far.", "Pasadas cortas: quita la costra.": "Short strokes: strip the crust.", "Barre la grasa y espera 2 segundos: luego sale el triple de rápido.": "Sweep the grease and wait 2 seconds: then it comes off three times faster.", "Mantén y apunta. Sin espuma, la costra salpica.": "Hold and aim. Without foam, the crust splatters.", "Migdalea el metal limpio: acabado espejo y más propina.": "Polish the clean metal: mirror finish and bigger tips.", "Bigotes en el frente": "Grille Mustache", "+100 % de estilo. Efecto en el trabajo: ninguno. Efecto en tu autoestima: enorme.": "+100% style. Effect on work: none. Effect on self-esteem: huge.", "Dados de peluche": "Fuzzy Dice", "Cuelgan del espejo. Dicen que dan suerte. Probablemente.": "They hang from the mirror. They say they bring luck. Probably.", "Bocina de «La Cucaracha»": "“La Cucaracha” Horn", "Suena al llegar. Los clientes sonríen: un poquito más de propina.": "Plays when you arrive. Clients smile: a little bigger tip.", "Rines cromados": "Chrome Rims", "Los clientes creen que cobras caro: te pagan un 3 % más.": "Clients think you're pricey: they pay you 3% more.", "Luces neón por debajo": "Neon Underglow", "Tu gente la ve desde lejos y llega a tiempo: faltan menos.": "Your crew spots it from far away and shows up on time: fewer no-shows.", "Alerón de carreras": "Racing Spoiler", "No sirve de nada en una camioneta. Salvo en los arrancones contra El Cuñado.": "Totally useless on a van. Except in drag races against El Cuñado.", "Escape ruidoso": "Loud Exhaust", "Los vecinos lo odian. Los mapaches también: huyen antes de que llegues.": "The neighbors hate it. So do the raccoons: they bolt before you get there.", "Asientos con masaje": "Massage Seats", "Tu cuadrilla llega relajada y limpia un 5 % más rápido.": "Your crew arrives relaxed and cleans 5% faster.", "Cafetera en el tablero": "Dashboard Coffee Maker", "Chuy se duerme la mitad de veces. Beto se pone intenso.": "Chuy falls asleep half as often. Beto gets intense.", "Megáfono en el techo": "Roof Megaphone", "Anuncias tu llegada. El Cuñado se pone nervioso en los duelos.": "Announce your arrival. El Cuñado gets nervous in duels.", "Rasqueta de acero templado": "Tempered Steel Scraper", "Más ancha y un 30 % más fuerte.": "Wider and 30% stronger.", "Rasqueta de carburo": "Carbide Scraper", "La hoja definitiva. La costra le tiene miedo.": "The ultimate blade. Crust fears it.", "Botella de espuma XL": "XL Foam Bottle", "La espuma te dura un 50 % más por noche.": "Your foam lasts 50% longer per night.", "Desengrasante concentrado": "Concentrated Degreaser", "La espuma ablanda 4× en vez de 3×.": "Foam softens 4× instead of 3×.", "Migdaleadora orbital": "Orbital Polisher", "Migdalea hasta espejo en la mitad de pasadas.": "Polishes to a mirror in half the passes.", "Bolsas de contención nuevas": "New Containment Bags", "Las viejas tienen más parches que bolsa.": "The old ones are more patch than bag.", "Hidrolavadora de agua caliente propia": "Your Own Hot-Water Pressure Washer", "Chorro ancho y fuerte. Esta es tuya y nadie la vende para comprarse un karaoke.": "Wide, powerful spray. This one's yours, and nobody's selling it to buy a karaoke machine.", "Camioneta con baca": "Van with Roof Rack", "Caben 2 ayudantes además del compañero.": "Fits 2 helpers plus your partner.", "Linterna UV de grasa": "UV Grease Flashlight", "La grasa que falta brilla un poco bajo la luz del casco. Ya no se te escapa ninguna mancha.": "Leftover grease glows a little under your helmet light. No stain gets past you now.", "Cubiertas a medida": "Custom Covers", "Cubrir y destapar cada aparato tarda la mitad.": "Covering and uncovering each appliance takes half the time.", "Cinta con pistola": "Tape Gun", "Encintar el plástico tarda la mitad. Suena como en las películas.": "Taping plastic takes half the time. Sounds like the movies.", "Rasqueta de mango largo": "Long-Handle Scraper", "Las pasadas cubren un 25 % más de ancho.": "Strokes cover 25% more width.", "Cañón de espuma": "Foam Cannon", "La espuma sale en una nube: cubre casi el doble y gasta menos botella.": "Foam comes out in a cloud: covers almost twice as much and uses less bottle.", "Rasqueta eléctrica": "Electric Scraper", "Vibra sola: un 25 % más de fuerza en cada pasada. Hace cosquillas.": "Vibrates on its own: 25% more force per stroke. Tickles.", "Hidrolavadora de vapor": "Steam Pressure Washer", "Agua a 140 °C: el chorro limpia un 40 % más y derrite la grasa quemada sin espuma.": "Water at 140 °C: the spray cleans 40% more and melts burnt grease without foam.", "Robot de ductos «Ductobot 3000»": "Duct Robot “Ductobot 3000”", "Lo metes en el ducto y lo limpia solo, de punta a punta. Las esquinas te las deja a ti.": "Drop it in the duct and it cleans end to end on its own. It leaves the corners for you.", "Cámara para el Ductobot": "Ductobot Camera", "Ves el ducto desde los ojos del robot mientras trabaja. Hipnótico.": "See the duct through the robot's eyes while it works. Hypnotic.", "Orugas todoterreno para el Ductobot": "All-Terrain Treads for the Ductobot", "Ya no se atora en las costras: pasa por encima de todo.": "No more getting stuck on crust: it rolls right over everything.", "Seguro contra daños": "Damage Insurance", "La aseguradora paga la mitad de cada daño: lo que rompas tú, tu gente o tus equipos. Una sola vez, para siempre.": "The insurer pays half of every damage: whatever you, your crew, or your gear break. One-time purchase, forever.", "Voz de Don Rigo para el Ductobot": "Don Rigo Voice for the Ductobot", "El robot habla como Don Rigo. No limpia mejor, pero regaña igual.": "The robot talks like Don Rigo. Doesn't clean any better, but scolds just the same.", "Turbo para el Ductobot": "Ductobot Turbo", "Va el doble de rápido y con cepillos laterales: también limpia las esquinas.": "Twice as fast, with side brushes: it cleans the corners too.", "Camión de la empresa": "Company Truck", "Caben 4 ayudantes. Y tiene radio que funciona.": "Fits 4 helpers. And the radio actually works.", "Básico": "Basic", "Rasquetas viejas y una cubeta.": "Old scrapers and a bucket.", "Rasquetas buenas, espuma y escaleras.": "Good scrapers, foam, and ladders.", "Hidrolavadora y migdaleadora propias.": "Your own pressure washer and polisher.", "Antes de las 3": "Before 3", "El dueño": "The owner", "Terminen antes de las 3:00, que a esa hora llega el panadero y no quiero testigos.": "Finish before 3:00. That's when the baker shows up, and I don't want witnesses.", "A las 3:05 llegó el panadero y los vio. El dueño no lo superó.": "At 3:05 the baker showed up and saw you. The owner never got over it.", "Quiere verse": "Mirror, Mirror", "La chef": "The chef", "Quiero peinarme en mi campana. Migdaléenla hasta que brille como espejo.": "I want to do my hair in my hood. Polish it until it shines like a mirror.", "La chef intentó peinarse en la campana y solo vio una mancha con forma de Beto.": "The chef tried to fix her hair in the hood and only saw a Beto-shaped smudge.", "Bebé dormido": "Sleeping Baby", "Mi bebé duerme arriba: nada de hidrolavadora, que hace ruido. A mano, como antes.": "My baby's asleep upstairs: no pressure washer, it's loud. By hand, old school.", "El bebé se despertó con la hidrolavadora. Y el dueño. Y medio barrio.": "The pressure washer woke the baby. And the owner. And half the neighborhood.", "Alérgico": "Allergic", "El chef": "The chef", "Soy alérgico al desengrasante. Ni una gota de espuma. Pura rasqueta y fe.": "I'm allergic to degreaser. Not one drop of foam. Just scrapers and faith.", "El chef estornudó cuarenta veces seguidas. Dice que te va a mandar la cuenta del doctor.": "The chef sneezed forty times in a row. Says he's sending you the doctor's bill.", "Plancha sagrada": "Sacred Griddle", "Esa plancha era de mi abuela. Si le cae una gota de grasa, me muero. Cubran TODO y quiten todo al final.": "That griddle was my grandma's. If one drop of grease hits it, I'll die. Cover EVERYTHING and uncover it all at the end.", "Le cayó una gota a la plancha de la abuela. Doña Chela llora y la limpia con un pañuelo bordado.": "A drop landed on Grandma's griddle. Doña Chela weeps and wipes it with an embroidered hankie.", "Con música": "With Music", "El gerente": "The manager", "Aquí la cocina trabaja con música. Si apagan la radio, la campana se pone triste. En serio.": "This kitchen runs on music. Turn off the radio and the hood gets sad. Seriously.", "Apagaste la radio. El gerente asegura que la campana «se ve deprimida».": "You turned off the radio. The manager swears the hood “looks depressed.”", "Paga en tacos": "Pays in Tacos", "Ando corto de efectivo. Te pago la mitad en dinero y la otra mitad en tacos de pastor. Ciento veinte.": "I'm short on cash. I'll pay you half in money and half in tacos al pastor. A hundred and twenty.", "Tacaño": "Cheapskate", "Cuenta las monedas dos veces. Y luego otra vez.": "Counts the coins twice. Then once more.", "¿Tanto? Mi cuñado lo hace por la mitad. Bueno, no lo hace, pero lo dice.": "That much? My brother-in-law does it for half. Well, he doesn't do it, but he says he does.", "Ni un peso más. Ni medio.": "Not one peso more. Not even half.", "Le encanta regatear: si le dices que no, contraataca con otra oferta.": "Loves to haggle: tell him no and he'll come back with another offer.", "Te ofrezco esto, pero los dos sabemos que vamos a regatear.": "Here's my offer, but we both know we're gonna haggle.", "Mmm… ni tú ni yo. Te propongo algo.": "Hmm… not yours, not mine. Here's an idea.", "Con dinero": "Loaded", "Paga bien, pero no le gusta que lo traten como cajero.": "Pays well, but hates being treated like an ATM.", "El precio no es problema. El problema es que lo hagan mal.": "Price isn't the problem. The problem is doing it wrong.", "Oiga, tampoco soy un banco.": "Hey, I'm not a bank either.", "Con prisa": "In a Hurry", "Lo quiere todo para ayer. Paga más si no le haces perder el tiempo.": "Wants it all done yesterday. Pays more if you don't waste his time.", "Rápido, rápido, que me están llamando. ¿Sí o no?": "Quick, quick, I've got a call. Yes or no?", "¡Ay, no tengo tiempo para esto!": "Ugh, I don't have time for this!", "Ya lo engañaron antes. Le encantan las garantías y paga más por ellas.": "He's been burned before. Loves guarantees and pays extra for them.", "La última empresa me dejó un mapache. ¿Ustedes qué me garantizan?": "The last company left me a raccoon. What do you guarantee?", "Eso dicen todos.": "That's what they all say.", "Doña Chela y la plancha": "Doña Chela and the Griddle", "Doña Chela te cuenta que la plancha era de su abuela, y la de su abuela era de su abuela. Es una plancha con árbol genealógico.": "Doña Chela tells you the griddle was her grandma's, and her grandma's grandma's before that. This griddle has a family tree.", "Su nieto quiere «modernizar» la cocina. Doña Chela amenaza con desheredarlo. Y con desheredarte a ti si dejas una mancha.": "Her grandson wants to “modernize” the kitchen. Doña Chela threatens to disown him. And to disown you if you leave a stain.", "El nieto se rindió. Ahora quiere aprender a limpiar campanas contigo. Rompe dos vasos y una espátula. Tiene futuro.": "The grandson gave up. Now he wants to learn hood cleaning from you. Breaks two glasses and a spatula. He's got potential.", "Doña Chela te regala la receta secreta de sus chilaquiles. Dice: «ponle amor». Eso es todo. Lloras un poquito igual.": "Doña Chela gives you her secret chilaquiles recipe. It says: “add love.” That's it. You still cry a little.", "La receta de Doña Chela": "Doña Chela's Recipe", "El sueño de Mario": "Mario's Dream", "El dueño sueña con ganar el concurso de pizza del barrio. Te enseña una foto de la pizza perfecta. Es una pizza normal.": "The owner dreams of winning the neighborhood pizza contest. He shows you a photo of the perfect pizza. It's a normal pizza.", "Quedó segundo. Culpa a la grasa del horno. Te mira fijamente.": "He came in second. Blames the grease in the oven. Stares right at you.", "Con la campana limpia, el horno tira mejor. Practica de noche mientras raspas. Pruebas siete pizzas. Por trabajo.": "With a clean hood, the oven draws better. He practices at night while you scrape. You taste seven pizzas. For work.", "¡Ganó el concurso! Te dedica el trofeo en el periódico del barrio y te da pizza gratis de por vida (de por vida = un mes).": "He won the contest! He dedicates the trophy to you in the neighborhood paper and gives you free pizza for life (for life = one month).", "El trofeo de la pizza": "The Pizza Trophy", "El chef de la tele": "The TV Chef", "El chef dice que un día saldrá en la tele. Practica su sonrisa en la campana que limpiaste.": "The chef says he'll be on TV someday. He practices his smile in the hood you cleaned.", "Lo llamaron de un programa de cocina. Necesita la cocina impecable. Más impecable que impecable.": "A cooking show called him. He needs the kitchen spotless. More spotless than spotless.", "Grabaron el programa. Se te ve de fondo raspando. Tu mamá te reconoció por cómo agarras la rasqueta.": "They shot the show. You're in the background, scraping. Your mom recognized you by how you hold the scraper.", "El programa fue un éxito. El chef dice en el aire: «mis campanas las limpia el mejor». Te llueven llamadas.": "The show was a hit. On air, the chef says: “My hoods are cleaned by the best.” The calls pour in.", "Salir en la tele": "On TV", "Primera de muchas": "First of Many", "Aprueba tu primera inspección.": "Pass your first inspection.", "Cuadro de honor": "Honor Roll", "Saca una A en un turno.": "Get an A on a shift.", "Metal desnudo": "Bare Metal", "Todas las zonas a 50 µm o menos.": "Every zone at 50 µm or less.", "Relámpago": "Lightning Fast", "Aprueba antes de las 3:00.": "Pass before 3:00.", "Turno sin rasguños": "Not a Scratch", "Aprueba sin ningún daño.": "Pass without any damage.", "Raspador de élite": "Elite Scraper", "Llega al combo ×3.": "Reach a ×3 combo.", "Maestro migdaleador": "Master Polisher", "Migdalea el 90 % de la campana.": "Polish 90% of the hood.", "Domador de gerentes": "Manager Tamer", "Aprueba con gerente sin que explote.": "Pass with a manager around without him blowing up.", "Amigo de los mapaches": "Raccoon Whisperer", "Saca al mapache por las buenas.": "Get the raccoon out the nice way.", "Atrapa a la cucaracha gigante.": "Catch the giant cockroach.", "Ojos de gato": "Cat Eyes", "Aprueba una noche con apagón.": "Pass a night with a blackout.", "Cliente exigente": "Picky Client", "Cumple un pedido especial.": "Complete a special request.", "Adiós, Cuñado": "Bye-Bye, Cuñado", "Gánale un duelo a El Cuñado.": "Beat El Cuñado in a duel.", "Aprueba 10 inspecciones.": "Pass 10 inspections.", "Fotógrafo de grasa": "Grease Photographer", "Junta 6 fotos en el álbum.": "Collect 6 photos in the album.", "Fin de semana de leyenda": "Legendary Weekend", "Supera el reto de fin de semana: tres gigantes seguidos.": "Beat the weekend challenge: three giants in a row.", "El mapache dorado": "The Golden Raccoon", "Lo viste. Nadie te va a creer.": "You saw it. Nobody's going to believe you.", "La cinta perdida": "The Lost Tape", "Encontraste el casete de Don Rigo en un ducto.": "You found Don Rigo's cassette in a duct.", "Oído absoluto": "Perfect Pitch", "Encontraste la canción secreta de la radio.": "You found the radio's secret song.", "Sin hidrolavadora": "No pressure washer", "Sin espuma": "No foam", "Llega dos veces al combo ×3": "Reach a ×3 combo twice", "Inspector antes de las 4:00, aprobado": "Inspector before 4:00, passed", "Migdalea el 80 % de la campana": "Polish 80% of the hood", "Ni un solo daño": "Zero damage", "Preparación perfecta (gas, luz, cubrir y plástico)": "Perfect prep (gas, power, covers, and plastic)", "Filtros listos antes de las 23:30": "Filters done before 23:30", "Saca A o mejor": "Get an A or better", "Todo a 50 µm o menos": "Everything at 50 µm or less", "Color de la espuma": "Foam Color", "Rosa chicle": "Bubblegum Pink", "Verde menta": "Mint Green", "Azul alberca": "Pool Blue", "Casco del compañero": "Partner's Helmet", "El suyo": "Their Own", "Negro mate": "Matte Black", "Verde militar": "Army Green", "Pegatina de la camioneta": "Van Sticker", "Luz del casco": "Helmet light", "Cálida": "Warm", "Fría": "Cool", "Verde fosforito": "Neon green", "Sonido del combo": "Combo sound", "Clásico": "Classic", "Llanta ponchada": "Flat tire", "Camino al trabajo, ¡pum! La llanta trasera. El clavo tiene pinta de llevar ahí desde 2019.": "On the way to work, bam! Rear tire. That nail looks like it's been there since 2019.", "Cambiarla nosotros": "Change it ourselves", "Gratis, pero llegas 30 minutos tarde": "Free, but you show up 30 minutes late", "Cambiada. Las tuercas, apretadas «a ojo». Llegas media hora tarde.": "Changed. Lug nuts tightened “by eye.” You're half an hour late.", "Llamar a la grúa": "Call a tow truck", "La grúa llegó en diez minutos y cobró como si fueran tres horas.": "The tow truck showed up in ten minutes and charged like it took three hours.", "El de tránsito": "Traffic cop", "Un oficial te para: la camioneta echa humo negro y el escape va amarrado con alambre.": "A cop pulls you over: the van's blowing black smoke and the muffler's held on with wire.", "Pagar la multa": "Pay the ticket", "Multa pagada. El oficial se lleva también un llavero de recuerdo.": "Ticket paid. The cop also takes a keychain as a souvenir.", "Explicarle la norma NFPA 96": "Explain the NFPA 96 code to him", "A ver qué pasa": "Let's see what happens", "A los cuatro minutos se quedó dormido. Te vas despacito.": "Four minutes in, he fell asleep. You tiptoe away.", "No le gustó la clase. Multa doble: −$120.": "He didn't enjoy the lecture. Double fine: −$120.", "El almuerzo desaparecido": "The missing lunch", "Beto se comió tu almuerzo. Y el del cliente. Y la salsa del cliente.": "Beto ate your lunch. And the client's. And the client's salsa.", "Comprar tacos para todos": "Buy tacos for everyone", "−$40 · la cuadrilla trabaja más rápido esta noche": "−$40 · the crew works faster tonight", "Tacos para todos. La cuadrilla va con energía de domingo.": "Tacos for everyone. The crew's got Sunday-morning energy.", "Es familia (de Don Rigo)": "He's family (Don Rigo's)", "Beto promete no volver a hacerlo. Lo promete con la boca llena.": "Beto promises never to do it again. With his mouth full.", "¡Video viral!": "Viral video!", "Un niño del barrio subió un video tuyo raspando una campana en cámara rápida. Va por los cincuenta mil «me gusta».": "A neighborhood kid posted a sped-up video of you scraping a hood. It's closing in on fifty thousand likes.", "Aprovechar la fama": "Ride the fame", "+3 de reputación": "+3 reputation", "Te reconocen en la gasolinera. Un señor te pide que le firmes la gorra.": "People recognize you at the gas station. A guy asks you to sign his cap.", "Pedir que lo borre": "Ask him to delete it", "Discreción ante todo": "Discretion above all", "Lo borró. Bueno, lo resubió con música de suspenso. Ya va por cien mil.": "He deleted it. Well, he reposted it with suspense music. It's at a hundred thousand now.", "Pasajero nuevo": "New passenger", "Un perro callejero se subió a la camioneta y se sentó en el asiento del copiloto. No se quiere bajar.": "A stray dog hopped into the van and sat in the passenger seat. He won't get out.", "Se llamará Grasita": "His name is Grasita", "Grasita ya es parte de la empresa. Ladra a los ductos. A todos.": "Grasita is officially on the payroll. He barks at ducts. All of them.", "Darle un taco y despedirlo": "Give him a taco and say goodbye", "Con dolor": "It hurts", "Se comió el taco, te miró con desprecio y se fue. Lloraste un poquito.": "He ate the taco, gave you a look of pure contempt and left. You cried a little.", "Semáforo en rojo": "Red light", "¡Arrancón!": "Drag race!", "Por el honor de la empresa": "For the company's honor", "¡Ganaste! El alerón hizo su trabajo. Nadie sabe cómo. +2 de reputación.": "You won! The spoiler did its job. Nobody knows how. +2 reputation.", "¡Ganaste! La camioneta vieja tiene más corazón que motor. +2 de reputación.": "You won! That old van has more heart than horsepower. +2 reputation.", "La camioneta se apagó a media calle. El Cuñado se rió. Empujarla costó $30 en refrescos.": "The van died in the middle of the street. El Cuñado laughed. Pushing it cost $30 in sodas.", "Ignorarlo con dignidad": "Ignore him with dignity", "Mirada al frente": "Eyes forward", "Lo ignoras. Por el retrovisor, ves que El Cuñado se cala en la siguiente esquina. Justicia divina.": "You ignore him. In the rearview mirror, you see El Cuñado stall at the next corner. Divine justice.", "Regalo de una clienta": "A gift from a client", "Una clienta te deja una caja de donas: «Por la campana de la otra vez, quedó preciosa».": "A client leaves you a box of donuts: “For the hood last time, it came out gorgeous.”", "Guardarlas para el gerente": "Save them for the manager", "Esta noche tendrá más paciencia": "He'll be more patient tonight", "Las donas viajan en el asiento del copiloto, con el cinturón puesto.": "The donuts ride shotgun, seatbelt on.", "Comérselas ya": "Eat them now", "+25 de experiencia": "+25 XP", "Desayuno de campeones. Te comiste cuatro y dices que fue una.": "Breakfast of champions. You ate four and claim it was one.", "Rata de Dos Patas (versión de Beto)": "Rata de Dos Patas (Beto's version)", "El Corrido de Don Rigo (versión original, 1987)": "El Corrido de Don Rigo (original version, 1987)", "Son las {h} y esto es Radio Grasa FM, la estación que no se despega.": "It's {h} and this is Radio Grasa FM, the station that sticks with you.", "Saludos a todos los que limpian campanas a estas horas. Ustedes son los verdaderos héroes. Y huelen a papas.": "Shout-out to everyone cleaning hoods at this hour. You're the real heroes. And you smell like fries.", "Mensaje de un radioescucha: «Beto, devuélveme la licuadora». Firma: tu prima.": "Message from a listener: “Beto, give me back my blender.” Signed: your cousin.", "Recuerden: la espuma ablanda, la rasqueta quita y el mapache observa.": "Remember: foam softens, the scraper strips, and the raccoon watches.", "Radio Grasa FM: si la escuchas, ya es tarde para dormir.": "Radio Grasa FM: if you're listening, it's too late to sleep.", "Llamó Doña Chela: dice que nadie toque la plancha de su abuela. Ni en la radio.": "Doña Chela called: nobody touches her grandma's griddle. Not even on the radio.", "Este programa es patrocinado por Desengrasantes El Tigre: si no quita la grasa, por lo menos huele a limón.": "This show is brought to you by El Tigre Degreasers: if it doesn't cut the grease, at least it smells like lemon.", "Tacos El Insomne: abiertos cuando todos duermen. Pregunte por el de pastor con piña de cortesía.": "Tacos El Insomne: open while everyone sleeps. Ask for the al pastor with complimentary pineapple.", "¿Su ducto hace ruidos raros? Llame a Exorcismos y Ductos Hermanos Peña. Primera consulta gratis.": "Duct making weird noises? Call Hermanos Peña Exorcisms & Ducts. First consultation free.", "Rasquetas Don Chema: la hoja que no se dobla, aunque usted sí.": "Don Chema Scrapers: the blade that won't bend, even when you do.", "Aseguradora La Tranquila: asegure su camioneta antes de que la maneje Beto.": "La Tranquila Insurance: insure your van before Beto drives it.", "Café Despierto: el café de los que limpian campanas a las tres de la mañana. Ahora con el doble de azúcar.": "Café Despierto: the coffee for people cleaning hoods at 3 a.m. Now with double the sugar.", "Repartir volantes en el barrio": "Hand out flyers in the neighborhood", "Una orden más esta noche, de las sencillas.": "One more job tonight, an easy one.", "Repartiste la mitad. La otra mitad se la llevó el viento, pero llamó alguien.": "You handed out half. The wind took the other half, but somebody called.", "Visitar restaurantes con donas": "Visit restaurants with donuts", "A veces sale una orden mejor pagada. A veces solo se comen las donas.": "Sometimes you land a better-paying job. Sometimes they just eat the donuts.", "Se comieron las donas, dijeron «ya te llamamos» y no te llamaron.": "They ate the donuts, said “we'll call you” and never called.", "Las donas abrieron puertas. Literalmente: el chef te abrió la cocina para enseñarte el desastre.": "The donuts opened doors. Literally: the chef opened the kitchen to show you the disaster.", "Anuncio en redes": "Social media ad", "Dos órdenes más. Puede llegar un cliente raro que paga el doble.": "Two more jobs. A weird client who pays double might show up.", "El anuncio tuvo tres «me gusta» y dos llamadas. Una de ellas suena rara.": "The ad got three likes and two calls. One of them sounds weird.", "Presentarse a una licitación": "Bid on a contract", "Un trabajo grande de dos campanas. Ganarla depende de tu reputación.": "A big two-hood job. Winning depends on your reputation.", "Licitación": "Bid", "¡Ganaste la licitación! Ahora hay que cumplir.": "You won the bid! Now you have to deliver.", "LIMPIEZA CERTIFICADA": "CERTIFIED CLEANING", "Cerrar el piloto": "Turn off the pilot light", "Apagar las brasas": "Put out the coals", "Apagar el trompo": "Turn off the trompo", "Apagar el horno": "Turn off the oven", "Cerrar el gas": "Shut off the gas", "Apagar la salamandra": "Turn off the salamander", "Apagar el baño maría": "Turn off the steam table", "¡AL CARBÓN!": "CHARBROILED!", "SOLO PERSONAL": "STAFF ONLY", "LAS MANOS": "HANDS", "COMIDA CORRIDA": "DAILY SPECIAL", "sopa · guisado · agua · $85": "soup · stew · agua fresca · $85", "¡HAY CAMARONES!": "WE'VE GOT SHRIMP!", "Piso 2 · Baños al fondo": "Floor 2 · Restrooms in the back", "para 2,000 personas": "for 2,000 people", "¡TACOS!": "TACOS!", "PAN CALIENTE": "FRESH BREAD", "¡VAMOS PUMAS!": "GO PUMAS!", "Grasa Brava Servicios": "Grasa Brava Services", "Se me poncharon las dos llantas. Y la de repuesto.": "Both my tires went flat. And the spare.", "Me quedé dormido viendo un video de cómo limpiar campanas.": "I fell asleep watching a video on how to clean hoods.", "Mi gato se comió las llaves.": "My cat ate my keys.", "Estoy en camino. (No está en camino.)": "I'm on my way. (He is not on his way.)", "¿Ustedes otra vez? Vamos a ver quién deja esto brillando primero.": "You again? Let's see who gets this sparkling first.", "El cliente es mío. Ustedes vinieron de paseo.": "This client's mine. You guys just came along for the ride.", "Les doy ventaja: yo empiezo cuando acaben de poner el plástico. Mentira, ya empecé.": "I'll give you a head start: I'll begin once you're done hanging the plastic. Kidding, I already started.", "Yo te ilumino. Bueno, mi casco te ilumina.": "I'll light the way. Well, my helmet will.", "Primero el gas. Lo dice Don Rigo y lo dicen los bomberos.": "Gas first. Don Rigo says so, and so does the fire department.", "¿Cerramos el gas o vivimos peligrosamente?": "Do we shut off the gas or live dangerously?", "¡Esa plancha es la de mi abuela! Cúbranla bien. Y todo lo demás también.": "That griddle was my grandma's! Cover it well. And everything else too.", "Más cinta. Siempre más cinta.": "More tape. Always more tape.", "El plástico es como un paraguas al revés. No preguntes.": "The plastic's like an upside-down umbrella. Don't ask.", "Si queda un hueco, el agua lo encuentra. El agua siempre lo encuentra.": "If there's a gap, the water will find it. Water always finds it.", "Ya tengo a todos repartidos. Tú haces tu parte y revisas la de los demás. Don Rigo confía en ti. Bueno, un poco.": "I've got everyone assigned. You do your part and check everyone else's. Don Rigo trusts you. Well, a little.", "Trabajo gigante. Repártenos bien, jefe. Y revisa, porque aquí nadie es perfecto. Bueno, Lupe sí.": "Huge job. Split us up right, boss. And double-check, 'cause nobody here is perfect. Well, Lupe is.", "⚡ Contraataque": "⚡ Counterattack", "Yo me voy a lo más sucio de lo que no estés limpiando tú. Rápido y con estilo.": "I'll take the dirtiest stuff you're not cleaning. Fast and with style.", "Yo cargo los filtros. Pesan poquito. Si me duermo, me despiertas.": "I'll haul the filters. They're light. If I fall asleep, wake me up.", "Yo me quedo contigo y te voy marcando lo que te falta. Porque te va a faltar.": "I'll stick with you and point out what you missed. Because you will miss stuff.", "Vamos. Tú los filtros, yo vigilo.": "Let's go. You take the filters, I'll keep watch.", "Empezamos por los filtros. Como dice Don Rigo: de abajo hacia arriba y sin preguntar.": "We start with the filters. Like Don Rigo says: bottom to top, no questions asked.", "Filtros primero. Si ves algo que se mueve, no es grasa.": "Filters first. If you see something moving, it's not grease.", "¡Eso! ¡Como en los videos!": "Yes! Just like in the videos!", "Mira nomás, ya pareces profesional.": "Look at you, a real pro already.", "Así se raspa, sí señor.": "Now that's how you scrape, yes sir.", "nada de hidrolavadora": "no pressure washer", "ni una gota de espuma": "not one drop of foam", "Psst… acuérdate de lo que pidió el cliente.": "Psst… remember what the client asked for.", "Yo no fui. Bueno, sí.": "Wasn't me. Okay, it was.", "¿Esto era importante?": "Was this important?", "Sale agua sucia a presión hacia la campana. ¡Toca tres veces la llave de paso antes de que se moje todo! (El reloj del turno se detiene.)": "Dirty water is spraying toward the hood. Tap the shutoff valve three times before everything gets soaked! (The shift clock pauses.)", "Tubería rota (fontanero nocturno)": "Burst pipe (late-night plumber)", "Todo mojado": "Everything's soaked", "El agua con grasa salpicó la campana que ya habías limpiado. El fontanero cobra tarifa de madrugada.": "Greasy water splashed the hood you'd already cleaned. The plumber charges the graveyard rate.", "Se me resbaló la llave inglesa. Y luego yo.": "The wrench slipped. Then so did I.", "Juro que solo la toqué. Con el pie. Fuerte.": "I swear I barely touched it. With my foot. Hard.", "Ahora entiendo por qué Beto siempre dice que «ya venía así».": "Now I get why Beto always says “it was already like that.”", "Llave cerrada": "Valve shut", "Ya venía así. Te lo juro por mi casco.": "It was already like that. I swear on my helmet.", "Yo la iba a cerrar. Estaba calentando.": "I was gonna close it. I was warming up.", "Gracias, jefe. No le diga a nadie.": "Thanks, boss. Don't tell anyone.", "Ya venía así. Me lo enseñó Beto.": "It was already like that. Beto taught me that one.", "La lona huele a barbacoa": "The tarp smells like barbecue", "Un piloto quedó encendido debajo del plástico. Rápido, el extintor.": "A pilot light was still on under the plastic. Quick, the extinguisher!", "Usar el extintor": "Use the extinguisher", "Recarga del extintor": "Extinguisher refill", "Una nube blanca y ningún daño. El chef nunca lo sabrá. Probablemente.": "A white cloud and zero damage. The chef will never know. Probably.", "¿Ves? Por eso se cierra el gas. Bueno, yo tampoco lo cerré.": "See? That's why you shut off the gas. Okay, I didn't shut it off either.", "Lona y mesa chamuscadas": "Scorched tarp and table", "Lona derretida": "Melted tarp", "El plástico se fundió sobre la mesa de acero. Huele a juguete quemado.": "The plastic melted onto the steel table. Smells like a burnt toy.", "Mira el lado bueno: ahora la mesa tiene textura.": "Look on the bright side: now the table has texture.", "Revisión del ventilador": "Fan inspection", "El extractor arrancó": "The exhaust fan kicked on", "Nadie cortó la corriente. Estabas en el techo y saliste volando un metro. Aterrizaste de pie. Pierdes veinte minutos buscando tu casco.": "Nobody cut the power. You were on the roof and got launched three feet. You landed on your feet. You lose twenty minutes looking for your helmet.", "Estoy bien. Estoy BIEN.": "I'm fine. I'm FINE.", "Limpieza del suelo": "Floor cleanup", "Bolsa reventada": "Burst bag", "La bolsa de contención vieja cedió. Agua con grasa por todo el suelo.": "The old containment bag gave out. Greasy water all over the floor.", "Me resbalé con estilo, ¿viste? Como patinador olímpico.": "I slipped with style, did you see? Like an Olympic skater.", "¿Y la llave del techo?": "Where's the roof key?", "Para limpiar el ducto hasta el ventilador hay que subir al techo. El acceso tiene candado y la llave no aparece.": "To clean the duct up to the fan, you need to get on the roof. The access is padlocked and the key is nowhere to be found.", "Pierdes 25 minutos de turno": "You lose 25 minutes of your shift", "Estaba colgada al lado del candado, con una etiqueta que dice LLAVE DEL TECHO.": "It was hanging right next to the padlock, with a tag that says ROOF KEY.", "Increíble. Yo la busqué en el congelador.": "Unbelievable. I checked the freezer.", "Saltar la valla": "Jump the fence", "Rápido. ¿Qué podría salir mal?": "Quick. What could go wrong?", "Salto perfecto": "Perfect jump", "Ni un rasguño. Te sientes en una película de acción.": "Not a scratch. You feel like you're in an action movie.", "Diez de diez. El jurado ruso te da un ocho.": "Ten out of ten. The Russian judge gives you an eight.", "El pantalón se quedó enganchado arriba. Tú llegaste abajo. Trabajas el resto del turno con brisa.": "Your pants stayed snagged up top. You made it down. You work the rest of the shift with a breeze.", "No voy a decir nada. No voy a decir nada. JAJAJA.": "I'm not gonna say anything. I'm not gonna say anything. HAHAHA.", "Llamar al gerente": "Call the manager", "Lo despiertas: menos propina": "You wake him up: smaller tip", "Llega en pijama": "He shows up in pajamas", "El gerente aparece en pijama de dinosaurios, abre el candado sin decir nada y se va.": "The manager shows up in dinosaur pajamas, opens the padlock without a word and leaves.", "Me encantó el pijama. Quiero uno.": "Loved the pajamas. I want a pair.", "Algo se mueve en el ducto": "Something's moving in the duct", "Dos ojos brillan al fondo. Es un mapache. Siempre es un mapache.": "Two eyes glow at the far end. It's a raccoon. It's always a raccoon.", "Abrir el registro despacio": "Open the access panel slowly", "Mantén pulsado 1,5 segundos": "Hold for 1.5 seconds", "El mapache del ducto": "The duct raccoon", "Desalojo amistoso": "Friendly eviction", "El mapache sale por el registro, te mira y se va con un trozo de pizza. Parece que asiente.": "The raccoon climbs out the access panel, looks at you and leaves with a slice of pizza. He seems to nod.", "Creo que nos hicimos amigos. Le voy a poner Rigoberto.": "I think we're friends now. I'm naming him Rigoberto.", "Golpear el ducto": "Bang on the duct", "Que se asuste y salga": "Scare it out", "Mapache suelto en la cocina": "Raccoon loose in the kitchen", "Mapache en la cocina": "Raccoon in the kitchen", "Sale disparado hacia la cocina, tira una torre de bandejas y desaparece por la puerta del almacén.": "It bolts into the kitchen, knocks over a tower of trays and vanishes through the storeroom door.", "¡Se llevó un pan! ¡SE LLEVÓ UN PAN!": "It took a bread roll! IT TOOK A BREAD ROLL!", "NO TOCAR": "DO NOT TOUCH", "¡Suena la alarma!": "The alarm's going off!", "El vapor llegó al detector. Hay tres pósits pegados junto al panel. Uno es el código.": "The steam reached the detector. There are three sticky notes next to the panel. One of them is the code.", "Claro que era 1234. Siempre es 1234.": "Of course it was 1234. It's always 1234.", "Voy a cambiar el código de mi casa. Por nada.": "I'm gonna change the code at my house. No reason.", "Visita de los bomberos": "Fire department visit", "Llegan los bomberos": "The firefighters show up", "Les explicas todo. Se ríen. Te ponen la multa igual.": "You explain everything. They laugh. They fine you anyway.", "El bombero me dio un sticker. Valió la pena.": "The firefighter gave me a sticker. Totally worth it.", "Se metió «para ver de cerca» y ahora solo se le ven las botas. Dice que está cómodo. No suena cómodo.": "He crawled in “for a closer look” and now all you can see are his boots. He says he's comfy. He doesn't sound comfy.", "Jalarlo de las botas": "Pull him out by the boots", "¡Plop!": "Plop!", "Gracias. Vi cosas ahí dentro. Cosas que no voy a contar.": "Thanks. I saw things in there. Things I'll never speak of.", "Echarle espuma para que resbale": "Foam him up so he slides out", "Gasta un cuarto de la botella": "Uses a quarter of the bottle", "Sale resbalando": "Slides right out", "Nunca había estado tan limpio. Ni el día de mi boda.": "I've never been this clean. Not even on my wedding day.", "Limpiar alrededor de sus botas": "Clean around his boots", "Sale solo… en 20 minutos": "He comes out on his own… in 20 minutes", "Ahí se quedó": "He stayed put", "La mejor siesta de mi vida. Ahí dentro hace calorcito.": "Best nap of my life. It's nice and toasty in there.", "¡¿QUÉ ES ESO?!": "WHAT IS THAT?!", "¡Una cucaracha del tamaño de un taco!": "A cockroach the size of a taco!", "No grites. No grites. ¡AAAH!": "Don't scream. Don't scream. AAAH!", "¡Cucaracha gigante!": "Giant cockroach!", "Salió de detrás de la campana y corre por la pared. Atrápala tres veces antes de que se meta en la cafetera.": "It came out from behind the hood and is racing up the wall. Catch it three times before it gets into the coffee maker.", "Fumigación de emergencia (la cucaracha se metió en la cafetera)": "Emergency fumigation (the cockroach got into the coffee maker)", "Se escapó": "It got away", "Se metió en la cafetera. Mañana alguien va a pedir un capuchino muy crujiente.": "It crawled into the coffee maker. Tomorrow someone's ordering a very crunchy cappuccino.", "Yo no vuelvo a tomar café. Nunca.": "I'm never drinking coffee again. Ever.", "blanco cuca": "roach target", "Atrapar la cucaracha": "Catch the cockroach", "La cucaracha gigante": "The giant cockroach", "¡Atrapada!": "Gotcha!", "La sacas en un vaso, con todo respeto. Se va caminando muy digna hacia el estacionamiento.": "You carry it out in a cup, with all due respect. It strolls off toward the parking lot with great dignity.", "Le voy a poner Rigoberta. Como el mapache, pero en chiquito.": "I'm naming her Rigoberta. Like the raccoon, but fun-size.", "¡Apagón!": "Blackout!", "Se fue la luz en toda la cuadra. Solo te queda la linterna del casco. Desde algún lugar, el gerente grita: «¡¿Quién apagó?!»": "The whole block lost power. All you've got is your helmet light. Somewhere, the manager yells: “WHO TURNED OFF THE LIGHTS?!”", "Seguir con la linterna": "Keep going by flashlight", "La luz vuelve sola en un rato": "The power comes back on its own in a bit", "Esto es como acampar, pero con grasa.": "It's like camping, but greasier.", "Si ves dos ojos brillando, no soy yo.": "If you see two glowing eyes, that's not me.", "Yo no veo nada. Bueno, nunca veo nada.": "I can't see a thing. Then again, I never see anything.", "Buscar el tablero de la luz": "Find the breaker box", "Pierdes 15 minutos, pero vuelve la luz": "You lose 15 minutes, but the power's back", "Hágase la luz": "Let there be light", "El tablero estaba detrás de una caja de jitomates. Vuelve la luz y el refrigerador hace un ruido de alivio.": "The breaker box was behind a crate of tomatoes. The power comes back and the fridge hums with relief.", "Y se hizo. Gracias a ti. Y a los jitomates.": "And there was light. Thanks to you. And the tomatoes.", "¡Alarma de coche!": "Car alarm!", "Afuera suena una alarma: UIIIU, UIIIU. Es la de tu camioneta. Un gato se le subió encima y no piensa bajarse.": "An alarm is going off outside: WEE-OOO, WEE-OOO. It's your van. A cat climbed on top and refuses to get down.", "Salir a apagarla": "Go out and shut it off", "Pierdes 10 minutos": "You lose 10 minutes", "El gato sigue encima de la camioneta, mirándote con desprecio. Lo dejas ahí.": "The cat is still on the van, staring at you with contempt. You leave it there.", "Ese gato tiene más actitud que el gerente.": "That cat has more attitude than the manager.", "¿Qué podría salir mal?": "What could go wrong?", "Misión cumplida": "Mission accomplished", "El señor de los elotes me fió. Ahora somos amigos.": "The elote guy let me pay later. Now we're friends.", "Cerrajero: las llaves se quedaron dentro de la camioneta": "Locksmith: keys locked inside the van", "Llaves dentro": "Keys locked in", "Técnicamente ya no suena. Misión cumplida.": "Technically it's not beeping anymore. Mission accomplished.", "Tarde o temprano se calla. ¿No?": "It'll shut up eventually. Right?", "Los vecinos están prendiendo las luces… uno trae una chancla.": "The neighbors are turning on their lights… one of them is holding a sandal.", "La campana me está hablando… dice que me quiere.": "The hood is talking to me… it says it loves me.", "¿Ustedes también ven al unicornio de acero inoxidable?": "Do you guys see the stainless steel unicorn too?", "Shhh… el extractor está cantando cumbia.": "Shhh… the exhaust fan is singing cumbia.", "Destapó el bidón «para ver si olía a limón» y ahora ve cosas. Está abrazando el extractor y le canta. Así no puede trabajar.": "He opened the jug “to see if it smelled like lemon” and now he's seeing things. He's hugging the exhaust fan and serenading it. He can't work like this.", "Sacar a tomar aire": "Take him out for some air", "Mantén pulsado 1,5 s · vuelve en un minuto": "Hold for 1.5 s · back in a minute", "Aire fresco": "Fresh air", "Ya estoy bien. Creo. ¿Por qué hay tres de ti?": "I'm fine now. I think. Why are there three of you?", "Agua de jamaica y un taco": "Hibiscus water and a taco", "−$15 · vuelve más rápido": "−$15 · back faster", "Taco y agua de jamaica de emergencia": "Emergency taco and hibiscus water", "Taco medicinal": "Medicinal taco", "Nunca había probado un taco tan… tridimensional.": "I've never had a taco so… three-dimensional.", "Dejarlo, ya se le pasará": "Leave him, he'll snap out of it", "Mmm…": "Hmm…", "Arte moderno": "Modern art", "¡Mira, sonríe! Como nosotros.": "Look, it's smiling! Just like us.", "Se le pasó solo": "He snapped out of it on his own", "¿Qué me perdí? ¿Por qué me están grabando?": "What did I miss? Why are you filming me?", "Se metió a raspar «un ratito» y ahora ronca allá adentro. El eco suena como un oso. Golpea el ducto cuatro veces para despertarlo.": "He went in to scrape “for a sec” and now he's snoring in there. The echo sounds like a bear. Bang on the duct four times to wake him up.", "Sigue roncando": "Still snoring", "zzz… cinco minutitos… zzz": "zzz… five more minutes… zzz", "¡Toc!": "Knock!", "¡Despierto!": "I'm up!", "No estaba dormido. Estaba escuchando la grasa.": "I wasn't asleep. I was listening to the grease.", "quién usa la hidrolavadora": "who gets the pressure washer", "la estación de la radio": "the radio station", "el último taco": "the last taco", "quién raspó mejor la esquina": "who scraped the corner better", "¡Ni lo sueñes!": "In your dreams!", "Piedra, papel o tijera": "Rock, paper, scissors", "Que decida el destino": "Let fate decide", "Ganó ": "Winner: ", "¡Invicto! Como mi abuela en la lotería.": "Undefeated! Like my grandma at bingo.", "Refrescos para los dos": "Sodas for both", "−$20 · se contentan": "−$20 · they make up", "Refrescos para hacer las paces": "Peace-offering sodas", "Paz con burbujas": "Peace with bubbles", "Brindan con refresco de toronja. Ahora son mejores amigos. Por un rato.": "They toast with grapefruit soda. Now they're best friends. For a while.", "Te quiero, compa. Pero la hidro es mía.": "Love you, buddy. But the pressure washer is mine.", "Regañarlos a los dos": "Scold them both", "Trabajan más… y te quieren menos": "They work harder… and like you less", "Los dos raspan furiosos sin hablarse. La campana nunca había estado tan limpia tan rápido.": "They both scrape furiously without speaking. The hood has never gotten so clean so fast.", "Sí, jefe. Perdón, jefe. (Él empezó.)": "Yes, boss. Sorry, boss. (He started it.)", "Un corte en el dedo. Grita más por el susto que por el dolor, pero hay que curarlo antes de que toque la grasa.": "A cut on the finger. He's screaming more from the shock than the pain, but it needs patching up before it touches grease.", "Botiquín: limpiar y vendar": "First-aid kit: clean and bandage", "Es mi primera herida de guerra. Le voy a poner nombre.": "My first battle wound. I'm gonna name it.", "Cinta americana y a seguir": "Duct tape and keep going", "Lo arregla todo… ¿no?": "It fixes everything… right?", "Aguantó": "It held", "La cinta aguanta. La cinta siempre aguanta.": "The tape holds. The tape always holds.", "Ya no siento el dedo. Eso es bueno, ¿verdad?": "I can't feel my finger anymore. That's good, right?", "Urgencias: el corte se ensució con grasa": "ER: the cut got grease in it", "A urgencias": "Off to the ER", "La doctora me regañó más que tú.": "The doctor scolded me more than you did.", "Que conteste": "Let him answer", "Se va un rato a hablar": "He steps away to talk for a while", "«Sí, ma. Sí, ma.»": "“Yes, Mom. Yes, Mom.”", "Dice que le mandes saludos. Y que me pagues más.": "She says hi. And that you should pay me more.", "Contestar tú": "Answer it yourself", "Con voz de jefe responsable": "In your responsible-boss voice", "Señora encantada": "Mom is charmed", "¿Qué le dijiste? Me mandó un corazón. A mí nunca.": "What did you tell her? She sent you a heart. She never sends me hearts.", "La señora pide hablar con «el encargado de verdad». Tardas veinte minutos en convencerla.": "She asks to speak to “the one actually in charge.” It takes you twenty minutes to convince her.", "Ja. Bienvenido a mi vida.": "Ha. Welcome to my life.", "Que apague el teléfono": "Tell him to turn off his phone", "Aquí se viene a trabajar": "We came here to work", "Si me desheredan, te adopto como mamá.": "If they disown me, I'm adopting you as my mom.", "se metió al ducto equivocado": "crawled into the wrong duct", "Estaban limpiando el ducto de la cafetería de al lado. Muy limpio, eso sí.": "They were cleaning the duct of the coffee shop next door. Very clean, though.", "se fue por tortas": "went out for tortas", "Dicen que «era urgente». Las tortas, sí, se ven urgentes.": "They say it “was urgent.” The tortas do look urgent.", "se quedó encerrado en la cámara fría": "got locked in the walk-in freezer", "La puerta se cerró sola. Están bien, pero tiritando.": "The door closed by itself. They're fine, just shivering.", " Su zona se quedó parada.": " Their area is on hold.", "Llamarlos por la radio": "Call them on the radio", "Vuelven solos, pero tardan": "They come back on their own, but slowly", "Ya vienen": "On their way", "Copiado. Cambio. ¿Cambio? Cambio.": "Copy. Over. Over? Over.", "Ir por ellos": "Go get them", "Pierdes 10 minutos tú": "You lose 10 minutes", ", con una torta para ti": ", with a torta for you", "Gracias, jefe. No le diga a Angélica.": "Thanks, boss. Don't tell Angélica.", "¿¡Un mapache DORADO!?": "A GOLDEN raccoon?!", "Brilla más que la campana migdaleada. Te mira, te guiña un ojo y deja algo en el suelo del ducto.": "It shines brighter than the polished hood. It looks at you, winks, and leaves something on the duct floor.", "Saludarlo con respeto": "Greet it respectfully", "Leyenda viviente": "Living legend", "Dejó una moneda antigua. El cliente dice que trae suerte y te sube la propina.": "It left an old coin. The client says it's good luck and bumps up your tip.", "Nadie nos va a creer. NADIE. ¿Le tomaste foto? ¿NO?": "Nobody's gonna believe us. NOBODY. Did you get a picture? NO?", "¿Hola? ¿Me escucha? ¿¿YA CASI??": "Hello? Can you hear me? ALMOST DONE??", "¿Me está dejando en visto? ¿En persona?": "Are you leaving me on read? In person?", "Ah, ¿no me contesta? Muy bien. Muy bien.": "Oh, not answering me? Fine. Just fine.", "¡¿ME ESTÁ IGNORANDO?!": "ARE YOU IGNORING ME?!", "¡Hablo con usted, el de la rasqueta!": "I'm talking to you, scraper guy!", "¡Ni mi exesposa me ignoraba así!": "Not even my ex-wife ignored me like this!", "¡El gerente explota!": "The manager blows up!", "«¡Llevo toda la noche esperando! ¡Mañana abrimos a las siete! ¡Voy a llamar a su jefe!»": "“I've been waiting all night! We open at seven tomorrow! I'm calling your boss!”", "Calmarlo con un café y una charla": "Calm him down with coffee and a chat", "Pierdes 15 minutos de turno": "You lose 15 minutes of your shift", "Más tranquilo": "Much calmer", "Se toma el café, te cuenta lo de su divorcio y vuelve a su oficina. Ya no te molesta.": "He drinks the coffee, tells you all about his divorce, and goes back to his office. He doesn't bug you again.", "Yo también lloré con lo del divorcio.": "I cried at the divorce part too.", "Prometerle un 10 % de descuento": "Promise him a 10% discount", "Menos cobro, pero contento": "Less pay, but he's happy", "Trato hecho": "Deal", "«Un diez por ciento… bueno. Pero que brille, ¿eh?»": "“Ten percent… fine. But it'd better shine, huh?”", "El descuento sale de tu sueldo, ¿verdad? Solo preguntaba.": "The discount comes out of your paycheck, right? Just asking.", "Ignorarlo y seguir raspando": "Ignore him and keep scraping", "Él llama a quien tenga que llamar": "He calls whoever he has to call", "El gerente se quejó por teléfono de lo que tardaste": "The manager called to complain about how long you took", "Llamada furiosa": "Furious phone call", "Llama a Don Rigo a las tres de la mañana. Don Rigo contesta en pijama. No está contento.": "He calls Don Rigo at three in the morning. Don Rigo picks up in his pajamas. He's not happy.", "Te deja una reseña de una estrella: «Lentos. La campana quedó bien, pero lentos».": "He leaves you a one-star review: “Slow. The hood looks fine, but slow.”", "Uy. Yo de ti no contestaba el teléfono mañana.": "Yikes. I wouldn't answer the phone tomorrow if I were you.", "Bip. Entrando al ducto. Bup.": "Beep. Entering duct. Boop.", "Ductobot en posición. Iniciando protocolo «no tocar al mapache».": "Ductobot in position. Initiating “do not touch the raccoon” protocol.", "Bip bup. Grasa detectada. Mucha grasa. Demasiada grasa.": "Beep boop. Grease detected. Lots of grease. Way too much grease.", "A ver, a ver. Este ducto no se limpia solo. Bueno, sí: yo.": "Alright, alright. This duct won't clean itself. Well, it will: that's me.", "Ahí voy. Y no me toquen la radio.": "Here I go. And nobody touch my radio.", "En mis tiempos esto se hacía a mano. Bip.": "Back in my day we did this by hand. Beep.", "Bip… bip… ¡BUP! Atorado en una costra. Necesito un humano.": "Beep… beep… BOOP! Stuck in a crust. Requesting a human.", "Error 404: ducto no encontrado. Bueno, sí lo encuentro. No me puedo mover.": "Error 404: duct not found. Okay, I found it. I just can't move.", "¡Me atoré! Esto me pasa por no desayunar. Ayúdame.": "I'm stuck! That's what I get for skipping breakfast. Help me.", "Ya no estoy para estos trotes. Sácame de aquí, chamaco.": "I'm too old for this. Get me out of here, kid.", "Bip bup. Ducto limpio. Las esquinas: tarea para el humano.": "Beep boop. Duct clean. Corners: homework for the human.", "Bip bup. Ducto limpio. Esquinas incluidas. De nada, humano.": "Beep boop. Duct clean. Corners included. You're welcome, human.", "Listo. Las esquinas te tocan a ti, que para eso te pago.": "Done. The corners are on you, that's what I pay you for.", "Listo, y con esquinas. Así se trabaja, ¿eh? Aprende.": "Done, corners and all. That's how it's done, huh? Take notes.", "Robot rescatado": "Robot rescued", "El Ductobot se atoró": "The Ductobot got stuck", "Se quedó trabado en una costra de grasa del tamaño de un ladrillo. Hace «bip» cada vez más triste.": "It's wedged in a grease crust the size of a brick. Its “beeps” keep getting sadder.", "Darle un golpecito": "Give it a little tap", "Un golpe preciso y el robot sigue su camino como si nada.": "One precise whack and the robot carries on like nothing happened.", "Bip. Gracias. No vuelvas a hacer eso. Bup.": "Beep. Thank you. Never do that again. Boop.", "Jalarlo con la cuerda": "Pull it out with the rope", "Seguro, pero pierdes 5 minutos": "Safe, but you lose 5 minutes", "Lo jalas despacito, le quitas la costra y lo vuelves a soltar.": "You pull it out gently, scrape off the crust, and send it back in.", "Bip bup. Me siento como un perrito con correa.": "Beep boop. I feel like a puppy on a leash.", "Echarle espuma": "Foam it", "Gasta un poco de espuma, pero luego va más rápido": "Uses a bit of foam, but it goes faster after", "La costra se ablanda y el robot sale disparado, resbalando con estilo.": "The crust softens and the robot shoots out, sliding in style.", "¡Wiiiii! Bip. Perdón. Bup.": "Wheeee! Beep. Sorry. Boop.", "¡GANASTE!": "YOU WIN!", "¿Ya? ¿YA? Esto no se queda así.": "Done? DONE? This isn't over.", "Seguro hicieron trampa. Una rasqueta con turbo o algo.": "They totally cheated. Turbo scraper or something.", "Mi cuñado el alcalde se va a enterar de esto.": "My brother-in-law the mayor is gonna hear about this.", "¡Terminé! ¿Les presto una rasqueta?": "Finished! Want to borrow a scraper?", "Listo. El cliente es mío. Ustedes sigan jugando a limpiar.": "Done. The client's mine. You all keep playing cleanup.", "¡Ganamos! Bueno, gané yo. Ustedes no.": "We won! Well, I won. You didn't.", "El Cuñado terminó primero. Acaba igual: el cliente te paga la mitad.": "El Cuñado finished first. You still finish: the client pays you half.", "¡Uy! Se me resbaló la cubeta… justo en tu ": "Oops! My bucket slipped… right onto your ", "Perdón, perdón. Fue el viento. Dentro de la cocina. Sí.": "Sorry, sorry. It was the wind. Inside the kitchen. Yep.", "¿Eso es grasa mía? Qué raro. Será tuya.": "Is that my grease? Weird. Must be yours.", "Interrumpimos la transmisión: aquí El Cuñado. Esta canción va dedicada a los que van perdiendo. Saludos.": "We interrupt this broadcast: El Cuñado here. This next song goes out to everyone who's losing. Cheers.", "Yo ya voy por el ducto. ¿Y ustedes?": "I'm already on the duct. How about you?", "Uy, qué lentos. ¿Les traigo un cafecito?": "Wow, so slow. Want me to bring you a coffee?", "Mi rasqueta es importada. De Tijuana.": "My scraper's imported. From Tijuana.", "¿Cómo van tan rápido? ¿Eso es legal?": "How are you going so fast? Is that even legal?", "No me presionen, que me tiembla la rasqueta.": "Don't rush me, my scraper's shaking.", "Voy atrás porque mi ayudante se fue al baño. Hace una hora.": "I'm behind because my helper went to the bathroom. An hour ago.", "¡Jefe! Me pegué con cinta a la campana. No sé cómo. Bueno, sí sé.": "Boss! I taped myself to the hood. No idea how. Okay, I have some idea.", "Libre. Me quedó la cinta marcada en la frente. Me veo interesante.": "Free. The tape left a mark on my forehead. I look mysterious.", "Sigo pegado. Ya me acostumbré. Desde aquí se ve bonito.": "Still stuck. I'm used to it now. Nice view from up here.", "Prendí la freidora para ver si funcionaba. Funciona. MUCHO.": "I turned on the fryer to see if it worked. It works. A LOT.", "¡Apágala!": "Turn it off!", "Apagada. Pero olía rico, ¿verdad?": "It's off. But it smelled great, right?", "Ya se apagó sola. Bueno, se acabó el aceite. Está en la campana.": "It shut off on its own. Well, it ran out of oil. The oil's on the hood.", "Voy a grabar un video bailando arriba de la campana. Para las redes de la empresa.": "I'm gonna film myself dancing on top of the hood. For the company's socials.", "¡Bájate de ahí!": "Get down from there!", "Ok, ok. Pero mañana me grabas tú.": "Okay, okay. But tomorrow you film me.", "¡Ya va en mil vistas! Somos famosos. Y la campana sigue en pie.": "A thousand views already! We're famous. And the hood is still standing.", "Estoy bien. La campana no tanto.": "I'm fine. The hood, not so much.", "Le dije al gerente que somos «casi profesionales». Creo que no le gustó el «casi».": "I told the manager we're “almost professionals.” I don't think he liked the “almost.”", "Arreglarlo con el gerente": "Smooth it over with the manager", "Le dijiste que era broma y se rió. Bueno, hizo un ruido.": "You told him it was a joke and he laughed. Well, he made a noise.", "¿Casi profesionales? Los estoy vigilando.": "Almost professionals? I'm watching you.", "Me comí el queso que estaba en la barra. Era de muestra, ¿no? ¿NO?": "I ate the cheese on the counter. It was a sample, right? RIGHT?", "Reponer el queso (−$12)": "Replace the cheese (−$12)", "Queso del cliente repuesto": "Client's cheese replaced", "Queso repuesto. Nadie se enteró. Excepto yo, que sigo con hambre.": "Cheese replaced. Nobody noticed. Except me, I'm still hungry.", "¿Alguien vio mi queso? Era para el desayuno de mañana.": "Has anyone seen my cheese? It was for tomorrow's breakfast.", "Guardé la rasqueta en el ducto para no perderla. Ahora no sé dónde está el ducto.": "I put the scraper in the duct so I wouldn't lose it. Now I can't find the duct.", "Ayudarle a buscarla": "Help him look for it", "Estaba en mi bolsillo. Siempre estuvo ahí.": "It was in my pocket. It was there the whole time.", "Sigo buscando. Si alguien ve una rasqueta con calcomanía de unicornio, es mía.": "Still looking. If anyone sees a scraper with a unicorn sticker, it's mine.", "Jefe, ¿este cable rojo es importante? Ya lo desconecté, pero pregunto.": "Boss, is this red cable important? I already unplugged it, just asking.", "Volver a conectarlo": "Plug it back in", "Conectado. El refrigerador volvió a hacer ruido. Qué alivio.": "Plugged in. The fridge is humming again. What a relief.", "Refrigerador desconectado: se echaron a perder unas cremas": "Fridge unplugged: some creams went bad", "Ahora el refrigerador hace un ruido distinto. Uno triste.": "Now the fridge makes a different noise. A sad one.", "Esquina inferior izquierda. Tres centímetros de grasa. Se la marqué.": "Bottom left corner. Three centimeters of grease. I marked it for you.", "Residuo a las seis en punto. Corríjalo antes de que lo vea el inspector.": "Residue at six o'clock. Fix it before the inspector sees it.", "Eso no pasa la norma ni en sueños. Ahí. Donde brilla.": "That wouldn't pass code in your wildest dreams. There. Where it's shiny.", "Le marqué lo que falta. No me lo agradezca: corríjalo.": "I marked what's missing. Don't thank me: fix it.", "Hoy sonreí una vez. Fue un error.": "I smiled once today. It was a mistake.", "El Beto ese me cae bien. De lejos.": "That Beto kid, I like him. From a distance.", "Me dijeron que me ría más. Lo estoy considerando para el próximo año.": "They told me to laugh more. I'm considering it for next year.", "una charola de vasos": "a tray of glasses", "el bote de basura": "the trash can", "la escalera contra la vitrina": "the ladder against the display case", "una cubeta de agua con grasa": "a bucket of greasy water", "¡Perdón, perdón, perdón!": "Sorry, sorry, sorry!", "Eso estaba mal puesto.": "That was in a bad spot.", "Cubeta pateada por Beto (agua por todo el suelo)": "Bucket kicked by Beto (water all over the floor)", "¡Ups! Pateé la cubeta. El suelo ya estaba sucio, ¿no?": "Oops! Kicked the bucket. The floor was already dirty, right?", "Me resbalé y me agarré de la campana. Dejé la mano marcada. Como en Hollywood.": "I slipped and grabbed the hood. Left my handprint. Like Hollywood.", "Confundí el desengrasante con mi refresco. Estoy bien. Huelo a limón.": "I mixed up the degreaser with my soda. I'm fine. I smell like lemon.", "Te falta ahí. No, ahí. Donde brilla.": "You missed a spot. No, there. Where it's shiny.", "Te lo marco. De nada.": "I'll mark it for you. You're welcome.", "Esa esquina no se limpia sola. Te la marco.": "That corner won't clean itself. I'll mark it for you.", "Beto le desinfla una llanta a su camioneta": "Beto lets the air out of his van's tire", "Beto le cambió el desengrasante por agua de jamaica.": "Beto swapped his degreaser for hibiscus water.", "Lupe le dice al gerente que El Cuñado usa agua del baño": "Lupe tells the manager El Cuñado uses toilet water", "Lupe lo miró fijamente durante un minuto. El Cuñado perdió la concentración.": "Lupe stared at him for a full minute. El Cuñado lost his focus.", "Chuy se sienta en su escalera": "Chuy sits on his ladder", "Chuy se sentó en la escalera del Cuñado y se quedó dormido encima.": "Chuy sat on El Cuñado's ladder and fell asleep on it.", "Le escondes la escalera detrás del congelador": "Hide his ladder behind the freezer", "El Cuñado lleva diez minutos buscando su escalera. Silbas mirando al techo.": "El Cuñado has been looking for his ladder for ten minutes. You whistle at the ceiling.", "¡¿QUIÉN FUE?!": "WHO DID THIS?!", "Esto es una guerra. Una guerra limpia. Bueno, sucia.": "This is war. A clean war. Well, a dirty one.", "Me las van a pagar. En efectivo.": "You'll pay for this. In cash.", "¡Noticia de última hora! Una campana limpiecita y sin un solo accidente. Eso se celebra con cumbia.": "Breaking news! A squeaky-clean hood and not a single accident. That calls for cumbia.", "¡Volvió la luz! Ya extrañaba ver la grasa.": "The power's back! I was starting to miss the grease.", "Luz. Por fin. Me estaba dando miedo mi propia sombra.": "Light. Finally. My own shadow was scaring me.", "Queja de los vecinos por la alarma (y una chancla)": "Neighbors complained about the alarm (and threw a sandal)", "Ya se calló. Una vecina le tiró una chancla al gato. Y luego a ing", "Pon el dedo sobre la grasa y arrástralo, con pasadas cortas: así raspa la rasqueta.": "Put your finger on the grease and drag it in short strokes: that's how the scraper works.", "La grasa oscura es más dura. Toca la espuma, rocíala encima, espera 2 segundos y vuelve a la rasqueta: sale el triple de rápido.": "Dark grease is tougher. Tap the foam, spray it on, wait 2 seconds and go back to the scraper: it comes off three times faster.", "¡Esta zona ya pasa la inspección! Cambia a otra con los botones de abajo.": "This zone passes inspection now! Switch to another one with the buttons below.", "Limpia todas las zonas. Cuando estén en verde, toca «Terminar de lavar».": "Clean every zone. When they're all green, tap “Finish washing”.", "Ahora pela: arrastra por los puntos para arrancar el plástico, quita las cubiertas y baja la bolsa.": "Now peel: swipe across the dots to tear off the plastic, remove the covers and take down the bag.", "Último paso: migdalea la campana (pasadas sobre el metal limpio) hasta que brille, y luego llama al inspector.": "Last step: polish the hood (strokes over the clean metal) until it shines, then call the inspector.", "¡Chof! Bueno, el suelo también necesitaba agua.": "Splash! Well, the floor needed water too.", "Lo más satisfactorio de la noche: pelar el plástico.": "The most satisfying part of the night: peeling the plastic.", "Pela despacito, como un plátano de acero.": "Peel it slowly, like a steel banana.", "Si el plástico sale entero, pide un deseo.": "If the plastic comes off in one piece, make a wish.", "Ahora a migdalear. Que se vea hasta el alma.": "Now let's polish. Make it shine down to its soul.", "Migdalea bonito, que el dueño se quiere peinar ahí.": "Polish it nice, the owner wants to comb his hair in it.", "El toque final. Migdalea como si fuera tu camioneta.": "The finishing touch. Polish it like it's your own van.", "¡Encontraste la frecuencia secreta! Para ti, el Himno de la Grasa. De pie, por favor.": "You found the secret frequency! Just for you, the Grease Anthem. Please rise.", "¡No! ¡La música! La campana se pone triste.": "No! The music! The hood gets sad.", "Noche 1 · Aprende con Beto": "Night 1 · Learn with Beto", "Una cafetería tranquila para aprender. Te iré diciendo qué hacer paso por paso.": "A quiet café to learn the ropes. I'll tell you what to do step by step.", "Noche 2 · Ahora tú solito": "Night 2 · On your own", "Otra fácil, pero ya sin instrucciones. A ver qué aprendiste.": "Another easy one, but no instructions. Let's see what you learned.", "Noche 3 · Se pone difícil": "Night 3 · It gets tough", "Grasa quemada, sarro, un gerente con prisa y menos tiempo. Hoy va Lupe contigo.": "Burnt grease, scale, a manager in a hurry and less time. Lupe's coming with you today.", "Noche 4 · El trabajo grande": "Night 4 · The big job", "Un food court entero: tres campanas, varios ductos y media empresa trabajando contigo. Angélica reparte.": "A whole food court: three hoods, several ducts and half the company working with you. Angélica hands out the jobs.", "Equipo de Nacho": "Nacho's team", "Las gemelas Rendón": "The Rendón twins", "Trae su propia música. Mala.": "Brings his own music. Bad music.", "Pongan algo bueno, ¿no?": "Put on something good, huh?", "Fue campeón de lucha libre infantil.": "Was a kids' lucha libre champion.", "¡Yo con la grasa me rifo dos de tres caídas!": "I take on grease two falls out of three!", "Le tiene miedo a las alturas.": "Afraid of heights.", "Yo el techo no. El suelo sí.": "Not the roof. Floor, yes.", "Habla con las campanas.": "Talks to the hoods.", "Tranquila, bonita, ya casi.": "Easy, sweetie, almost done.", "Estudió química dos semanas.": "Studied chemistry for two weeks.", "Esto es pura saponificación, jefe.": "This is pure saponification, boss.", "Siempre tiene hambre.": "Always hungry.", "¿Alguien trajo tortas?": "Anybody bring tortas?", "Es primo de alguien del ayuntamiento.": "Is cousins with somebody at city hall.", "Si quie function superficie(w, h, base, micrasRel, celda = .03, geo, lado, tipos) {
  const nx = Math.max(8, Math.round(w / celda)), ny = Math.max(8, Math.round(h / celda));
  const n = nx * ny;
  const d = new Float32Array(n), soak = new Float32Array(n).fill(-1), pol = new Float32Array(n), wet = new Float32Array(n);
  const data = new Uint8Array(n * 4);
  const tex = new T.DataTexture(data, nx, ny, T.RGBAFormat);
  tex.magFilter = T.LinearFilter; tex.minFilter = T.LinearFilter; tex.generateMipmaps = false;
  // Grasa en manchas: ondas superpuestas, más gruesa en los bordes y las esquinas.
  const sem = Array.from({ length: 6 }, () => [Math.random() * 10, Math.random() * 10, rnd(2, 6)]);
  for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
    const u = x / nx, v = y / ny;
    let s = 0; for (const [a, b, f] of sem) s += Math.sin(u * f * 3 + a) * Math.cos(v * f * 2.4 + b);
    const borde = !geo && Math.min(u, 1 - u, v, 1 - v) < .1 ? .25 : 0;
    d[y * nx + x] = clamp(micrasRel * (.72 + s * .12 + borde + rnd(-.08, .08)), .08, 1.3);
  }
  // Manchas de suciedad especial: unas cuantas manchas redondas de cada tipo, más gruesas que la grasa normal.
  let tipo = null, ttex = null;
  if (tipos && Object.values(tipos).some(f => f > 0)) {
    tipo = new Uint8Array(n); const td = new Uint8Array(n * 4);
    for (const [t, f] of Object.entries(tipos)) {
      if (!(f > 0)) continue;
      const manchas = Math.max(1, Math.round(f * 7)), rr = Math.max(3, Math.sqrt(n * f / manchas / Math.PI));
      for (let k = 0; k < manchas; k++) {
        const cx = rnd(0, nx), cy = rnd(0, ny), r = rr * rnd(.7, 1.3);
        for (let y = Math.max(0, Math.floor(cy - r)); y < Math.min(ny, cy + r); y++) for (let x = Math.max(0, Math.floor(cx - r)); x < Math.min(nx, cx + r); x++) {
          if (Math.hypot(x - cx, y - cy) > r * (.8 + .2 * Math.sin(x * 1.7 + y))) continue;
          const i = y * nx + x; tipo[i] = +t; d[i] = clamp(d[i] + .2, .1, 1.3);
        }
      }
    }
    for (let i = 0; i < n; i++) if (tipo[i]) td[i * 4 + tipo[i] - 1] = 255;
    ttex = new T.DataTexture(td, nx, ny, T.RGBAFormat); ttex.magFilter = T.LinearFilter; ttex.minFilter = T.LinearFilter; ttex.generateMipmaps = false; ttex.needsUpdate = true;
  }
  const mesh = new T.Mesh(geo || new T.PlaneGeometry(w, h), materialGrasa(base, tex, lado, ttex));
  const sf = { mesh, nx, ny, d, soak, pol, wet, data, tex, tipo, ttex, w, h, celda: w / nx, inicial: d.reduce((a, b) => a + b, 0), sucio: true, interior: lado === T.BackSide };
  mesh.userData.sf = sf;
  pintarSf(sf);
  return sf;
}
function pintarSf(sf) {
  const { d, soak, pol, data } = sf;
  for (let i = 0; i < d.length; i++) {
    data[i * 4] = Math.min(255, d[i] / 1.4 * 255);
    const a = soak[i];
    data[i * 4 + 1] = a < 0 ? 0 : Math.max(0, 255 * (1 - a / 30)) * Math.min(1, d[i] * 4);
    data[i * 4 + 2] = Math.min(255, pol[i] * 255);
    data[i * 4 + 3] = Math.min(255, sf.wet[i] * 255);
  }
  sf.tex.needsUpdate = true; sf.sucio = false;
}
// Coloca una superficie plana mirando en la dirección de su normal.
function colocar(sf, pos, normal) {
  const m = sf.mesh; m.position.copy(pos);
  if (Math.abs(normal.y) > .99) m.rotation.set(normal.y > 0 ? -Math.PI / 2 : Math.PI / 2, 0, 0);
  else m.lookAt(pos.clone().add(normal));
  sf.normal = normal.clone();
}

  if (tipo === 'cafetera') { add(new T.BoxGeometry(ancho * .8, .45, .4), new T.MeshStandardMaterial({ color: 0xa83a2a, metalness: .4, roughness: .3 }), 0, .225, -.05); alto = .46; }
  if (tipo === 'mesa') { add(new T.BoxGeometry(ancho * .7, .03, .35), new T.MeshStandardMaterial({ color: 0xe8e2d0, roughness: .7 }), 0, .015, 0); for (let i = 0; i < 3; i++) add(new T.SphereGeometry(.04, 8, 6), new T.MeshStandardMaterial({ color: [0xd9442b, 0x5a9e3a, 0xf0c419][i] }), rnd(-.15, .15), .06, rnd(-.1, .1)); alto = .1; }
  // Equipos propios de cada tipo de cocina: así una panadería no se parece a una taquería.

    const olla = add(new T.CylinderGeometry(.24, .19, .3, 20), est(0xc5ccd2, { metalness: .8, roughness: .3 }), 0, .26, 0);

function moverMarcas() {
  const puestas = [];
  for (const m of MARCAS) {

    const vis = proy.z < 1 && Math.abs(proy.x) < 1.1 && Math.abs(proy.y) < 1.1;
    m.el.style.display = vis ? '' : 'none';

      for (let k = 0; k < 6; k++) {

        if (!choca) break;

// ---- la gente se mueve: la cuadrilla raspa, el gerente pasea (o mira el reloj), El Cuñado presume

// El agua escurre hacia abajo en hilos y se va secando; de la ceja de la campana caen gotas.
function escurrir(z, dt) {
  for (const s of z.sfs) {
    if (!s.mojado) continue;
    const w = s.wet, nx = s.nx, baja = s.normal && Math.abs(s.normal.y) < .5;

    for (let i = 0; i < w.length; i++) {

      if (w[i] > 0) { w[i] = Math.max(0, w[i] - dt * .1); hay = true; }
    }
    s.mojado = hay; s.sucio = true;
  }
  if (z.labio && M.goteo > .15 && azar(dt * 14 * M.goteo)) {
    const l = z.labio; emitir(new T.Vector3(l.cx + rnd(-l.hW / 2, l.hW / 2), l.y - .01, rnd(l.z0 + .1, l.z1)), 1, 'agua', new T.Vector3(0, -1, 0), .2);
  }
  if (z.gotas && M.etapa === 'lavar' && azar(dt * .8)) { const g = uno(z.gotas.filter(x => x.visible)); if (g) emitir(new T.Vector3(g.position.x, g.position.y - g.userData.largo / 2, g.position.z), 1, 'grasa', new T.Vector3(0, -1, 0), .1); }

// Pedazos de costra que saltan al raspar: unas pocas lascas que caen y se quedan un momento en el suelo.
const TROZOS = [];

  if (!t) { if (TROZOS.length >= 30) return; t = { m: new T.Mesh(geoTrozo, matTrozo), v: new T.Vector3(), vida: 0 }; escena.add(t.m); TROZOS.push(t); }
  t.m.position.copy(p); t.m.visible = true; t.m.scale.setScalar(rnd(.6, 1.5)); t.vida = 2.2;
  t.v.set(rnd(-.6, .6), rnd(.2, .8), rnd(-.6, .6)); if (n) t.v.addScaledVector(n, 1.2);

function animarGente(dt) {

  }

// Reto de fin de semana: viernes, sábado y domingo, tres cocinas gigantes seguidas con solo dos equipos de apoyo.
const FINDE_DIAS = ['Viernes', 'Sábado', 'Domingo'], FINDE_PREMIO = 6000;
const findeListo = () => S.fase === 'empresa' && (S.eq.flota || 0) >= 2;
function findeHoy() {
  const H = S.hoy; if (!H || S.fase !== 'empresa') return;
  if (S.finde && S.finde.noche !== S.noche && !H.ordenes.some(o => o.finde)) {
    if (S.finde.ultima !== S.noche - 1) { H.avisos.push('Reto de fin de semana perdido: no te presentaste a la siguiente cocina.'); S.finde = null; }
    else { const o = genOrden(uno(['plaza', 'convenciones'])); o.finde = S.finde.paso + 1; o.firmado = true; o.pago = r10(o.pago * 1.3); o.duelo = false; H.ordenes.unshift(o); H.sel = 0; for (const e of H.equipos || []) if (typeof e.o === 'number') e.o++; S.finde.noche = S.noche; }
  }
  // Se ofrece cada semana (y la primera vez que tienes con qué).
  if (!S.finde && findeListo() && !H.findeVisto && (S.noche % 7 === 5 || !S.findeOfrecido)) { H.findeOferta = true; H.findeVisto = true; S.findeOfrecido = true; }
}
function aceptarFinde() {
  const H = S.hoy; H.findeOferta = false;
  S.finde = { paso: 0, notas: [], noche: S.noche, ultima: null };
  const o = genOrden(uno(['plaza', 'convenciones'])); o.finde = 1; o.firmado = true; o.pago = r10(o.pago * 1.3); o.duelo = false;
  H.ordenes.unshift(o); H.sel = 0; for (const e of H.equipos || []) if (typeof e.o === 'number') e.o++;
}
function tarjetaFinde() {
  const H = S.hoy;
  if (H.findeOferta) return `<div class="orden finde"><span class="chip naranja">${L('Reto de fin de semana', 'Weekend challenge')}</span><h3>${L('Tres gigantes, dos equipos', 'Three giants, two teams')}</h3>
    <p class="nota">${L(`Viernes, sábado y domingo: una cocina gigante cada noche, seguidas, y solo puedes llevar <b>dos equipos</b> de apoyo. Si apruebas las tres: ${dinero(FINDE_PREMIO)} de premio, +10 de reputación y una medalla. Si fallas una, se acaba el reto (lo cobrado se queda).`, `Friday, Saturday and Sunday: one giant kitchen each night, in a row, and you can only bring <b>two support teams</b>. Pass all three: ${dinero(FINDE_PREMIO)} prize, +10 reputation and a medal. Fail one and the challenge is over (you keep what you earned).`)}</p>
    <div class="acciones"><button class="btn prim peq" id="findeSi">${L('Aceptar el reto', 'Accept the challenge')}</button><button class="btn peq" id="findeNo">${L('Este fin no', 'Not this weekend')}</button></div></div>`;
  if (S.finde) return `<div class="retos finde"><b>${L('Reto de fin de semana', 'Weekend challenge')} · ${L(FINDE_DIAS[Math.min(2, S.finde.paso)], EN.dias[Math.min(2, S.finde.paso)])} (${S.finde.paso + 1} ${L('de', 'of')} 3)</b>${FINDE_DIAS.map((d0, i) => L(d0, EN.dias[i])).map((d, i) => `<span class="${S.finde.notas[i] ? 'ok' : ''}">${S.finde.notas[i] ? '★ ' + d + ': ' + S.finde.notas[i] : '☆ ' + d}</span>`).join('')}<small>${L('Solo dos equipos pueden ayudarte. Si hoy haces otro trabajo, pierdes el reto.', 'Only two teams can help you. If you do another job tonight, you lose the challenge.')}</small></div>`;

const ANGELICA_DICE = [null, 'Hoy vas con Beto a una cafetería tranquila. Si rompe algo, me mandas foto. Para el expediente.', 'Otra fácil. Ya no te voy a explicar nada: confío en ti. Bueno, confío en Beto todavía menos.',
  'Hoy te mando con Lupe: la cocina viene quemada y el gerente es de los que miran el reloj. Suerte.', 'Hoy es la grande. Te pongo a dos equipos más contigo. Yo reparto, tú haces tu parte y revisas la de ellos.'];
function tableroRigo() {
  const H = S.hoy, o = H.ordenes[0], n = S.noche, filas = [];
  const rest = k => { const ks = Object.keys(COCINAS).filter(c => !COCINAS[c].gigante); const c = COCINAS[ks[hashTxt('r' + n + k) % ks.length]]; return c.nombres[hashTxt('n' + n + k) % c.nombres.length]; };
