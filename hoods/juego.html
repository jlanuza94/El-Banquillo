<style>
/* Turno de noche: pantalla a sangre con la cocina en 3D; paneles de acero oscuro, grasa ámbar y naranja de seguridad para lo que se toca. */
:root {
  --noche: #131d26;
  --panel: rgba(28, 42, 53, .94);
  --panel-solido: #1c2a35;
  --panel-2: #243542;
  --linea: #344957;
  --acero: #d3dae0;
  --tenue: #8fa1ae;
  --grasa: #e0a040;
  --hivis: #ff8a1f;
  --hivis-tinta: #1a1004;
  --espuma: #9fe0ef;
  --ok: #69c97a;
  --mal: #ff6a5c;
  --f-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --f-cuerpo: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --lado-i: max(16px, env(safe-area-inset-left, 0px));
  --lado-d: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--noche); color: var(--acero); font-family: var(--f-cuerpo); font-size: 15px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--hivis); outline-offset: 2px; }
#juego { position: fixed; inset: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD del turno */
.hud-arriba { position: absolute; left: 0; right: 0; top: 0; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); padding-bottom: 18px; display: grid; gap: 6px; pointer-events: none; background: linear-gradient(rgba(10,16,22,.75), rgba(10,16,22,0)); }
.hud-fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.reloj { font-family: var(--f-mono); font-size: 26px; font-weight: 600; color: var(--hivis); font-variant-numeric: tabular-nums; line-height: 1; }
.cliente { font-family: var(--f-cond); font-weight: 700; font-size: 16px; letter-spacing: .03em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-ico { pointer-events: auto; background: var(--panel); border: 1px solid var(--linea); border-radius: 6px; width: 40px; height: 40px; display: grid; place-items: center; font-size: 14px; flex: none; }
.tiempo { height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
.tiempo div { height: 100%; background: var(--hivis); }
.chat { display: grid; gap: 5px; justify-items: start; }
.burbuja { pointer-events: auto; max-width: min(92%, 420px); background: var(--panel); border: 1px solid var(--linea); border-radius: 4px 12px 12px 12px; padding: 7px 10px; display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; animation: entra .25s ease-out; font-size: 14px; }
.burbuja .cara { width: 30px; height: 30px; border-radius: 50% 50% 6px 6px; display: grid; place-items: center; font-family: var(--f-display); font-size: 13px; color: var(--hivis-tinta); }
.burbuja b { font-family: var(--f-cond); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); display: block; }
.burbuja .resp { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
@keyframes entra { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

.hud-abajo { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); padding-top: 24px; display: grid; gap: 8px; pointer-events: none; background: linear-gradient(rgba(10,16,22,0), rgba(10,16,22,.8)); }
.zonas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.zonas button { pointer-events: auto; background: var(--panel); border: 1px solid var(--linea); border-radius: 6px; padding: 5px 8px; text-align: left; display: grid; }
.zonas button[aria-pressed="true"] { border-color: var(--hivis); }
.zonas b { font-family: var(--f-cond); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.zonas span { font-family: var(--f-mono); font-size: 12px; color: var(--tenue); font-variant-numeric: tabular-nums; }
.zonas .listo span { color: var(--ok); }
.mandos { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.herr-btn { pointer-events: auto; width: 78px; height: 78px; border-radius: 50%; background: var(--panel-solido); border: 3px solid var(--hivis); display: grid; place-items: center; align-content: center; touch-action: none; flex: none; }
.herr-btn svg { width: 34px; height: 34px; }
.herr-btn small { font-family: var(--f-cond); font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
.info { display: grid; gap: 4px; justify-items: start; min-width: 0; }
.ayuda { font-size: 13px; color: var(--acero); text-shadow: 0 1px 2px #000; min-height: 1.4em; }
.botella { font-family: var(--f-mono); font-size: 12px; color: var(--espuma); }
.combo { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: 40px; color: var(--hivis); text-shadow: 0 3px 0 var(--hivis-tinta), 0 0 18px rgba(255,138,31,.5); pointer-events: none; opacity: 0; white-space: nowrap; }
.combo.ve { animation: combo .7s ease-out; }
@keyframes combo { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }

/* Rueda de herramientas */
.rueda { position: absolute; width: 250px; height: 250px; margin: -125px 0 0 -125px; pointer-events: none; }
.rueda .sector { position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: var(--panel-solido); border: 2px solid var(--linea); display: grid; place-items: center; align-content: center; text-align: center; }
.rueda .sector svg { width: 28px; height: 28px; }
.rueda .sector small { font-family: var(--f-cond); font-weight: 700; font-size: 11px; text-transform: uppercase; line-height: 1.05; }
.rueda .sector.sel { border-color: var(--hivis); background: var(--panel-2); transform: scale(1.12); }
.rueda .sector.off { opacity: .35; }
.rueda .centro { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--hivis); }

/* Pantallas (camioneta, taller, preparación, parte) */
.pantalla { position: absolute; inset: 0; overflow-y: auto; background: linear-gradient(rgba(13,20,27,.5), rgba(13,20,27,.93) 38%); padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); }
.hoja { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.hoja p { margin: 0; }
.rotulo { font-family: var(--f-display); font-size: clamp(26px, 7.5vw, 38px); line-height: .95; color: var(--acero); text-wrap: balance; }
.rotulo span { color: var(--hivis); display: block; font-size: .6em; margin-top: 4px; }
.datos { display: flex; flex-wrap: wrap; gap: 6px; }
.dato { background: var(--panel); border: 1px solid var(--linea); border-radius: 4px; padding: 4px 10px; display: grid; }
.dato b { font-family: var(--f-mono); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dato i { font-style: normal; font-family: var(--f-cond); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--tenue); }
.jefe { background: var(--panel); border-left: 3px solid var(--grasa); padding: 10px 12px; border-radius: 0 6px 6px 0; display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
.jefe .cara, .comp .cara { width: 40px; height: 40px; border-radius: 50% 50% 8px 8px; display: grid; place-items: center; font-family: var(--f-display); color: var(--hivis-tinta); }
.jefe b { font-family: var(--f-cond); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); display: block; }
h2.sec { margin: 4px 0 0; font-family: var(--f-cond); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); font-weight: 700; }
.orden { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; text-align: left; width: 100%; }
button.orden[aria-pressed="true"] { border-color: var(--hivis); box-shadow: inset 0 0 0 1px var(--hivis); }
.orden h3 { margin: 0; font-family: var(--f-cond); font-size: 21px; line-height: 1.1; color: var(--acero); }
.fila { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.nota { font-size: 13px; color: var(--tenue); }
.pista { font-size: 14px; color: var(--grasa); }
.pago { font-family: var(--f-mono); font-size: 20px; font-weight: 600; }
.chip { display: inline-block; font-family: var(--f-cond); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--panel-2); }
.chip.num { text-transform: none; font-family: var(--f-mono); font-weight: 600; letter-spacing: 0; }
.chip.ok { background: rgba(105,201,122,.18); color: var(--ok); }
.chip.mal { background: rgba(255,106,92,.18); color: var(--mal); }
.companeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.comp { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px; display: grid; grid-template-columns: 40px 1fr; gap: 8px; text-align: left; align-items: start; }
.comp[aria-pressed="true"] { border-color: var(--hivis); box-shadow: inset 0 0 0 1px var(--hivis); }
.comp:disabled { opacity: .45; cursor: not-allowed; }
.comp b { font-family: var(--f-cond); font-size: 17px; display: block; }
.comp span { font-size: 12px; color: var(--tenue); display: block; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--linea); background: var(--panel-2); border-radius: 6px; padding: 11px 16px; font-family: var(--f-cond); font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; }
.btn.prim { background: var(--hivis); border-color: var(--hivis); color: var(--hivis-tinta); }
.btn.peq { padding: 6px 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.check { display: grid; gap: 8px; }
.check button { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; text-align: left; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 11px 12px; }
.check .box { width: 26px; height: 26px; border: 2px solid var(--tenue); border-radius: 4px; display: grid; place-items: center; font-weight: 700; color: var(--hivis-tinta); }
.check button[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); }
.check small { display: block; color: var(--tenue); font-size: 13px; }
.cuentas { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 12px; }
.cuentas span:nth-child(even) { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.cuentas .total { font-weight: 700; border-top: 1px solid var(--linea); padding-top: 6px; }
.zonas-parte { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 12px; }
.cita { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.cita b { font-family: var(--f-cond); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); display: block; }
.rango { background: var(--panel); border: 1px dashed var(--linea); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.ajuste { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; text-align: left; width: 100%; }
.ajuste small { display: block; color: var(--tenue); font-size: 13px; }
.interruptor { width: 44px; height: 26px; border-radius: 13px; background: var(--linea); position: relative; flex: none; }
.interruptor::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--acero); transition: left .15s; }
[aria-pressed="true"] .interruptor { background: var(--ok); }
[aria-pressed="true"] .interruptor::after { left: 21px; }

/* Eventos */
.evento { position: absolute; left: 0; right: 0; bottom: 0; padding-left: var(--lado-i); padding-right: var(--lado-d); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; pointer-events: none; }
.evento .carta { pointer-events: auto; width: 100%; max-width: 480px; background: var(--panel-solido); border: 2px solid var(--hivis); border-radius: 10px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.6); animation: entra .25s ease-out; }
.evento h3 { margin: 0; font-family: var(--f-display); font-size: 20px; line-height: 1.1; color: var(--hivis); }
.evento p { margin: 0; }
.evento .opciones { display: grid; gap: 6px; }
.evento .opciones .btn { text-align: left; text-transform: none; font-family: var(--f-cuerpo); font-weight: 600; font-size: 15px; letter-spacing: 0; touch-action: none; }
.evento .opciones .btn small { display: block; font-weight: 400; font-size: 13px; opacity: .8; }
.cuenta-atras { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
.cuenta-atras div { height: 100%; background: var(--mal); }
.blanco { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: #c9c9c9; border: 4px dashed #6f6f6f; display: grid; place-items: center; font-family: var(--f-cond); font-weight: 700; color: #222; font-size: 15px; text-transform: uppercase; animation: late .6s ease-in-out infinite alternate; }
@keyframes late { to { transform: scale(1.08); } }
.cargando { min-height: 100%; display: grid; place-items: center; text-align: center; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) { document.getElementById('pantalla').innerHTML = '<div class="cargando"><p>No se pudo cargar el motor 3D. Revisa la conexión y recarga la página.</p></div>'; return; }
const T = THREE;
const KEY = 'hood-cleaners-v2';
const TURNO_S = 240;      // segundos reales de 22:00 a 06:00
const LIMITE = 150;       // micras que deja pasar el inspector por zona
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const dinero = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('es-MX');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const uno = arr => arr[Math.floor(Math.random() * arr.length)];
const azar = p => Math.random() < p;

// ------------------------------------------------------------------ datos

const RANGOS = [
  { n: 'El Nuevo', parte: .15, txt: 'Don Rigo elige el trabajo y el compañero.' },
  { n: 'Ayudante', parte: .25, req: s => s.aprobados >= 3, falta: s => `${Math.max(0, 3 - s.aprobados)} turnos aprobados más`, txt: 'Eliges entre dos trabajos. Te prestan la hidrolavadora.' },
  { n: 'Jefe de cuadrilla', parte: .35, req: s => s.rep >= 40, falta: s => `reputación 40 (tienes ${s.rep})`, txt: 'Eliges trabajo y compañero. Llegan los hoteles.' },
  { n: 'Socio', parte: .6, compra: 3000, req: s => s.rep >= 60, falta: s => `reputación 60 (tienes ${s.rep}) y ${dinero(3000)} para comprar la mitad`, txt: 'Compras la mitad de Grasa Brava. Cobras el 60 %.' },

];

const COCINAS = {
  cafe: { n: 'Cafetería', frec: 'anual', micras: [900, 1300], pago: [380, 480], filtros: [2, 3], rango: 0, linea: 'cafe',

  asador: { n: 'Asador al carbón', frec: 'mensual', micras: [2600, 3400], pago: [760, 1050], filtros: [3, 5], rango: 1, linea: 'carbon',

  mapache: 'Local viejo. Dicen que el ducto «hace ruidos».',
  alarma: 'Detectores de humo muy sensibles. Ojo con el vapor.',
};

const COMPANEROS = {
  beto: { n: 'Beto', apodo: 'el Primo', color: '#ffd23f', rango: 0, fuerza: 1.25, rasgo: 'Rápido. Rompe cosas con total seguridad.',
    frases: ['Tranquilo, sé lo que hago.', '¿Esto se desenchufa o se jala?', 'Yo una vez limpié un ducto con una escoba. Bueno, la mitad.', 'Esa mancha tiene forma de mi ex.', 'Si algo truena, yo no estaba.'],
    bien: 'Quedó tan limpio que me da miedo tocarlo. Y eso que yo toco todo.', mal: 'El inspector no entiende el arte moderno.', desastre: 'Esa tubería ya venía rota. Yo solo la terminé.' },
  lupe: { n: 'Lupe', apodo: 'la veterana', color: '#7fd3e6', rango: 1, fuerza: 1.0, rasgo: 'Trabajo perfecto. No confía en nadie.',
    frases: ['Diez años en esto y nunca vi una campana tan triste.', 'Te faltó una esquina. No, la otra.', 'No me mires, yo no fui. Nunca soy yo.', 'Esta grasa tiene más antigüedad que yo en la empresa.'],
    bien: 'Aceptable. No se lo digas a nadie, pero aceptable.', mal: 'Te lo dije. Bueno, no te lo dije. Pero lo pensé fuerte.', desastre: 'Voy a anotar esto en mi libreta de cosas que no fueron culpa mía.' },

const A = { ctx: null, ruido: null, chorro: null };

}

}

// Material de grasa: una textura de datos por superficie (R grasa, G espuma, B pulido) decide color, brillo y metal.
// Costra negra y brillante → película ámbar → acero que refleja la luz.
const U = { hl: { value: 0 }, tiempo: { value: 0 } };
function materialGrasa(base, dtex) {
  const m = new T.MeshStandardMaterial({ map: base, color: 0xffffff, metalness: 1, roughness: .3 });
  m.onBeforeCompile = sh => {
    sh.uniforms.mapaGrasa = { value: dtex }; sh.uniforms.uHl = U.hl; sh.uniforms.uT = U.tiempo;
    sh.fragmentShader = 'uniform sampler2D mapaGrasa;\nuniform float uHl;\nuniform float uT;\nfloat hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\n' + sh.fragmentShader
      .replace('#include <map_fragment>', `#include <map_fragment>
        vec4 dm = texture2D(mapaGrasa, vUv);
        float gr = hh(floor(vUv * 180.0));
        float dd = dm.r * 1.4 + (gr - 0.5) * 0.06;
        float tF = smoothstep(0.02, 0.22, dd);
        float tC = smoothstep(0.55, 0.95, dd + (gr - 0.5) * 0.14);
        vec3 fina = vec3(0.42, 0.24, 0.05) * (0.85 + 0.3 * gr);
        vec3 media = vec3(0.13, 0.065, 0.015) * (0.8 + 0.4 * gr);
        vec3 costra = vec3(0.022, 0.016, 0.012) * (0.7 + 0.7 * gr);
        vec3 grasa = mix(mix(fina, media, smoothstep(0.12, 0.4, dd)), costra, tC);
        diffuseColor.rgb = mix(diffuseColor.rgb, grasa, tF);
        vec2 celda = fract(vUv * 90.0) - 0.5; float rb = hh(floor(vUv * 90.0));
        float burb = smoothstep(0.22 + 0.2 * rb, 0.16 + 0.2 * rb, length(celda));
        float fo = dm.g * (0.6 + 0.4 * burb);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.92, 0.97, 1.0), fo * 0.9);
        float hlv = uHl * tF * (0.55 + 0.45 * sin(uT * 6.0));`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(mix(0.24, 0.05, dm.b), mix(0.42, 0.3, tC), tF);
        roughnessFactor = mix(roughnessFactor, 0.7, fo);`)
      .replace('#include <metalnessmap_fragment>', `#include <metalnessmap_fragment>
        metalnessFactor = 1.0 - max(tF, fo);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += vec3(1.0, 0.42, 0.05) * hlv * 0.45;`);
  };
  return m;
}

// Una superficie limpiable: malla + rejilla de grasa (celdas de unos 3 cm).
function superficie(w, h, base, micrasRel, celda = .03) {
  const nx = Math.max(8, Math.round(w / celda)), ny = Math.max(8, Math.round(h / celda));
  const n = nx * ny;
  const d = new Float32Array(n), soak = new Float32Array(n).fill(-1), pol = new Float32Array(n);
  const data = new Uint8Array(n * 4);
  const tex = new T.DataTexture(data, nx, ny, T.RGBAFormat);
  tex.magFilter = T.LinearFilter; tex.minFilter = T.LinearFilter; tex.generateMipmaps = false;
  // Grasa en manchas: ondas superpuestas, más gruesa en los bordes y las esquinas.
  const sem = Array.from({ length: 6 }, () => [Math.random() * 10, Math.random() * 10, rnd(2, 6)]);
  for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
    const u = x / nx, v = y / ny;
    let s = 0; for (const [a, b, f] of sem) s += Math.sin(u * f * 3 + a) * Math.cos(v * f * 2.4 + b);
    const borde = Math.min(u, 1 - u, v, 1 - v) < .1 ? .25 : 0;
    d[y * nx + x] = clamp(micrasRel * (.72 + s * .12 + borde + rnd(-.08, .08)), .08, 1.3);
  }
  const mesh = new T.Mesh(new T.PlaneGeometry(w, h), materialGrasa(base, tex));
  const sf = { mesh, nx, ny, d, soak, pol, data, tex, w, h, celda: w / nx, inicial: d.reduce((a, b) => a + b, 0), sucio: true };
  mesh.userData.sf = sf;
  pintarSf(sf);
  return sf;
}
function pintarSf(sf) {
  const { d, soak, pol, data } = sf;
  for (let i = 0; i < d.length; i++) {
    data[i * 4] = Math.min(255, d[i] / 1.4 * 255);
    const a = soak[i];
    data[i * 4 + 1] = a < 0 ? 0 : Math.max(0, 255 * (1 - a / 30)) * Math.min(1, d[i] * 3 + .25);
    data[i * 4 + 2] = Math.min(255, pol[i] * 255);
    data[i * 4 + 3] = 255;
  }
  sf.tex.needsUpdate = true; sf.sucio = false;
}

const NP = 400;

for (let i = 0; i < NP; i++) pPos[i * 3 + 1] = -99;
const COL = { grasa: [.25, .14, .03], agua: [.65, .85, 1], espuma: [.95, .98, 1], humo: [.5, .5, .52], chispa: [1, .8, .3] };

const ray = new T.Raycaster(), ndc = new T.Vector2();
function apuntar(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, cam);
  const hit = ray.intersectObjects(zonaAct().meshes, false)[0];
  if (!hit || !hit.uv) return null;
  const sf = hit.object.userData.sf;
  let gx = hit.uv.x * sf.nx, gy = hit.uv.y * sf.ny;
  // Asistencia de apuntado: sobre metal limpio, la pasada se va hacia la mancha más cercana.
  if (S.aj.asist && M.herr !== 'pulidor') {
    const i0 = clamp(Math.floor(gy), 0, sf.ny - 1) * sf.nx + clamp(Math.floor(gx), 0, sf.nx - 1);
    if (sf.d[i0] < .05) {
      let mejor = null, md = 1e9; const R0 = 5;
      for (let y = Math.max(0, Math.floor(gy) - R0); y <= Math.min(sf.ny - 1, Math.floor(gy) + R0); y++)

    }

function tickTurno(dt) {

      emitir(a.punto, 3, 'agua', a.normal, 1.2); chorro(true);

      if (a.sf.d[i] > .6 && multEspuma(a.sf.soak[i]) === 1 && azar(dt * 1.5)) { emitir(a.punto, 12, 'grasa', a.normal, 2); ayuda('¡Salpica! Echa espuma antes en la costra.'); }

    } else if (!M.presionado) chorro(false);
    // Espuma: el tiempo corre para la grasa empapada.

      if (M.orden.comp === 'chuy' && !M.dormido && (M.dormirT -= dt) <= 0) { M.dormido = true; M.ronqT = 0; }
      if (M.dormido && (M.ronqT -= dt) <= 0) {
        M.ronqT = 7.5;
        decir(M.comp, uno(['Cinco minutitos… zzz', 'zzz… mmm… grasa… zzz', '(ronquido industrial)']), [{ t: '¡Chuy!', f: () => { if (!M) return; M.dormido = false; M.dormirT = rnd(35, 55); decir(M.comp, 'No estaba dormido, estaba escuchando el ducto.'); } }]);
      }
      if (!M.dormido && (M.compT -= dt) <= 0) {

        if (mejor >= 0) raspar(s, mejor % s.nx + .5, Math.floor(mejor / s.nx) + .5, 2.6, .3 * M.comp.fuerza, 'rasqueta');
      }
      if ((M.charlaT -= dt) <= 0) { M.charlaT = rnd(16, 26); if (!M.dormido) decir(M.comp, uno(M.comp.frases)); }
      if (piezas.gerente.visible && (M.gerenteT -= dt) <= 0) {
        M.gerenteT = rnd(24, 34);
        let resp = false;
        const b = decir('gerente', uno(GERENTE), [
          { t: 'Ya casi, jefe', f: () => { resp = true; } },

        ]);

      }
    }

    if (M.ev && M.ev.limite) {
      M.ev.t += dt; const c = $('#cuenta'); if (c) c.style.width = `${Math.max(0, 1 - M.ev.t / M.ev.limite) * 100}%`;

  if (M.humo > 0) { M.humo -= dt; emitir(new T.Vector3(rnd(-.8, .4), 1.05, -.3), 3, 'humo', null, .3); }

  const vRapido = (M.ventiladorRapido || 0) > 0; if (vRapido) M.ventiladorRapido -= dt;

  piezas.comp.rotation.z = M.dormido ? .35 : 0;

  for (const s of z.sfs) if (s.sucio) pintarSf(s);

}

  Z.forEach((z, i) => {
    const b = $('#zonas').children[i], m = micras(z), ok = m <= LIMITE;
    b.setAttribute('aria-pressed', i === M.zona); b.classList.toggle('listo', ok);
    b.lastChild.textContent = `${m.toLocaleString('es-MX')} µm${ok ? ' ✓' : ''}`;
    if (ok && !M.listoAvisado.has(i)) {
      M.listoAvisado.add(i); sDing();
      if (i === M.zona) { ayuda(`${z.n} pasa la inspección. Pulir hasta espejo suma propina.`); decir(M.comp, uno(['Mírate, te ves en el acero.', 'Eso brilla más que mi futuro.', 'Ni el día que la instalaron estaba así.'])); }
    }
  });
  $('#botella').textContent = `Espuma ${Math.round(M.botella * 100)} %`;
  $('#siguiente').textContent = M.zona < 2 ? `Ir a ${Z[M.zona + 1].n.toLowerCase()}` : 'Terminar turno';
}
$('#zonas').addEventListener('click', e => { const b = e.target.closest('[data-z]'); if (b && M && M.fase === 'turno' && !M.ev) irZona(+b.dataset.z); });
$('#siguiente').addEventListener('click', () => { if (!M || M.fase !== 'turno' || M.ev) return; if (M.zona < 2) irZona(M.zona + 1); else confirmarFin(); });
function irZona(i) {
  if (i === M.zona) return;
  M.zona = i; M.enZona = 0; M.combo = 0; M.trazo = null; irVista(Z[i]); pintarHud(false);
  piezas.comp.visible = i !== 2;
  if (i === 1) piezas.comp.position.set(-1.45, 0, .5);
  if (i === 0) piezas.comp.position.set(-1.6, 0, .9);
  if (i === 2 && !M.eventos.some(e => e.tipo === 'techo')) decir(M.comp, 'Yo subo al techo. Tú métete en el ducto. Si ves luz al final, no vayas hacia ella.');
}
function confirmarFin() {
  const faltan = Z.filter(z => micras(z) > LIMITE).length;
  if (!faltan) return terminarTurno();
  M.pausa = true;
  carta('¿Terminar ya?', `${faltan === 1 ? 'Queda una zona' : 'Quedan ' + faltan + ' zonas'} sin pasar la inspección. Son las ${$('#reloj').textContent}.`, [
    { t: 'Seguir limpiando', prim: true, f: () => { M.pausa = false; cerrarCarta(); } },
    { t: 'Llamar al inspector', f: () => { cerrarCarta(); terminarTurno(); } },
  ], { bloquea: true });
}
$('#pausa').addEventListener('click', () => { if (M && M.fase === 'turno') { M.pausa = true; pantallaAjustes(true); } });

function terminarTurno() {
  M.fase = 'parte'; M.pausa = false; chorro(false); cerrarCarta(); cerrarRueda();
  $('#hud').hidden = true; chat.innerHTML = '';
  irVista(Z[1]);
  setTimeout(pantallaParte, 500);
}

// ------------------------------------------------------------------ pantallas

const P = $('#pantalla');
function pantalla(html) { P.innerHTML = `<div class="hoja">${html}</div>`; P.hidden = false; P.scrollTop = 0; }
const cara = (col, letra) => `<div class="cara" style="background:${col}">${letra}</div>`;

function generarOrdenes() {
  const permitidas = Object.keys(COCINAS).filter(k => COCINAS[k].rango <= S.rango);
  const n = S.rango === 0 ? 1 : S.rango === 1 ? 2 : 3;
  const out = [];
  let intentos = 0;
  while (out.length < n && intentos++ < 50) {
    const k = uno(permitidas), C = COCINAS[k];
    if (out.some(o => o.cocina === k)) continue;
    const eventos = C.eventos.filter(() => azar(.5));
    if (k === 'hotel' && !eventos.includes('alarma')) eventos.push('alarma');
    out.push({ cocina: k, nombre: uno(C.nombres), filtros: Math.round(rnd(C.filtros[0], C.filtros[1])), micras: Math.round(rnd(C.micras[0], C.micras[1]) / 50) * 50, pago: Math.round(rnd(C.pago[0], C.pago[1]) / 10) * 10, eventos });
  }
  return out;
}

let V = null; // la camioneta: órdenes de esta noche y elección
function pantallaCamioneta() {
  M = null;
  if (!V || V.noche !== S.noche) {
    V = { noche: S.noche, ordenes: generarOrdenes(), sel: 0, comp: S.rango === 1 ? uno(['beto', 'lupe']) : S.rango >= 2 ? 'lupe' : 'beto',

  }
  irVista(VISTA_GENERAL);
  $('#hud').hidden = true;
  const rg = RANGOS[S.rango], sig = RANGOS[S.rango + 1], eligeComp = S.rango >= 2;
  pantalla(`
    <div class="rotulo">Hood Cleaners<span>The Night Shift</span></div>
    <div class="datos">
      <div class="dato"><i>Noche</i><b>${S.noche}</b></div>
      <div class="dato"><i>Tu dinero</i><b>${dinero(S.dinero)}</b></div>
      <div class="dato"><i>Reputación</i><b>${S.rep}</b></div>
      <div class="dato"><i>Rango</i><b>${rg.n}</b></div>
    </div>
    <div class="jefe">${cara('#b9a27a', 'R')}<div><b>Don Rigo, por la radio</b>${esc(V.frase)}</div></div>
    ${sig ? `<div class="rango"><div class="fila"><b>Siguiente rango: ${sig.n}</b><span class="nota">Falta: ${esc(sig.falta(S))}</span></div>
      <span class="nota">${esc(sig.txt)}</span>
      ${sig.compra && sig.req(S) ? `<button class="btn prim" id="comprar" ${S.dinero < sig.compra ? 'disabled' : ''}>Comprar la mitad de la empresa · ${dinero(sig.compra)}</button>` : ''}</div>`
      : '<div class="rango"><b>Eres el dueño.</b><span class="nota">La camioneta, la cuadrilla y las deudas son tuyas.</span></div>'}
    <h2 class="sec">${S.rango === 0 ? 'Don Rigo te manda a' : 'Elige el trabajo de esta noche'}</h2>
    ${V.ordenes.map((o, i) => { const C = COCINAS[o.cocina]; return `<button class="orden" data-o="${i}" aria-pressed="${i === V.sel}">
      <div class="fila"><span class="chip">${C.n}</span><span class="chip">NFPA 96: ${C.frec}</span></div>
      <h3>${esc(o.nombre)}</h3>
      <div class="fila"><span class="nota">${o.filtros} filtros · ${o.micras.toLocaleString('es-MX')} µm de grasa</span><span class="pago">${dinero(o.pago)}</span></div>
      ${o.eventos.length ? o.eventos.map(e => `<span class="pista">${esc(PISTAS[e])}</span>`).join('') : '<span class="pista">Todo tranquilo. Sospechoso.</span>'}
    </button>`; }).join('')}
    <h2 class="sec">${eligeComp ? 'Elige compañero' : 'Tu compañero esta noche'}</h2>
    <div class="companeros">${Object.entries(COMPANEROS).map(([id, c]) => `<button class="comp" data-c="${id}" aria-pressed="${V.comp === id}" ${S.rango < c.rango || (!eligeComp && id !== V.comp) ? 'disabled' : ''}>${cara(c.color, c.n[0])}<div><b>${c.n}</b><span>${S.rango < c.rango ? 'Llega con el rango ' + RANGOS[c.rango].n : esc(c.rasgo)}</span></div></button>`).join('')}</div>
    <div class="acciones"><button class="btn prim" id="salir">Salir a trabajar</button><button class="btn" id="taller">Taller</button><button class="btn" id="ajustes">Ajustes</button></div>
    <p class="nota">Cobras el ${Math.round(rg.parte * 100)} % del trabajo más toda la propina.${S.mejor ? ` Mejor noche: ${dinero(S.mejor)}.` : ''}${S.album.length ? ` Álbum: ${esc(S.album.join(', '))}.` : ''}</p>`);
  P.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { V.sel = +b.dataset.o; pantallaCamioneta(); });
  P.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { V.comp = b.dataset.c; pantallaCamioneta(); });
  $('#salir').onclick = () => { audio(); empezarTurno({ ...V.ordenes[V.sel], comp: V.comp }); };
  $('#taller').onclick = pantallaTaller;
  $('#ajustes').onclick = () => pantallaAjustes(false);
  const cb = $('#comprar'); if (cb) cb.onclick = () => { S.dinero -= sig.compra; S.rango++; guardar(); subirRango(); };
}

function pantallaTaller() {
  const items = TIENDA.filter(t => t.ok(S));
  pantalla(`<div class="rotulo">Taller</div>
    <p class="nota">Las herramientas se pagan con tu dinero. Tienes ${dinero(S.dinero)}.</p>
    ${items.map(t => `<div class="orden"><h3>${esc(t.n)}</h3><span class="nota">${esc(t.d)}</span><div class="fila"><span class="pago">${dinero(t.p)}</span><button class="btn prim" data-t="${t.id}" ${S.dinero < t.p ? 'disabled' : ''}>Comprar</button></div></div>`).join('') || '<p class="nota">Ya tienes todo. Don Rigo está orgulloso, aunque no lo diga.</p>'}
    <div class="acciones"><button class="btn" id="volver">Volver a la camioneta</button></div>`);
  P.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = TIENDA.find(x => x.id === b.dataset.t); S.dinero -= t.p; t.f(S); guardar(); tono(880, .1, .08); pantallaTaller(); });
  $('#volver').onclick = pantallaCamioneta;
}

function pantallaAjustes(enTurno) {
  const op = [
    ['asist', 'Asistencia de apuntado', 'La pasada se acerca sola a la mancha más cercana.'],
    ['resaltar', 'Resaltar suciedad', 'Lo que falta parpadea en naranja.'],
    ['comodo', 'Modo cómodo', 'El reloj corre a la mitad de velocidad.'],
    ['sonido', 'Sonido', 'Raspados, chorros y alarmas.'],
  ];
  pantalla(`<div class="rotulo">${enTurno ? 'Pausa' : 'Ajustes'}</div>
    ${op.map(([k, n, d]) => `<button class="ajuste" data-k="${k}" aria-pressed="${!!S.aj[k]}"><span><b>${n}</b><small>${d}</small></span><span class="interruptor"></span></button>`).join('')}
    <div class="cita"><b>Cómo se juega</b>Pasadas cortas con la rasqueta: tocar, arrastrar y soltar. Varias seguidas en la misma dirección hacen combo. La espuma ablanda la costra si esperas un par de segundos. Mantén el botón redondo para abrir la rueda de herramientas; un toque vuelve a la anterior. En ordenador, teclas 1 a 4.</div>
    <div class="acciones">${enTurno ? '<button class="btn prim" id="volver">Seguir el turno</button><button class="btn" id="abandonar">Llamar al inspector ya</button>' : '<button class="btn prim" id="volver">Volver</button><button class="btn" id="borrar">Empezar de cero</button>'}</div>`);
  P.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { S.aj[b.dataset.k] = !S.aj[b.dataset.k]; b.setAttribute('aria-pressed', S.aj[b.dataset.k]); U.hl.value = S.aj.resaltar ? 1 : 0; guardar(); });
  $('#volver').onclick = () => { if (enTurno) { P.hidden = true; M.pausa = false; } else pantallaCamioneta(); };
  const ab = $('#abandonar'); if (ab) ab.onclick = () => { P.hidden = true; terminarTurno(); };
  const br = $('#borrar'); if (br) br.onclick = () => {
    pantalla(`<div class="rotulo">¿Empezar de cero?</div><p>Se borran tu dinero, tu rango y tus herramientas. Don Rigo no se acordará de ti. Bueno, nunca se acordó.</p>
      <div class="acciones"><button class="btn" id="no">Cancelar</button><button class="btn prim" id="si">Empezar de cero</button></div>`);
    $('#no').onclick = () => pantallaAjustes(false);
    $('#si').onclick = () => { nueva(); V = null; guardar(); pantallaCamioneta(); };
  };
}

function pantallaPrep() {
  const pintar = () => {
    const faltan = PREP.filter(p => !M.prep[p.id]).length;
    pantalla(`<div class="rotulo">Preparación<span>${esc(M.orden.nombre)}</span></div>
      <p class="nota">Lo que te saltes ahorra tiempo… y abre la puerta al desastre. Toca cada paso al hacerlo.</p>
      <div class="check">${PREP.map(p => `<button data-p="${p.id}" aria-pressed="${!!M.prep[p.id]}"><span class="box">✓</span><span>${p.n}<small>${p.d}</small></span></button>`).join('')}</div>
      <div class="acciones"><button class="btn prim" id="empezar">${faltan ? `Empezar igual (faltan ${faltan})` : 'Empezar a limpiar'}</button></div>`);
    P.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      const k = b.dataset.p; M.prep[k] = !M.prep[k];
      piezas.plastico.visible = !!M.prep.plastico; piezas.bolsa.visible = !!M.prep.bolsa;
      piezas.pilotos.forEach(f => { f.visible = !M.prep.gas; });
      tono(M.prep[k] ? 760 : 380, .07, .06, 'triangle'); pintar();
    });
    $('#empezar').onclick = arrancarTurno;
  };
  pintar();
}

function pantallaParte() {
  const o = M.orden, rg = RANGOS[S.rango];
  const zonas = Z.map(z => ({ n: z.n, m: micras(z), pct: pctZona(z) }));
  const aprobado = zonas.every(z => z.m <= LIMITE), espejo = zonas.every(z => z.m <= 50);
  let celdas = 0, pulidas = 0;
  for (const z of Z) for (const s of z.sfs) for (let i = 0; i < s.pol.length; i++) { celdas++; if (s.pol[i] > .6) pulidas++; }
  const pulido = pulidas / celdas;
  if (!M.prep.plastico && azar(.7)) dano('El chef encontró espuma en su plancha sagrada', 0, 4);
  if (!M.prep.bolsa) dano('Agua con grasa en el suelo del comedor', 80, 2);
  const limpio = zonas.reduce((a, z) => a + z.pct, 0) / 3;
  const cobro = aprobado ? o.pago : Math.round(o.pago * .5 * limpio / 10) * 10;
  const propina = Math.max(0, Math.round(cobro * clamp(pulido * .25 + (espejo ? .05 : 0) + M.propinaMod, 0, .25) / 5) * 5);
  const tuParte = Math.round(cobro * rg.parte);
  const cuota = S.rango >= 3 ? 1 : .5;   // de empleado, Don Rigo te descuenta la mitad de los daños
  const gastos = S.rango >= 3 ? Math.round(155 * rg.parte) : 0;
  const neto = tuParte + propina - Math.round(M.danos.reduce((a, d) => a + d.dinero, 0) * cuota) - gastos;
  const rep = (aprobado ? (espejo ? 6 : 4) : -6) + M.repExtra;
  S.dinero += neto; S.rep = clamp(S.rep + rep, 0, 100); if (aprobado) S.aprobados++;
  S.mejor = Math.max(S.mejor, neto); S.noche++;
  for (const a of M.album) if (!S.album.includes(a)) S.album.push(a);
  const sig = RANGOS[S.rango + 1], nuevoRango = !!(sig && !sig.compra && sig.req(S));
  if (nuevoRango) S.rango++;
  guardar();
  const desastre = M.danos.some(d => d.dinero >= 60);
  pantalla(`<div class="rotulo">${aprobado ? (espejo ? 'Metal desnudo' : 'Aprobado') : 'No pasa'}<span>Parte de ${esc(o.nombre)}</span></div>
    <div class="zonas-parte">${zonas.map(z => `<div class="fila"><span>${z.n} <span class="nota">· ${Math.round(z.pct * 100)} % limpio</span></span><span class="chip num ${z.m <= LIMITE ? 'ok' : 'mal'}">${z.m.toLocaleString('es-MX')} µm</span></div>`).join('')}
      <span class="nota">El inspector mide con el peine de grasa: aprueba con ${LIMITE} µm o menos en cada zona. Pulido espejo: ${Math.round(pulido * 100)} %.</span></div>
    <div class="cita"><b>El cliente</b>${esc(uno(aprobado ? CLIENTE_BIEN : CLIENTE_MAL))}</div>
    <div class="cita"><b>${esc(M.comp.n)}</b>${esc(desastre ? M.comp.desastre : aprobado ? M.comp.bien : M.comp.mal)}</div>
    <div class="cuentas">
      <span>${aprobado ? 'Pago del trabajo' : 'Pago parcial'} (${dinero(cobro)}), tu ${Math.round(rg.parte * 100)} %</span><span>${dinero(tuParte)}</span>
      <span>Propina</span><span>${dinero(propina)}</span>
      ${M.danos.map(d => `<span>${esc(d.t)}</span><span>${d.dinero ? dinero(-Math.round(d.dinero * cuota)) : '—'}</span>`).join('')}
      ${gastos ? `<span>Gasolina y sueldo del compañero (tu parte)</span><span>${dinero(-gastos)}</span>` : ''}
      <span class="total">Te llevas</span><span class="total">${dinero(neto)}</span>
      <span>Reputación</span><span>${rep >= 0 ? '+' : ''}${rep}</span>
    </div>
    ${cuota < 1 && M.danos.some(d => d.dinero) ? '<p class="nota">Don Rigo te descuenta la mitad de los daños del sueldo. «Es pedagógico», dice.</p>' : ''}
    ${M.album.length ? `<p class="nota">Nueva foto en el álbum: ${esc(M.album.join(', '))}.</p>` : ''}
    <div class="acciones"><button class="btn prim" id="seguir">Volver a la camioneta</button></div>`);
  $('#seguir').onclick = () => { if (nuevoRango) subirRango(); else pantallaCamioneta(); };
  tono(aprobado ? 660 : 300, .3, .1, 'triangle', aprobado ? 990 : 200);
}

function subirRango() {
  const r = RANGOS[S.rango];
  const frases = ['', 'Tres turnos y no has roto nada. Bueno, nada caro. Ya eres ayudante.', 'La gente pregunta por ti. Me molesta, pero te subo a jefe de cuadrilla.', 'Firmaste. Ahora la mitad de las deudas también son tuyas. Bienvenido, socio.', 'Me voy a pescar. La camioneta es tuya. El ruido también.'];
  pantalla(`<div class="rotulo">Nuevo rango<span>${esc(r.n)}</span></div>
    <div class="jefe">${cara('#b9a27a', 'R')}<div><b>Don Rigo</b>${esc(frases[S.rango])}</div></div>
    <p>${esc(r.txt)} Ahora cobras el ${Math.round(r.parte * 100)} % de cada trabajo.</p>
    <div class="acciones"><button class="btn prim" id="ok">A la camioneta</button></div>`);
  sDing(); tono(1760, .5, .08, 'sine', null, .3);
  $('#ok').onclick = pantallaCamioneta;
}

// ------------------------------------------------------------------ bucle principal

function redimensionar() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', redimensionar);
let ult = performance.now();
function bucle(ahora) {
  const dt = Math.min(.05, (ahora - ult) / 1000); ult = ahora;
  U.tiempo.value = ahora / 1000;
  if (M && M.fase === 'turno') tickTurno(dt);
  else if (!M) { const a = ahora / 9000; VISTA_GENERAL.pos.set(Math.sin(a) * 2.6 + .4, 1.9, 3.2 + Math.cos(a) * .3); }
  moverCamara(dt);
  moverParticulas(dt);
  R.render(escena, cam);
  requestAnimationFrame(bucle);
}

function arrancar(datos) {
  if (datos && datos.S && datos.S.v === 2) S = datos.S; else if (!cargar()) nueva();
  U.hl.value = S.aj.resaltar ? 1 : 0;
  redimensionar();
  pantallaCamioneta();
  requestAnimationFrame(bucle);
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(arrancar) : arrancar(window.claude?.hot?.data ?? {});
})();
</script>
