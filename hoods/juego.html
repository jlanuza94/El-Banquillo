<style>
/* Turno de noche: pantalla a sangre con la cocina en 3D; paneles de acero oscuro, grasa ámbar y naranja de seguridad para lo que se toca. */
:root {

}

/* HUD del turno */
.hud-arriba { position: absolute; left: 0; right: 0; top: 0; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); padding-bottom: 18px; display: grid; gap: 6px; pointer-events: none; background: linear-gradient(rgba(10,16,22,.75), rgba(10,16,22,0)); }
.hud-fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.hud-abajo { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); padding-top: 24px; display: grid; gap: 8px; pointer-events: none; background: linear-gradient(rgba(10,16,22,0), rgba(10,16,22,.8)); }

.marca.hecha { background: var(--ok); animation: none; }
@keyframes marca { to { transform: translate(-50%, -50%) scale(1.1); } }

/* Pantallas (camioneta, taller, parte…) */
.pantalla { position: absolute; inset: 0; overflow-y: auto; background: linear-gradient(rgba(13,20,27,.5), rgba(13,20,27,.93) 38%); padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); }

.companeros { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

.btn { border: 1px solid var(--linea); background: var(--panel-2); border-radius: 6px; padding: 11px 16px; font-family: var(--f-cond); font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; }
.btn.prim { background: var(--hivis); border-color: var(--hivis); color: var(--hivis-tinta); }

.barra { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }

<script>
(() => {
'use strict';
if (!window.THREE) { document.getElementById('pantalla').innerHTML = '<div class="cargando"><p>No se pudo cargar el motor 3D. Revisa la conexión y recarga la página.</p></div>'; return; }
const T = THREE;
const KEY = 'hood-cleaners-v2';
const TURNO_S = 240;      // segundos reales de 22:00 a 06:00
const LIMITE = 150;       // micras que deja pasar el inspector por zona
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const dinero = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('es-MX');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const uno = arr => arr[Math.floor(Math.random() * arr.length)];
const azar = p => Math.random() < p;
const hora = min => { const m = 22 * 60 + Math.floor(min); return `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };

// ------------------------------------------------------------------ datos

const APRENDIZ = 4;            // noches trabajando para Don Rigo antes del despido
const SUELDO_APRENDIZ = 110;
const GASOLINA = 35;
const RIVAL = 'Limpiezas El Cuñado';

const A = { ctx: null, ruido: null, chorro: null };
function audio() {
  if (!A.ctx) {
    try {
      A.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const b = A.ctx.createBuffer(1, A.ctx.sampleRate, A.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      A.ruido = b;
    } catch (e) { A.ctx = null; }
  }
  if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
}
const suena = () => A.ctx && S.aj.sonido;
function rafaga(dur, freq, vol, tipo = 'bandpass', q = 1.2) {
  if (!suena()) return;
  const c = A.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = A.ruido; s.loop = true; f.type = tipo; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(c.currentTime, Math.random() * .5); s.stop(c.currentTime + dur + .02);
}
function tono(freq, dur, vol = .12, tipo = 'sine', fin = null, cuando = 0) {
  if (!suena()) return;
  const c = A.ctx, o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + cuando;
  o.type = tipo; o.frequency.setValueAtTime(freq, t0); if (fin) o.frequency.exponentialRampToValueAtTime(fin, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function chorro(on) {
  if (!A.ctx) return;
  if (on && suena() && !A.chorro) {
    const c = A.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = A.ruido; s.loop = true; f.type = 'highpass'; f.frequency.value = 2400; g.gain.value = .07;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(); A.chorro = { s };
  } else if (!on && A.chorro) { A.chorro.s.stop(); A.chorro = null; }
}

(function entorno() {
  const env = new T.Scene();
  env.add(new T.Mesh(new T.BoxGeometry(10, 5, 10), new T.MeshBasicMaterial({ color: 0x4a5560, side: T.BackSide })));
  const tubo = new T.MeshBasicMaterial({ color: 0xffffff });

  const suelo = new T.Mesh(new T.PlaneGeometry(10, 10), new T.MeshBasicMaterial({ color: 0x1f262c })); suelo.rotation.x = -Math.PI / 2; suelo.position.y = -2.4; env.add(suelo);

  escena.environment = new T.PMREMGenerator(R).fromScene(env, .02).texture;

// Material de grasa: una textura de datos por superficie (R grasa, G espuma, B pulido) decide color, brillo y metal.
// Costra negra y brillante → película ámbar → acero que refleja la luz.
const U = { hl: { value: 0 }, tiempo: { value: 0 } };
function materialGrasa(base, dtex, lado) {
  const m = new T.MeshStandardMaterial({ map: base, color: 0xffffff, metalness: 1, roughness: .3, side: lado || T.FrontSide });
  m.onBeforeCompile = sh => {
    sh.uniforms.mapaGrasa = { value: dtex }; sh.uniforms.uHl = U.hl; sh.uniforms.uT = U.tiempo;
    sh.fragmentShader = 'uniform sampler2D mapaGrasa;\nuniform float uHl;\nuniform float uT;\nfloat hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\n' + sh.fragmentShader
      .replace('#include <map_fragment>', `#include <map_fragment>
        vec4 dm = texture2D(mapaGrasa, vUv);
        float gr = hh(floor(vUv * 180.0));
        float dd = dm.r * 1.4 + (gr - 0.5) * 0.06;
        float tF = smoothstep(0.02, 0.22, dd);
        float tC = smoothstep(0.55, 0.95, dd + (gr - 0.5) * 0.14);
        vec3 fina = vec3(0.42, 0.24, 0.05) * (0.85 + 0.3 * gr);
        vec3 media = vec3(0.13, 0.065, 0.015) * (0.8 + 0.4 * gr);
        vec3 costra = vec3(0.022, 0.016, 0.012) * (0.7 + 0.7 * gr);
        vec3 grasa = mix(mix(fina, media, smoothstep(0.12, 0.4, dd)), costra, tC);
        diffuseColor.rgb = mix(diffuseColor.rgb, grasa, tF);
        vec2 celda = fract(vUv * 90.0) - 0.5; float rb = hh(floor(vUv * 90.0));
        float burb = smoothstep(0.22 + 0.2 * rb, 0.16 + 0.2 * rb, length(celda));
        float fo = dm.g * (0.6 + 0.4 * burb);
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.92, 0.97, 1.0), fo * 0.6);
        float hlv = uHl * tF * (0.55 + 0.45 * sin(uT * 6.0));`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(mix(0.24, 0.05, dm.b), mix(0.42, 0.3, tC), tF);
        roughnessFactor = mix(roughnessFactor, 0.7, fo);`)
      .replace('#include <metalnessmap_fragment>', `#include <metalnessmap_fragment>
        metalnessFactor = 1.0 - max(tF, fo);`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += vec3(1.0, 0.42, 0.05) * hlv * 0.45;`);
  };
  return m;
}
const matAcero = new T.MeshStandardMaterial({ map: TX.acero, color: 0xffffff, metalness: .95, roughness: .3 });
const matPiel = new T.MeshStandardMaterial({ map: TX.acero, color: 0xffffff, metalness: .95, roughness: .25, side: T.BackSide });
const matOscuro = new T.MeshStandardMaterial({ color: 0x2b3238, metalness: .6, roughness: .5 });
const matPlastico = new T.MeshStandardMaterial({ color: 0xdfefff, transparent: true, opacity: .28, roughness: .1, side: T.DoubleSide, depthWrite: false });
const matCubierta = new T.MeshStandardMaterial({ color: 0xbfdcff, transparent: true, opacity: .6, roughness: .15, depthWrite: false });

// Una superficie limpiable: malla + rejilla de grasa (celdas de unos 3 cm). geo opcional (ducto redondo).
function superficie(w, h, base, micrasRel, celda = .03, geo, lado) {
  const nx = Math.max(8, Math.round(w / celda)), ny = Math.max(8, Math.round(h / celda));
  const n = nx * ny;
  const d = new Float32Array(n), soak = new Float32Array(n).fill(-1), pol = new Float32Array(n);
  const data = new Uint8Array(n * 4);
  const tex = new T.DataTexture(data, nx, ny, T.RGBAFormat);
  tex.magFilter = T.LinearFilter; tex.minFilter = T.LinearFilter; tex.generateMipmaps = false;
  // Grasa en manchas: ondas superpuestas, más gruesa en los bordes y las esquinas.
  const sem = Array.from({ length: 6 }, () => [Math.random() * 10, Math.random() * 10, rnd(2, 6)]);
  for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
    const u = x / nx, v = y / ny;
    let s = 0; for (const [a, b, f] of sem) s += Math.sin(u * f * 3 + a) * Math.cos(v * f * 2.4 + b);
    const borde = !geo && Math.min(u, 1 - u, v, 1 - v) < .1 ? .25 : 0;
    d[y * nx + x] = clamp(micrasRel * (.72 + s * .12 + borde + rnd(-.08, .08)), .08, 1.3);
  }
  const mesh = new T.Mesh(geo || new T.PlaneGeometry(w, h), materialGrasa(base, tex, lado));
  const sf = { mesh, nx, ny, d, soak, pol, data, tex, w, h, celda: w / nx, inicial: d.reduce((a, b) => a + b, 0), sucio: true, interior: lado === T.BackSide };
  mesh.userData.sf = sf;
  pintarSf(sf);
  return sf;
}
function pintarSf(sf) {
  const { d, soak, pol, data } = sf;
  for (let i = 0; i < d.length; i++) {
    data[i * 4] = Math.min(255, d[i] / 1.4 * 255);
    const a = soak[i];
    data[i * 4 + 1] = a < 0 ? 0 : Math.max(0, 255 * (1 - a / 30)) * Math.min(1, d[i] * 4);
    data[i * 4 + 2] = Math.min(255, pol[i] * 255);
    data[i * 4 + 3] = 255;
  }
  sf.tex.needsUpdate = true; sf.sucio = false;
}
// Coloca una superficie plana mirando en la dirección de su normal.
function colocar(sf, pos, normal) {
  const m = sf.mesh; m.position.copy(pos);
  if (Math.abs(normal.y) > .99) m.rotation.set(normal.y > 0 ? -Math.PI / 2 : Math.PI / 2, 0, 0);
  else m.lookAt(pos.clone().add(normal));
  sf.normal = normal.clone();
}

// Un aparato de la línea de cocina, con su cubierta de plástico (oculta) y, si es de gas, su piloto.
function aparato(tipo, x, ancho) {
  const g = new T.Group(); g.position.set(x, .9, -.55); mundo.add(g);
  const add = (geo, mat, px, py, pz) => { const m = new T.Mesh(geo, mat); m.position.set(px, py, pz); g.add(m); return m; };
  let alto = .1, gas = null;
  if (tipo === 'plancha') { add(new T.BoxGeometry(ancho, .06, .6), new T.MeshStandardMaterial({ color: 0x1c1c1c, metalness: .5, roughness: .4 }), 0, .03, 0); gas = 'Cerrar el piloto'; }
  if (tipo === 'freidora') { add(new T.BoxGeometry(ancho, .28, .55), matOscuro, 0, .14, 0); add(new T.BoxGeometry(ancho * .8, .02, .4), new T.MeshStandardMaterial({ color: 0x8a5a14, roughness: .1, metalness: .2 }), 0, .29, 0); alto = .3; gas = 'Cerrar el piloto'; }
  if (tipo === 'wok') { const w = add(new T.SphereGeometry(.22, 16, 8, 0, 6.3, Math.PI / 2, Math.PI / 2), new T.MeshStandardMaterial({ color: 0x222222, metalness: .7, roughness: .4, side: T.DoubleSide }), 0, .22, 0); w.rotation.x = Math.PI; alto = .24; gas = 'Cerrar el piloto'; }
  if (tipo === 'horno') { add(new T.SphereGeometry(Math.min(.55, ancho / 2), 20, 10, 0, 6.3, 0, Math.PI / 2), new T.MeshStandardMaterial({ color: 0x9b4a2c, roughness: .9 }), 0, 0, 0); add(new T.PlaneGeometry(.3, .2), new T.MeshBasicMaterial({ color: 0x120804 }), 0, .12, .5); alto = .55; }
  if (tipo === 'carbon') { add(new T.BoxGeometry(ancho, .05, .6), new T.MeshStandardMaterial({ color: 0x111111, roughness: .6 }), 0, .03, 0); for (let i = 0; i < 8; i++) add(new T.SphereGeometry(.05, 6, 4), new T.MeshStandardMaterial({ color: 0x220a02, emissive: 0xff5a10, emissiveIntensity: rnd(.4, 1.2) }), rnd(-ancho / 2.4, ancho / 2.4), .07, rnd(-.22, .22)); gas = 'Apagar las brasas'; }
  if (tipo === 'cafetera') { add(new T.BoxGeometry(ancho * .8, .45, .4), new T.MeshStandardMaterial({ color: 0xa83a2a, metalness: .4, roughness: .3 }), 0, .225, -.05); alto = .46; }
  if (tipo === 'mesa') { add(new T.BoxGeometry(ancho * .7, .03, .35), new T.MeshStandardMaterial({ color: 0xe8e2d0, roughness: .7 }), 0, .015, 0); for (let i = 0; i < 3; i++) add(new T.SphereGeometry(.04, 8, 6), new T.MeshStandardMaterial({ color: [0xd9442b, 0x5a9e3a, 0xf0c419][i] }), rnd(-.15, .15), .06, rnd(-.1, .1)); alto = .1; }
  const cubierta = new T.Mesh(new T.BoxGeometry(ancho + .06, alto + .1, .7), matCubierta); cubierta.position.set(x, .9 + (alto + .1) / 2, -.55); cubierta.visible = false; mundo.add(cubierta);
  const ap = { tipo, x, alto, cubierta, cubierto: false, pos: new T.Vector3(x, .95 + alto, -.4) };
  if (gas) {
    const llama = new T.Mesh(new T.ConeGeometry(.025, .08, 8), new T.MeshBasicMaterial({ color: tipo === 'carbon' ? 0xff7a20 : 0x5aa8ff, transparent: true, opacity: .85 }));
    llama.position.set(x - ancho * .3, .99 + (tipo === 'freidora' ? .02 : 0), -.2); mundo.add(llama);
    piezas.pilotos.push({ mesh: llama, pos: llama.position.clone(), off: false, txt: gas });
  }
  return ap;
}

function construirNoche(orden) {
  if (mundo) { escena.remove(mundo); mundo.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.userData.sf) o.userData.sf.tex.dispose(); }); }
  mundo = new T.Group(); escena.add(mundo);
  const add = (geo, mat, x, y, z) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); mundo.add(m); return m; };
  const rel = orden ? orden.micras / 2400 : 1;
  const retrato = innerWidth / innerHeight < .9;
  const hood = orden ? orden.hood : { tipo: 'caja', ancho: 2, fondo: 1.15, alto: .7 };
  const nC = orden ? orden.campanas : 1;
  const hW = hood.ancho, hY0 = 1.95, hY1 = hY0 + hood.alto, hZ0 = -.95, hZ1 = hZ0 + hood.fondo, hZ = (hZ0 + hZ1) / 2;
  const sep = .5, span = nC * hW + (nC - 1) * sep, lineW = span + .2;
  const xs = Array.from({ length: nC }, (_, i) => (i - (nC - 1) / 2) * (hW + sep));
  piezas.pilotos = []; piezas.aparatos = []; piezas.cintas = []; piezas.faldas = []; piezas.bolsas = [];

  // Cuarto
  const suelo = add(new T.PlaneGeometry(9, 8), new T.MeshStandardMaterial({ map: TX.suelo, roughness: .7 }), 0, 0, 1); suelo.rotation.x = -Math.PI / 2;
  const matPared = new T.MeshStandardMaterial({ map: TX.azulejo, roughness: .5 });
  add(new T.PlaneGeometry(9, 3), matPared, 0, 1.5, -1);
  const iz = add(new T.PlaneGeometry(6, 3), matPared, -3.6, 1.5, 1.5); iz.rotation.y = Math.PI / 2;
  const de = add(new T.PlaneGeometry(6, 3), matPared, 3.6, 1.5, 1.5); de.rotation.y = -Math.PI / 2;
  const techo = add(new T.PlaneGeometry(9, 8), new T.MeshStandardMaterial({ color: 0x2c3237, roughness: .9 }), 0, 3, 1); techo.rotation.x = Math.PI / 2;
  const puerta = add(new T.PlaneGeometry(1, 2.1), new T.MeshStandardMaterial({ color: 0x3b2a20, roughness: .8 }), 3.59, 1.05, 1.4); puerta.rotation.y = -Math.PI / 2;
  for (const x of [-1.8, 1.8]) add(new T.BoxGeometry(1.2, .04, .12), new T.MeshBasicMaterial({ color: 0xf4fbff }), x, 2.98, 1.4);

  // Letrero del restaurante
  const nombre = orden ? orden.nombre : S.empresa ? S.empresa.nombre : 'Grasa Brava Servicios';
  const letrero = texCanvas(lienzo(512, 128, (g, w, h) => {
    g.fillStyle = '#1b2a33'; g.fillRect(0, 0, w, h); g.strokeStyle = '#ff8a1f'; g.lineWidth = 8; g.strokeRect(6, 6, w - 12, h - 12);
    g.fillStyle = '#ffe3b8'; g.font = '700 46px "Barlow Condensed", "Arial Narrow", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nombre.toUpperCase(), w / 2, h / 2 + 2, w - 40);
  }));
  add(new T.PlaneGeometry(1.4, .35), new T.MeshBasicMaterial({ map: letrero }), clamp(-lineW / 2 - .9, -2.8, -1.6), 2.5, -.99);

  // Línea de cocina con sus aparatos
  add(new T.BoxGeometry(lineW, .9, .8), matAcero, 0, .45, -.55);
  const lista = LINEAS[orden ? COCINAS[orden.cocina].linea : 'plancha'];
  const nSlots = Math.max(2, Math.floor(lineW / .62)), slotW = lineW / nSlots;
  for (let i = 0; i < nSlots; i++) piezas.aparatos.push(aparato(lista[i % lista.length], -lineW / 2 + slotW * (i + .5), slotW - .07));

  // Caja de la luz (cortar la corriente del extractor)
  const bx = clamp(-lineW / 2 - .45, -3.3, -1.2);
  add(new T.BoxGeometry(.32, .42, .08), new T.MeshStandardMaterial({ color: 0x8c949b, metalness: .6, roughness: .4 }), bx, 1.45, -.96);
  const palanca = add(new T.BoxGeometry(.05, .16, .05), new T.MeshStandardMaterial({ color: 0xd2382b }), bx, 1.5, -.9);
  piezas.luz = { palanca, pos: new T.Vector3(bx, 1.45, -.9), off: false };

  // Tubería del agua en la pared
  const tub = add(new T.CylinderGeometry(.04, .04, 1.4, 10), new T.MeshStandardMaterial({ color: 0xb87333, metalness: .8, roughness: .35 }), clamp(lineW / 2 + .8, 1.8, 2.9), 1.55, -.94); tub.rotation.z = Math.PI / 2;
  piezas.fuga = new T.Vector3(tub.position.x - .3, 1.55, -.9);

  // Campanas: superficies interiores sucias + piel exterior limpia + plástico y bolsa de la preparación
  const campanas = [];
  for (const cx of xs) {
    const sfs = [], piso = new T.Vector3();
    const pon = (w, h, pos, normal, f = 1) => { const s = superficie(w, h, TX.acero, rel * f); colocar(s, pos, normal); mundo.add(s.mesh); sfs.push(s);
      const p = new T.Mesh(s.mesh.geometry, matPiel); p.position.copy(s.mesh.position).addScaledVector(normal, -.012); p.quaternion.copy(s.mesh.quaternion); mundo.add(p); };
    if (hood.tipo === 'inclinada') {
      const topW = hW * .72, dx = (hW - topW) / 2, lado = Math.hypot(hood.alto, dx);
      pon(hW, hood.alto, new T.Vector3(cx, (hY0 + hY1) / 2, hZ0 + .01), new T.Vector3(0, 0, 1));
      pon(hood.fondo, lado, new T.Vector3(cx - hW / 2 + dx / 2, (hY0 + hY1) / 2, hZ), new T.Vector3(hood.alto, -dx, 0).normalize());
      pon(hood.fondo, lado, new T.Vector3(cx + hW / 2 - dx / 2, (hY0 + hY1) / 2, hZ), new T.Vector3(-hood.alto, -dx, 0).normalize());
      pon(topW, hood.fondo, new T.Vector3(cx, hY1, hZ), new T.Vector3(0, -1, 0), 1.1);
    } else {
      pon(hW, hood.alto, new T.Vector3(cx, (hY0 + hY1) / 2, hZ0 + .01), new T.Vector3(0, 0, 1));
      pon(hood.fondo, hood.alto, new T.Vector3(cx - hW / 2, (hY0 + hY1) / 2, hZ), new T.Vector3(1, 0, 0));
      pon(hood.fondo, hood.alto, new T.Vector3(cx + hW / 2, (hY0 + hY1) / 2, hZ), new T.Vector3(-1, 0, 0));
      pon(hW, hood.fondo, new T.Vector3(cx, hY1, hZ), new T.Vector3(0, -1, 0), 1.1);
    }
    add(new T.BoxGeometry(.6, 3 - hY1, .6), matAcero, cx, (hY1 + 3) / 2 + .015, hZ0 + .45);
    // Puntos de cinta para el plástico: lado izquierdo, frente y lado derecho del borde de abajo
    const borde = [new T.Vector3(cx - hW / 2, hY0, hZ0 + .2)];
    const nf = Math.max(3, Math.round(hW / .45));
    for (let k = 0; k <= nf; k++) borde.push(new T.Vector3(cx - hW / 2 + hW * k / nf, hY0, hZ1));
    borde.push(new T.Vector3(cx + hW / 2, hY0, hZ0 + .2));
    const base = piezas.cintas.length;
    borde.forEach(p => piezas.cintas.push({ pos: p, hecho: false }));
    for (let k = 0; k < borde.length - 1; k++) {
      const a = borde[k], b = borde[k + 1], l = a.distanceTo(b), mid = a.clone().add(b).multiplyScalar(.5);
      const falda = new T.Mesh(new T.PlaneGeometry(l, .34), matPlastico); falda.position.set(mid.x, hY0 - .17, mid.z);
      falda.rotation.y = Math.atan2(-(b.z - a.z), b.x - a.x); falda.visible = false; mundo.add(falda);
      piezas.faldas.push({ mesh: falda, a: base + k, b: base + k + 1 });
    }
    // La bolsa cuelga al fondo, donde el plástico hace embudo: no tapa la vista de la campana.
    const bolsa = add(new T.ConeGeometry(.17, .32, 14, 1, true), new T.MeshStandardMaterial({ color: 0xe0e0e0, transparent: true, opacity: .8, side: T.DoubleSide }), cx + hW / 2 - .22, hY0 - .3, hZ0 + .22);
    bolsa.rotation.x = Math.PI; bolsa.visible = false;
    piezas.bolsas.push({ mesh: bolsa, pos: new T.Vector3(cx + hW / 2 - .22, hY0 - .25, hZ0 + .25), hecho: false });
    campanas.push({ cx, sfs });
  }

  // Filtros sobre la lona, en el suelo
  const nf = orden ? orden.filtros : 3;
  const cols = retrato ? 2 : Math.min(nf, 4), filas = Math.ceil(nf / cols);
  const lonaW = cols * .62 + .3, lonaH = filas * .62 + .3, lonaZ = 1.3 + lonaH / 2;
  const lona = add(new T.PlaneGeometry(lonaW, lonaH), new T.MeshStandardMaterial({ map: TX.lona, roughness: .8 }), 0, .01, lonaZ); lona.rotation.x = -Math.PI / 2;
  const filtros = [];
  for (let i = 0; i < nf; i++) {
    const c = i % cols, f = Math.floor(i / cols);
    const x = (c - (cols - 1) / 2) * .62, z = lonaZ + (f - (filas - 1) / 2) * .62;
    add(new T.BoxGeometry(.52, .04, .52), matOscuro, x, .03, z);
    const s = superficie(.5, .5, TX.bafles, rel * 1.05, .025); colocar(s, new T.Vector3(x, .055, z), new T.Vector3(0, 1, 0)); mundo.add(s.mesh); filtros.push(s);
  }

  // Ducto: túnel sobre el techo; la cámara entra por el registro
  const duc = orden ? orden.ducto : { forma: 'cuadrado', largo: 2 };
  const dY = 3.7, dL = duc.largo, dZ0 = .5, dc = dZ0 - dL / 2;
  const ducto = [];
  let mitadAlto = .36, mitadAncho = .36;
  if (duc.forma === 'redondo') {
    const r = .38, geo = new T.CylinderGeometry(r, r, dL, 40, 1, true);
    const s = superficie(2 * Math.PI * r, dL, TX.acero, rel * 1.1, .045, geo, T.BackSide);
    s.mesh.rotation.x = Math.PI / 2; s.mesh.position.set(0, dY, dc); mundo.add(s.mesh); ducto.push(s);
    mitadAlto = mitadAncho = r;
  } else {
    const an = duc.forma === 'ancho' ? 1.1 : .72, al = duc.forma === 'ancho' ? .5 : .72;
    mitadAlto = al / 2; mitadAncho = an / 2;
    const s1 = superficie(an, dL, TX.acero, rel * 1.15, .045); colocar(s1, new T.Vector3(0, dY - al / 2, dc), new T.Vector3(0, 1, 0)); ducto.push(s1);
    const s2 = superficie(an, dL, TX.acero, rel * .9, .045); colocar(s2, new T.Vector3(0, dY + al / 2, dc), new T.Vector3(0, -1, 0)); ducto.push(s2);
    const s3 = superficie(dL, al, TX.acero, rel, .045); colocar(s3, new T.Vector3(-an / 2, dY, dc), new T.Vector3(1, 0, 0)); ducto.push(s3);
    const s4 = superficie(dL, al, TX.acero, rel, .045); colocar(s4, new T.Vector3(an / 2, dY, dc), new T.Vector3(-1, 0, 0)); ducto.push(s4);
    ducto.forEach(s => mundo.add(s.mesh));
  }
  const ventilador = new T.Group(); ventilador.position.set(0, dY, dZ0 - dL + .02); mundo.add(ventilador);
  ventilador.add(new T.Mesh(new T.CircleGeometry(Math.min(mitadAlto, mitadAncho) * .9, 24), new T.MeshStandardMaterial({ color: 0x15191c })));
  for (let i = 0; i < 5; i++) { const a = new T.Mesh(new T.BoxGeometry(.06, mitadAlto * .8, .02), new T.MeshStandardMaterial({ color: 0x8c969e, metalness: .8, roughness: .3 })); a.position.set(Math.cos(i * 1.256) * mitadAlto * .4, Math.sin(i * 1.256) * mitadAlto * .4, .02); a.rotation.z = i * 1.256; ventilador.add(a); }
  piezas.ventilador = ventilador;
  piezas.mapache = mapache(); piezas.mapache.position.set(.1, dY - mitadAlto + .13, dZ0 - dL + .5); piezas.mapache.visible = false; mundo.add(piezas.mapache);

  // Gente: el compañero, los ayudantes y, si toca, el gerente
  piezas.gente = [];
  const equipo = orden ? orden.equipo : [{ color: COMPANEROS.beto.color }];
  equipo.forEach((m, i) => { const p = persona(m.color, false); p.position.set(-lineW / 2 - .5 + (i % 2) * .5, 0, .5 + i * .45); p.rotation.y = .6; mundo.add(p); piezas.gente.push(p); });
  piezas.gerente = persona(0, true); piezas.gerente.position.set(2.9, 0, 1.3); piezas.gerente.rotation.y = -1; piezas.gerente.visible = !!(orden && orden.eventos.includes('gerente')); mundo.add(piezas.gerente);

  // Vistas de cámara: lo que se ve en cada zona y en la preparación (con desplazamiento lateral si no cabe)
  const vista = (mira, dir, ancho, dMin, dMax, fov) => ({ mira, dir: dir.normalize(), ancho, dMin, dMax, fov, pan: 0, maxPan: 0 });
  VISTAS.linea = vista(new T.Vector3(-.3, 1.0, -.55), new T.Vector3(0, .5, 1.2), lineW + 1.2, 1.9, 3.2, 58);
  VISTAS.frente = vista(new T.Vector3(0, hY0 - .05, hZ1), new T.Vector3(0, -.15, 1), span + .5, 1.6, 3.4, 60);
  Z = [{ id: 'filtros', n: 'Filtros', sfs: filtros, vista: vista(new T.Vector3(0, 0, lonaZ), new T.Vector3(0, 1.6, 1.0), lonaW + .2, 1.7, 3.2, 55) }];
  campanas.forEach((c, i) => Z.push({ id: 'campana', n: nC > 1 ? `Campana ${i + 1}` : 'Campana', sfs: c.sfs,
    vista: vista(new T.Vector3(c.cx, hY0 + hood.alto * .6, hZ0 + hood.fondo * .45), new T.Vector3(0, -.85, .5), hW + .2, 1.15, 1.6, 74) }));
  Z.push({ id: 'ducto', n: 'Ducto', sfs: ducto, vista: vista(new T.Vector3(0, dY, dZ0 - dL), new T.Vector3(0, 0, 1), 1, dL + .45, dL + .45, 80) });
  for (const z of Z) { z.inicial = z.sfs.reduce((a, s) => a + s.inicial, 0); z.meshes = z.sfs.map(s => s.mesh); }
}

// ------------------------------------------------------------------ cámara

const VISTA_GENERAL = { mira: new T.Vector3(-.2, 1.4, -.4), dir: new T.Vector3(2.6, .5, 3.8).normalize(), ancho: 5, dMin: 3.4, dMax: 5.5, fov: 55, pan: 0 };
const camT = { a: VISTA_GENERAL, mira: new T.Vector3(), objPos: new T.Vector3(), objMira: new T.Vector3() };
function irVista(v) { camT.a = v; }
function moverCamara(dt) {
  const v = camT.a, fov = v.fov || 55;
  const hf = 2 * Math.atan(Math.tan(fov * Math.PI / 360) * cam.aspect);
  const dist = clamp(v.ancho / 2 / Math.tan(hf / 2), v.dMin, v.dMax);
  v.maxPan = Math.max(0, (v.ancho - 2 * dist * Math.tan(hf / 2)) / 2);
  v.pan = clamp(v.pan || 0, -v.maxPan, v.maxPan);
  camT.objMira.copy(v.mira); camT.objMira.x += v.pan;
  camT.objPos.copy(camT.objMira).addScaledVector(v.dir, dist);
  const k = 1 - Math.exp(-dt * 7);
  cam.position.lerp(camT.objPos, k); camT.mira.lerp(camT.objMira, k);
  if (M && M.fase === 'turno') { const t = performance.now() / 1000; cam.position.x += Math.sin(t * .5) * .004; cam.position.y += Math.sin(t * .7) * .003; }
  cam.lookAt(camT.mira);
  cam.fov = fov; cam.updateProjectionMatrix();
}
let panDir = 0;
for (const [id, d] of [['#panI', -1], ['#panD', 1]]) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); panDir = d; });
  for (const ev of ['pointerup', 'pointercancel']) b.addEventListener(ev, () => { panDir = 0; });
}

// ------------------------------------------------------------------ partículas

const NP = 400;
const pGeo = new T.BufferGeometry();
const pPos = new Float32Array(NP * 3), pCol = new Float32Array(NP * 3), pVel = new Float32Array(NP * 3), pVida = new Float32Array(NP), pFlota = new Uint8Array(NP);
pGeo.setAttribute('position', new T.BufferAttribute(pPos, 3)); pGeo.setAttribute('color', new T.BufferAttribute(pCol, 3));
const puntos = new T.Points(pGeo, new T.PointsMaterial({ size: .03, vertexColors: true, transparent: true, opacity: .9, depthWrite: false }));
puntos.frustumCulled = false; escena.add(puntos);
let pSig = 0;
for (let i = 0; i < NP; i++) pPos[i * 3 + 1] = -99;
const COL = { grasa: [.25, .14, .03], agua: [.65, .85, 1], espuma: [.95, .98, 1], humo: [.5, .5, .52], chispa: [1, .8, .3] };
function emitir(p, n, tipo, normal, fuerza = 1) {
  const c = COL[tipo];
  for (let k = 0; k < n; k++) {
    const i = pSig; pSig = (pSig + 1) % NP;
    pPos[i * 3] = p.x + rnd(-.03, .03); pPos[i * 3 + 1] = p.y + rnd(-.03, .03); pPos[i * 3 + 2] = p.z + rnd(-.03, .03);
    const nx = normal ? normal.x : 0, ny = normal ? normal.y : 1, nz = normal ? normal.z : 0;
    pVel[i * 3] = (nx + rnd(-.8, .8)) * fuerza; pVel[i * 3 + 1] = (ny + rnd(-.4, .9)) * fuerza; pVel[i * 3 + 2] = (nz + rnd(-.8, .8)) * fuerza;
    pFlota[i] = tipo === 'humo' ? 1 : 0;
    if (pFlota[i]) pVel[i * 3 + 1] = rnd(.3, .6);
    pVida[i] = pFlota[i] ? rnd(1.2, 2.2) : rnd(.4, .9);
    pCol[i * 3] = c[0]; pCol[i * 3 + 1] = c[1]; pCol[i * 3 + 2] = c[2];
  }
}
function moverParticulas(dt) {
  for (let i = 0; i < NP; i++) {
    if (pVida[i] <= 0) continue;
    pVida[i] -= dt;
    if (pVida[i] <= 0) { pPos[i * 3 + 1] = -99; continue; }
    pVel[i * 3 + 1] -= (pFlota[i] ? -.1 : 3.2) * dt;
    pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt; pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
  }

}

// ------------------------------------------------------------------ marcas sobre la escena

const marcasEl = $('#marcas');
let MARCAS = [];
const proy = new T.Vector3();
function marca(pos, texto, alTocar, punto) {
  const el = document.createElement('button'); el.className = 'marca' + (punto ? ' punto' : ''); el.textContent = texto;
  const m = { pos, el, hecho: false, alTocar };
  el.addEventListener('pointerdown', e => { e.stopPropagation(); audio(); tocarMarca(m); });
  marcasEl.appendChild(el); MARCAS.push(m);
  return m;
}
function tocarMarca(m) { if (m.hecho) return; m.hecho = true; m.el.classList.add('hecha'); if (!m.el.classList.contains('punto')) m.el.textContent = '✓'; m.alTocar(); }
function limpiarMarcas() { MARCAS = []; marcasEl.innerHTML = ''; }
function moverMarcas() {
  for (const m of MARCAS) {
    proy.copy(m.pos).project(cam);
    const vis = proy.z < 1 && Math.abs(proy.x) < 1.1 && Math.abs(proy.y) < 1.1;
    m.el.style.display = vis ? '' : 'none';
    m.sx = (proy.x + 1) / 2 * innerWidth; m.sy = (1 - proy.y) / 2 * innerHeight;
    m.el.style.left = m.sx + 'px'; m.el.style.top = m.sy + 'px';

}

// ------------------------------------------------------------------ el turno

let M = null;   // estado del turno en curso
const zonaAct = () => Z[M.zona];
const pctZona = z => clamp(1 - z.sfs.reduce((a, s) => a + s.d.reduce((x, y) => x + y, 0), 0) / z.inicial, 0, 1);
const micras = z => Math.round(M.orden.micras * (1 - pctZona(z)) / 5) * 5;
const ultZona = () => Z.length - 1;

function herramientas() {
  const h = ['rasqueta', 'espuma', 'pulidor'];
  if (S.eq.hidro || (S.fase === 'aprendiz' && S.noche >= 2)) h.splice(2, 0, 'hidro');   // la de Don Rigo, hasta que Beto la vende
  return h;
}

function empezarTurno(orden) {
  construirNoche(orden);
  M = { orden, comp: COMPANEROS[orden.comp], fase: 'prep', zona: 0, t: 0, dur: TURNO_S + 15 * perk('pulmones') + (orden.campanas - 1) * 60, herr: 'rasqueta', prevHerr: 'espuma', prep: {}, botella: 1,
    trazo: null, combo: 0, ultSuelta: 0, ultDir: null, charlaT: 9, dormido: false, dormirT: rnd(30, 45), ronqT: 0, gerenteT: rnd(18, 28) * (1 + .3 * perk('labia')),
    eventos: [], hechos: new Set(), danos: [], repExtra: 0, propinaMod: 0, enZona: 0, apuntado: null, presionado: false, ev: null, album: [], listoAvisado: new Set(), prepMin: 0,
    equipo: orden.equipo.map(e => ({ ...e, t: rnd(.2, .8) })) };
  // Desastres de la noche según la orden y el compañero; la preparación añade los suyos.
  if (orden.comp === 'beto' && azar(.75)) M.eventos.push({ tipo: 'tuberia', zona: 1, en: rnd(14, 26) });
  if (orden.eventos.includes('mapache')) M.eventos.push({ tipo: 'mapache', zona: ultZona(), en: rnd(8, 14) });
  if (orden.eventos.includes('alarma')) M.eventos.push({ tipo: 'alarma', zona: 1, en: rnd(25, 40) });

}

// ---- preparación jugable: seguridad, cubrir la cocina y envolver la campana

const prepEl = $('#prep');
function panelPrep(titulo, texto, estado, boton) {
  if (M.orden.campanas > 1 || innerWidth / innerHeight < .9) texto += ' Usa las flechas de los lados para recorrer la cocina.';
  prepEl.innerHTML = `<div class="carta"><div class="fila"><h3>${esc(titulo)}</h3><span class="reloj">${hora(M.prepMin)}</span></div><p>${esc(texto)}</p><p class="nota">${esc(estado)}</p>
    <div class="acciones"><button class="btn prim" id="prepSig">${esc(boton)}</button></div></div>`;
  prepEl.hidden = false;
  $('#prepSig').onclick = () => { audio(); escenaPrep(M.escena + 1); };
}
function gastar(min) { M.prepMin += min; const r = prepEl.querySelector('.reloj'); if (r) r.textContent = hora(M.prepMin); }
function escenaPrep(i) {
  M.escena = i; limpiarMarcas(); matPlastico.opacity = .5;
  if (i === 0) {
    irVista(VISTAS.linea);

    const estado = () => `Pilotos cerrados: ${pil.filter(p => p.off).length} de ${pil.length} · Luz del extractor: ${luz.off ? 'cortada' : 'encendida'}`;
    const actualizar = () => { const n = prepEl.querySelector('.nota'); if (n) n.textContent = estado(); const b = $('#prepSig'); if (b) b.textContent = pil.every(p => p.off) && luz.off ? 'Siguiente: cubrir la cocina' : 'Seguir sin terminar'; };
    pil.forEach(p => marca(p.pos, p.txt, () => { p.off = true; p.mesh.visible = false; gastar(2); tono(300, .15, .08, 'sawtooth', 120); actualizar(); }));
    marca(luz.pos, 'Cortar la luz', () => { luz.off = true; luz.palanca.rotation.z = 2.6; gastar(2); tono(180, .1, .12, 'square'); actualizar(); });
    panelPrep('Seguridad primero', pil.length ? 'Toca cada piloto para cerrar el gas y baja la palanca de la luz del extractor. Cada cosa cuesta un par de minutos.' : 'Esta cocina no tiene pilotos de gas. Solo falta bajar la palanca de la luz del extractor.', estado(), 'Seguir sin terminar');
    actualizar();

    const actualizar = () => { const n = prepEl.querySelector('.nota'); if (n) n.textContent = estado(); const b = $('#prepSig'); if (b) b.textContent = ap.every(a => a.cubierto) ? 'Siguiente: el plástico de la campana' : 'Seguir sin terminar'; };
    ap.forEach(a => marca(a.pos, 'Cubrir', () => { a.cubierto = true; a.cubierta.visible = true; a.cubierta.userData.caida = .5; gastar(2); rafaga(.25, 900, .1, 'lowpass'); actualizar(); }));
    panelPrep('Cubrir la cocina', 'Toca cada aparato para taparlo con plástico. Lo que quede al aire se llena de agua con grasa y espuma.', estado(), 'Seguir sin terminar');

    const actualizar = () => {
      for (const f of piezas.faldas) f.mesh.visible = ci[f.a].hecho && ci[f.b].hecho;
      const n = prepEl.querySelector('.nota'); if (n) n.textContent = estado();
      if (ci.every(c => c.hecho) && !bo.some(b => b.marca)) bo.forEach(b => { b.marca = marca(b.pos, 'Colgar la bolsa', () => { b.hecho = true; b.mesh.visible = true; gastar(2); tono(500, .1, .08, 'triangle'); actualizar(); }); });
      const btn = $('#prepSig'); if (btn) btn.textContent = ci.every(c => c.hecho) && bo.every(b => b.hecho) ? 'Empezar a limpiar' : 'Empezar sin terminar';
    };
    ci.forEach(c => marca(c.pos, '', () => { c.hecho = true; gastar(.6); tono(900 + Math.random() * 200, .05, .06, 'square'); actualizar(); }, true));
    M.encintar = true;

// Arrastrar el dedo por los puntos de cinta los va pegando.
let dedoAbajo = false;
addEventListener('pointerdown', () => { dedoAbajo = true; }, true);
addEventListener('pointerup', () => { dedoAbajo = false; });
addEventListener('pointercancel', () => { dedoAbajo = false; });
addEventListener('pointermove', e => {
  if (!dedoAbajo || !M || !M.encintar) return;
  for (const m of MARCAS) if (!m.hecho && m.sx !== undefined && Math.hypot(m.sx - e.clientX, m.sy - e.clientY) < 34) tocarMarca(m);
});

function arrancarTurno() {
  const ap = piezas.aparatos, ci = piezas.cintas;
  const cub = ap.filter(a => a.cubierto).length / ap.length, env = ci.filter(c => c.hecho).length / ci.length;
  const p = M.prep = { gas: piezas.pilotos.every(x => x.off), luz: piezas.luz.off, cubierto: cub, plastico: cub >= 1, envuelto: env, bolsa: env >= 1 && piezas.bolsas.every(b => b.hecho) };
  if (!p.gas && azar(.7)) M.eventos.push({ tipo: 'piloto', zona: 1, en: rnd(5, 10) });
  if (!p.luz && azar(.8)) M.eventos.push({ tipo: 'extractor', zona: ultZona(), en: rnd(4, 9) });
  if (p.bolsa && !S.eq.bolsa && azar(.25)) M.eventos.push({ tipo: 'bolsa', zona: ultZona(), en: rnd(14, 24) });
  M.t = M.prepMin / 480 * M.dur;
  matPlastico.opacity = .16;   // durante el turno el plástico apenas estorba la vista
  M.fase = 'turno'; M.enZona = 0;
  $('#hud').hidden = false;
  $('#cliente').textContent = M.orden.nombre;
  irVista(Z[0].vista);
  pintarHud(true);
  decir(M.comp, uno(['Vamos. Tú los filtros, yo vigilo.', 'Empezamos por los filtros. Como dice Don Rigo: de abajo hacia arriba y sin preguntar.', 'Filtros primero. Si ves algo que se mueve, no es grasa.']));
  for (const e of M.equipo) if (!e.principal && azar(.5)) setTimeout(() => M && M.fase === 'turno' && decir(e, e.frase), rnd(3000, 9000));
}

// ---- entrada: pasadas sobre la superficie

const ray = new T.Raycaster(), ndc = new T.Vector2();
function apuntar(cx, cy) {
  const r = canvas.getBoundingClientRect();
  ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, cam);
  const hit = ray.intersectObjects(zonaAct().meshes, false)[0];
  if (!hit || !hit.uv) return null;

      const al = M.eventos.find(x => x.tipo === 'alarma' && !M.hechos.has(x));

    } else if (!M.presionado) chorro(false);

  piezas.pilotos.forEach(p => { if (!p.off) p.mesh.scale.y = .8 + Math.random() * .4; });

}

const etapa = () => S.fase === 'aprendiz' ? 0 : S.etapa;
const cocinasHasta = e => Object.keys(COCINAS).filter(k => COCINAS[k].etapa <= e && !COCINAS[k].campanas);
function genOrden(k, cliente) {
  const C = COCINAS[k], campanas = C.campanas || 1;
  const tipos = campanas > 1 ? ['caja', 'inclinada'] : ['caja', 'inclinada', 'caja', 'larga'];
  const tipo = uno(tipos);
  const diseno = cliente ? cliente.diseno : {
    filtros: Math.round(rnd(C.filtros[0], C.filtros[1])), campanas, ayud: C.ayud || 0,
    hood: { tipo, ancho: +(tipo === 'larga' ? rnd(2.6, 3.0) : campanas > 1 ? rnd(1.7, 2.2) : rnd(1.6, 2.3)).toFixed(2), fondo: +rnd(.95, 1.3).toFixed(2), alto: +rnd(.55, .8).toFixed(2) },
    ducto: { forma: uno(['cuadrado', 'redondo', 'ancho']), largo: +rnd(1.5, campanas > 1 ? 2.6 : 2.3).toFixed(1) },
    eventos: C.eventos.filter(() => azar(.5)),
  };
  const eventos = [...diseno.eventos];
  if ((k === 'hotel' || k === 'comedor') && !eventos.includes('alarma')) eventos.push('alarma');
  const base = cliente ? cliente.pagoBase : Math.round(rnd(C.pago[0], C.pago[1]) / 10) * 10;
  return { id: S.sigId++, cocina: k, nombre: cliente ? cliente.nombre : uno(C.nombres), filtros: diseno.filtros, campanas: diseno.campanas, ayud: diseno.ayud,
    hood: diseno.hood, ducto: diseno.ducto, eventos, micras: Math.round(rnd(C.micras[0], C.micras[1]) / 50) * 50,
    pagoBase: base, pago: Math.round(base * multPago() * (cliente ? 1.1 : 1) / 10) * 10, clienteId: cliente ? cliente.id : null, diseno };
}
function generarOrdenes() {
  if (S.fase === 'aprendiz') return [genOrden(uno(cocinasHasta(0)))];   // Don Rigo elige
  const out = [];
  for (const c of S.clientes) if (c.proxima <= S.noche) out.push(genOrden(c.cocina, c));

}

function rival(ordenes, avisos) {

// Una noche nueva: órdenes, clientes que se van, candidatos, llamadas.
function prepararNoche() {
  const avisos = [];
  S.clientes = S.clientes.filter(c => {
    // Un cliente fiel (3 visitas o más) espera; uno nuevo se deja tentar por el rival en cuanto te retrasas.
    if (S.noche > c.proxima + 2 || (S.noche > c.proxima && c.visitas < 3 && azar(.3))) {

  S.hoy = { noche: S.noche, ordenes, sel: 0, comp, ayud: S.cuadrilla.slice(0, PLAZAS[S.eq.camioneta]).map(c => c.id), llamadas: 2, avisos, frase, resultado: '' };

}

function enlazar() {
  const H = S.hoy;
  P.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { H.sel = +b.dataset.o; guardar(); pantallaCamioneta(); });
  P.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { H.comp = S.compPref = b.dataset.c; guardar(); pantallaCamioneta(); });
  P.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const id = +b.dataset.a;
    if (H.ayud.includes(id)) H.ayud = H.ayud.filter(x => x !== id);

    guardar(); pantallaCamioneta();
  });
  const sal = $('#salir'); if (sal) sal.onclick = () => {
    audio();
    const o = H.ordenes[H.sel], c = COMPANEROS[H.comp];
    const equipo = [{ principal: true, n: c.n, color: c.color, fuerza: c.fuerza, sueldo: S.fase === 'aprendiz' ? 0 : c.sueldo }, ...S.cuadrilla.filter(x => H.ayud.includes(x.id)).map(x => ({ id: x.id, n: x.n, color: x.color, fuerza: x.fuerza, frase: x.frase, sueldo: x.sueldo }))];

  const sj = $('#saltar'); if (sj) sj.onclick = () => { const sig = ETAPAS[S.etapa + 1]; S.dinero -= sig.compra; S.etapa++; guardar(); cola = [subirEtapa]; siguiente(); };

    const [nuevas, txt] = m.hacer();
    [].concat(nuevas || []).forEach(o => H.ordenes.push(o));
    H.resultado = txt + (nuevas ? ' La orden ya está en «Esta noche».' : '');

  P.querySelectorAll('[data-contratar]').forEach(b => b.onclick = () => {

    if (H.ayud.length < PLAZAS[S.eq.camioneta]) H.ayud.push(c.id);
    tono(880, .1, .08); guardar(); pantallaCamioneta();
  });
  P.querySelectorAll('[data-despedir]').forEach(b => b.onclick = () => {
    const id = +b.dataset.despedir;

  P.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = TIENDA.find(x => x.id === b.dataset.t); S.dinero -= t.p; t.f(S); guardar(); tono(880, .1, .08); pantallaCamioneta(); });
}

let cola = [];
function siguiente() { const f = cola.shift(); if (f) f(); else pantallaCamioneta(); }

function pantallaParte() {
  const o = M.orden, aprendiz = S.fase === 'aprendiz';
  const zonas = Z.map(z => ({ n: z.n, m: micras(z), pct: pctZona(z) }));
  const aprobado = zonas.every(z => z.m <= LIMITE), espejo = zonas.every(z => z.m <= 50);
  let celdas = 0, pulidas = 0;
  for (const z of Z) for (const s of z.sfs) for (let i = 0; i < s.pol.length; i++) { celdas++; if (s.pol[i] > .6) pulidas++; }
  const pulido = pulidas / celdas;
  const sinCubrir = piezas.aparatos.filter(a => !a.cubierto).length;
  if (sinCubrir && azar(Math.min(1, sinCubrir / piezas.aparatos.length * 1.4))) dano(`Espuma y grasa en ${sinCubrir} ${sinCubrir === 1 ? 'aparato sin cubrir' : 'aparatos sin cubrir'}`, sinCubrir * 25, sinCubrir > 2 ? 4 : 2);
  if (!M.prep.bolsa) dano('Agua con grasa en el suelo (plástico o bolsa incompletos)', Math.round(90 * (1 - M.prep.envuelto * .6)), 2);
  const limpio = zonas.reduce((a, z) => a + z.pct, 0) / zonas.length;
  const cobro = aprobado ? o.pago : Math.round(o.pago * .5 * limpio / 10) * 10;
  const propina = Math.max(0, Math.round(cobro * clamp(pulido * .25 + (espejo ? .05 : 0) + .05 * perk('labia') + M.propinaMod, 0, .3) / 5) * 5);
  const danos = M.danos.reduce((a, d) => a + d.dinero, 0);
  const sueldos = M.equipo.reduce((a, e) => a + (e.sueldo || 0), 0);
  // De aprendiz cobras sueldo y Don Rigo paga los daños; con tu empresa cobras todo y lo pagas todo.
  const lineas = aprendiz
    ? [['Sueldo de la noche', SUELDO_APRENDIZ], ['Bono por aprobar', aprobado ? 40 : 0], ['Propina', propina], ...M.danos.map(d => [d.t + (d.dinero ? ' (lo paga Don Rigo)' : ''), null])]
    : [[`${aprobado ? 'Pago del trabajo' : 'Pago parcial'}`, cobro], ['Propina', propina], ...M.danos.map(d => [d.t, d.dinero ? -d.dinero : null]), ['Sueldos de la cuadrilla', -sueldos], ['Gasolina', -GASOLINA]];
  const neto = lineas.reduce((a, l) => a + (l[1] || 0), 0);
  const rep = (aprobado ? (espejo ? 6 : 4) : -6) + M.repExtra + (o.campanas > 1 && aprobado ? 3 : 0);
  const xp = Math.round(Z.reduce((a, z) => a + pctZona(z) * o.micras * z.sfs.length, 0) / 220) + (aprobado ? 40 : 0) + (espejo ? 25 : 0);
  S.dinero += neto; S.rep = clamp(S.rep + rep, 0, 100); if (aprobado) S.aprobados++;
  S.mejor = Math.max(S.mejor, neto); S.noche++;
  for (const a of M.album) if (!S.album.includes(a)) S.album.push(a);
  for (const e of M.equipo) { const c = S.cuadrilla.find(x => x.id === e.id); if (c) c.noches++; }
  // Clientes fijos (solo con tu empresa: los de Don Rigo son suyos)
  let notaCliente = '';
  cola = [];
  const cli = o.clienteId ? S.clientes.find(c => c.id === o.clienteId) : null;
  if (cli) {
    if (aprobado) { cli.proxima = S.noche + FREC[COCINAS[cli.cocina].frec]; cli.visitas++; notaCliente = `${cli.nombre} te espera otra vez la noche ${cli.proxima}.`; }
    else { S.clientes = S.clientes.filter(c => c !== cli); notaCliente = `${cli.nombre} cancela el contrato.`; }
  } else if (!aprendiz && aprobado && azar(.35 + S.rep / 250 + .1 * perk('gentes'))) cola.push(() => ofertaContrato(o));
  // Experiencia y nivel
  S.xp += xp; let subidas = 0;
  while (S.xp >= xpNivel(S.nivel)) { S.xp -= xpNivel(S.nivel); S.nivel++; subidas++; }
  for (let i = 0; i < subidas; i++) cola.push(elegirPerk);
  if (aprendiz && S.noche > APRENDIZ) cola.push(despido);
  guardar();
  const desastre = M.danos.some(d => d.dinero >= 60);
  pantalla(`<div class="rotulo">${aprobado ? (espejo ? 'Metal desnudo' : 'Aprobado') : 'No pasa'}<span>Parte de ${esc(o.nombre)}</span></div>
    <div class="zonas-parte">${zonas.map(z => `<div class="fila"><span>${z.n} <span class="nota">· ${Math.round(z.pct * 100)} % limpio</span></span><span class="chip num ${z.m <= LIMITE ? 'ok' : 'mal'}">${z.m.toLocaleString('es-MX')} µm</span></div>`).join('')}
      <span class="nota">El inspector mide con el peine de grasa: aprueba con ${LIMITE} µm o menos en cada zona. Pulido espejo: ${Math.round(pulido * 100)} %.</span></div>
    <div class="cita"><b>El cliente</b>${esc(uno(aprobado ? CLIENTE_BIEN : CLIENTE_MAL))}${notaCliente ? ' ' + esc(notaCliente) : ''}</div>
    <div class="cita"><b>${esc(M.comp.n)}</b>${esc(desastre ? M.comp.desastre : aprobado ? M.comp.bien : M.comp.mal)}</div>
    <div class="cuentas">
      ${lineas.filter(l => l[1] !== 0).map(l => `<span>${esc(l[0])}</span><span>${l[1] === null ? '—' : dinero(l[1])}</span>`).join('')}
      <span class="total">Te llevas</span><span class="total">${dinero(neto)}</span>
      <span>Reputación${aprendiz ? ' de Grasa Brava' : ''}</span><span>${rep >= 0 ? '+' : ''}${rep}</span>
      <span>Experiencia</span><span>+${xp}</span>
    </div>
    ${aprendiz && danos ? '<p class="nota">Don Rigo paga los daños. Te los va a recordar en tu boda.</p>' : ''}
    ${M.album.length ? `<p class="nota">Nueva foto en el álbum: ${esc(M.album.join(', '))}.</p>` : ''}
    <div class="acciones"><button class="btn prim" id="seguir">Seguir</button></div>`);
  $('#seguir').onclick = siguiente;
  tono(aprobado ? 660 : 300, .3, .1, 'triangle', aprobado ? 990 : 200);
}

function ofertaContrato(o) {
  const C = COCINAS[o.cocina], cada = FREC[C.frec];
  pantalla(`<div class="rotulo">¿Contrato fijo?<span>${esc(o.nombre)}</span></div>
    <div class="cita"><b>El dueño</b>${esc(uno(['Nunca vi mi campana así. ¿Me la limpian siempre ustedes?', `${RIVAL} cobraba menos, pero no limpiaba. ¿Firmamos?`, 'Quiero esto cada vez que toque. Y que venga el mismo chico, el que no rompe nada.']))}</div>

  $('#firmar').onclick = () => { S.clientes.push({ id: S.sigId++, nombre: o.nombre, cocina: o.cocina, proxima: S.noche + cada - 1, visitas: 1, diseno: o.diseno, pagoBase: o.pagoBase }); guardar(); sCaja(); siguiente(); };
  $('#noFirmar').onclick = siguiente;
}

function elegirPerk() {
  const libres = Object.keys(PERKS).filter(k => perk(k) < 3).sort(() => Math.random() - .5).slice(0, 3);
  if (!libres.length) return siguiente();
  pantalla(`<div class="rotulo">¡Nivel ${S.nivel}!<span>Elige una mejora</span></div>
    ${libres.map(k => `<button class="orden" data-p="${k}"><h3>${PERKS[k].n}${perk(k) ? ' ' + 'I'.repeat(perk(k) + 1) : ''}</h3><span class="nota">${PERKS[k].d}</span></button>`).join('')}`);
  sDing();
  P.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.perks[b.dataset.p] = perk(b.dataset.p) + 1; guardar(); siguiente(); });
}

  pantalla(`<div class="rotulo">La última noche<span>de Grasa Brava</span></div>
    <div class="jefe">${cara('#b9a27a', 'R')}<div><b>Don Rigo</b>${esc(jugador())}, ven a la camioneta. Tenemos que hablar. Trae la rasqueta.</div></div>
    <p>Don Rigo tiene la cara de cuando el mapache se comió su almuerzo. Beto silba mirando al techo.</p>

    <div class="acciones"><button class="btn prim" data-r="0">¡Yo no fui!</button><button class="btn" data-r="1">…¿Qué canciones tiene?</button></div>`);
  sAlarma();
  P.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    const resp = b.dataset.r === '0' ? 'Ya sé que no fuiste tú. Pero alguien tiene que pagar el pato, y Beto es mi sobrino.' : 'Tiene «Rata de dos patas». Beto la cantó tres veces. Me duele el alma.';
    pantalla(`<div class="rotulo">Estás despedido<span>(más o menos)</span></div>
      <div class="cita"><b>Don Rigo</b>${esc(resp)} Total, que cierro Grasa Brava y me voy a pescar. Ya estoy viejo para mapaches.</div>
      <div class="cita"><b>Don Rigo</b>Llévate la camioneta. No arranca en subida y la radio solo agarra rancheras. Aquí tienes ${dinero(300)} de finiquito. Y llévate a Beto, por favor. Te lo suplico.</div>
      <div class="cita"><b>Beto</b>${esc(jugador())}… digo, jefe. Yo me voy contigo. Traigo el karaoke.</div>
      <p class="nota">Tus herramientas, tu nivel y tus mejoras se vienen contigo. La hidrolavadora de Don Rigo no (ya sabes por qué). Los clientes son suyos: tu reputación empieza en cero.</p>
      <div class="acciones"><button class="btn prim" id="abrir">Abrir mi propia empresa</button></div>`);
    tono(220, .6, .08, 'triangle', 110);
    $('#abrir').onclick = nombrarEmpresa;
  });
}

function nombrarEmpresa() {
  const NOMBRES = ['Grasa Cero', 'Campanas Relucientes', 'Los Limpiadores de Hoods', ...(S.jugador ? [`Limpiezas ${S.jugador}`, `${S.jugador} e Hijos`] : []), 'Ductos Felices', 'Brillo Nocturno'];
  const PINTURAS = [['#ff8a1f', 'naranja'], ['#2f6fd1', 'azul'], ['#d7382b', 'rojo'], ['#2e9e5b', 'verde'], ['#e8e3d6', 'blanco'], ['#7b4fd1', 'morado']];
  let nombre = uno(NOMBRES), color = PINTURAS[0][0];
  pantalla(`<div class="rotulo">Tu empresa<span>desde cero</span></div>
    <div id="vistaFurgo"></div>
    <label class="campo"><span>Nombre de la empresa</span><input id="nombreEmp" maxlength="26" autocomplete="off" spellcheck="false"></label>
    <div class="chips">${NOMBRES.map(n => `<button class="btn peq" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <h2 class="sec">Pintura de la camioneta</h2>
    <div class="chips">${PINTURAS.map(([c, n]) => `<button class="color" data-col="${c}" style="background:${c}" aria-label="Pintura ${n}" aria-pressed="${c === color}"></button>`).join('')}</div>
    <p class="nota">Empiezas con ${dinero(300)} de finiquito más lo que ahorraste, la camioneta vieja, Beto y reputación cero. A buscar clientes.</p>
    <div class="acciones"><button class="btn prim" id="fundar">Abrir la empresa</button></div>`);
  const inp = $('#nombreEmp'), fundar = $('#fundar');
  const pintar = () => { $('#vistaFurgo').innerHTML = furgo(nombre || 'Sin nombre', color, 0); fundar.disabled = !nombre; };
  inp.value = nombre; pintar();
  inp.oninput = () => { nombre = inp.value.trim(); pintar(); };
  P.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { nombre = inp.value = b.dataset.n; pintar(); });
  P.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { color = b.dataset.col; P.querySelectorAll('[data-col]').forEach(x => x.setAttribute('aria-pressed', x === b)); pintar(); });
  fundar.onclick = () => {
    if (!nombre) return;
    Object.assign(S, { fase: 'empresa', etapa: 0, empresa: { nombre, color }, rep: 0, clientes: [], cuadrilla: [], candidatos: [], hoy: null, compPref: 'beto', abierta: S.noche });
    S.dinero += 300;
    guardar(); sCaja(); tab = 'clientes';
    pantallaCamioneta();
  };
}

function subirEtapa() {
  const e = ETAPAS[S.etapa];
  const frases = ['', ['Beto', 'Un taller propio. Con baño y todo. Lupe llamó: dice que se viene con nosotros si le dejas su propia taza.'], ['Lupe', 'Oficina con fax. Nadie sabe usar el fax. Chuy ya se durmió en el sofá de la entrada: está contratado.'], ['Beto', 'Nos llaman de un estadio. ¡De un estadio! El cuñado del alcalde pasó por delante y no nos saludó. Eso es que vamos bien.'], ['Don Rigo', `Saliste en el noticiero de las seis. Siempre supe que valías, ${jugador()}. Mentira, pero se agradece. Ahora, ¿me das trabajo? Es broma. Bueno, medio broma.`]][S.etapa];
  pantalla(`<div class="empresa">${furgo(S.empresa.nombre, S.empresa.color, S.etapa)}<div class="rotulo">${esc(e.n)}<span>${esc(S.empresa.nombre)}</span></div></div>
    <div class="cita"><b>${esc(frases[0])}</b>${esc(frases[1])}</div>
    <p>${esc(e.txt)}</p>
    ${S.etapa === ETAPAS.length - 1 ? '<p class="pista">Llegaste a lo más alto. Puedes seguir jugando: la grasa nunca se acaba.</p>' : ''}
    <div class="acciones"><button class="btn prim" id="ok">Seguir</button></div>`);
  sDing(); tono(1760, .5, .08, 'sine', null, .3);
  $('#ok').onclick = siguiente;
}

// ------------------------------------------------------------------ bucle principal

function redimensionar() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', redimensionar);
let ult = performance.now();
function bucle(ahora) {
  const dt = Math.min(.05, (ahora - ult) / 1000); ult = ahora;
  U.tiempo.value = ahora / 1000;
  if (M && M.fase === 'turno') tickTurno(dt);
  else if (!M) { const a = ahora / 9000; VISTA_GENERAL.dir.set(Math.sin(a) * 2.6 + .4, .5, 3.6 + Math.cos(a) * .3).normalize(); }
  // Cubiertas que caen sobre los aparatos
  if (piezas.aparatos) for (const ap of piezas.aparatos) { const c = ap.cubierta, t = c.userData.caida; if (t > 0) { c.userData.caida = Math.max(0, t - dt); c.position.y = .9 + (ap.alto + .1) / 2 + c.userData.caida * 1.4; } }
  const v = camT.a;
  if (panDir) v.pan = (v.pan || 0) + panDir * dt * 1.4;
  const conPan = M && (M.fase === 'turno' || M.fase === 'prep') && v.maxPan > .05;
  $('#panI').hidden = !conPan; $('#panD').hidden = !conPan;
  moverCamara(dt);
  moverParticulas(dt);
  if (MARCAS.length) moverMarcas();
  R.render(escena, cam);
  requestAnimationFrame(bucle);
}

function arrancar(datos) {
  if (datos && datos.S && migrar(datos.S)) { S = datos.S; guardada = true; } else if (cargar()) guardada = true; else nueva();
  U.hl.value = S.aj.resaltar ? 1 : 0;
  redimensionar();
  pantallaInicio();
  requestAnimationFrame(bucle);
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(arrancar) : arrancar(window.claude?.hot?.data ?? {});
})();
</script>
