<title>Hood Cleaners: The Night Shift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Turno de noche: pantalla a sangre con la cocina en 3D; paneles de acero oscuro, grasa ámbar y naranja de seguridad para lo que se toca. */
:root {
  --noche: #131d26;
  --panel: rgba(28, 42, 53, .94);
  --panel-solido: #1c2a35;
  --panel-2: #243542;
  --linea: #344957;
  --acero: #d3dae0;
  --tenue: #8fa1ae;
  --grasa: #e0a040;
  --hivis: #ff8a1f;
  --hivis-tinta: #1a1004;
  --espuma: #9fe0ef;
  --ok: #69c97a;
  --mal: #ff6a5c;
  --f-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --f-cuerpo: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --lado-i: max(16px, env(safe-area-inset-left, 0px));
  --lado-d: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--noche); color: var(--acero); font-family: var(--f-cuerpo); font-size: 15px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
input { font: inherit; -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--hivis); outline-offset: 2px; }
#juego { position: fixed; inset: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD del turno */
.hud-arriba { position: absolute; left: 0; right: 0; top: 0; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); padding-bottom: 18px; display: grid; gap: 6px; pointer-events: none; background: linear-gradient(rgba(10,16,22,.75), rgba(10,16,22,0)); }
.hud-fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.reloj { font-family: var(--f-mono); font-size: 26px; font-weight: 600; color: var(--hivis); font-variant-numeric: tabular-nums; line-height: 1; }
.cliente { font-family: var(--f-cond); font-weight: 700; font-size: 16px; letter-spacing: .03em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-ico { pointer-events: auto; background: var(--panel); border: 1px solid var(--linea); border-radius: 6px; width: 40px; height: 40px; display: grid; place-items: center; font-size: 14px; flex: none; }
.tiempo { height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
.tiempo div { height: 100%; background: var(--hivis); }
.chat { display: grid; gap: 5px; justify-items: start; }
.burbuja { pointer-events: auto; max-width: min(92%, 420px); background: var(--panel); border: 1px solid var(--linea); border-radius: 4px 12px 12px 12px; padding: 7px 10px; display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; animation: entra .25s ease-out; font-size: 14px; }
.burbuja .cara { width: 30px; height: 30px; border-radius: 50% 50% 6px 6px; display: grid; place-items: center; font-family: var(--f-display); font-size: 13px; color: var(--hivis-tinta); }
.burbuja b { font-family: var(--f-cond); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); display: block; }
.burbuja .resp { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
@keyframes entra { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

.hud-abajo { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); padding-top: 24px; display: grid; gap: 8px; pointer-events: none; background: linear-gradient(rgba(10,16,22,0), rgba(10,16,22,.8)); }
.zonas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.zonas button { pointer-events: auto; background: var(--panel); border: 1px solid var(--linea); border-radius: 6px; padding: 5px 8px; text-align: left; display: grid; min-width: 0; }
.zonas button[aria-pressed="true"] { border-color: var(--hivis); }
.zonas b { font-family: var(--f-cond); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zonas span { font-family: var(--f-mono); font-size: 12px; color: var(--tenue); font-variant-numeric: tabular-nums; }
.zonas .listo span { color: var(--ok); }
.zonas button:disabled { opacity: .4; }
.botones-hud { display: flex; gap: 6px; flex-wrap: wrap; }
.btn.robot { background: #2a3d4a; border-color: #7fd3e6; color: #bfeefa; }
.zonas button.revisar { border-color: var(--grasa); box-shadow: 0 0 0 1px var(--grasa); }
.filas-reparto { display: grid; gap: 6px; max-height: 40vh; overflow-y: auto; }
.filas-reparto label { display: grid; grid-template-columns: 1fr 1.2fr; gap: 8px; align-items: center; font-family: var(--f-cond); font-weight: 700; font-size: 15px; }
.filas-reparto select, .evalua select { font: inherit; font-size: 14px; background: var(--panel-solido); color: var(--acero); border: 1px solid var(--linea); border-radius: 6px; padding: 6px; }
.mandos { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.herr-btn { pointer-events: auto; width: 78px; height: 78px; border-radius: 50%; background: var(--panel-solido); border: 3px solid var(--hivis); display: grid; place-items: center; align-content: center; touch-action: none; flex: none; }
.herr-btn svg { width: 34px; height: 34px; }
.herr-btn small { font-family: var(--f-cond); font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
.info { display: grid; gap: 4px; justify-items: start; min-width: 0; }
.ayuda { font-size: 13px; color: var(--acero); text-shadow: 0 1px 2px #000; min-height: 1.4em; }
.pasos { display: flex; flex-wrap: wrap; gap: 4px; }
.tuto { pointer-events: none; background: #ffd23f; color: #1a1004; border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 15px; line-height: 1.3; box-shadow: 0 4px 14px #0008; }
.tuto small { display: block; font-family: var(--f-cond); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; opacity: .7; }
@keyframes tutoBrilla { 0%, 100% { box-shadow: 0 0 0 0 #ffd23f00; } 50% { box-shadow: 0 0 0 5px #ffd23f; } }
body[data-tuto="espuma"] [data-hb="espuma"], body[data-tuto="zonas"] #zonas button, body[data-tuto="siguiente"] #siguiente { animation: tutoBrilla 1.1s ease-in-out infinite; border-radius: 10px; }
.pasos span { font-family: var(--f-cond); font-weight: 700; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: var(--panel-2); color: var(--tenue); }
.pasos .hecho { color: var(--ok); }
.pasos .act { background: var(--hivis); color: var(--hivis-tinta); }
.barra-herr { display: flex; gap: 6px; pointer-events: auto; }
.barra-herr button { width: 56px; height: 54px; border-radius: 8px; background: var(--panel); border: 2px solid var(--linea); display: grid; place-items: center; align-content: center; padding: 2px; }
.barra-herr button[aria-pressed="true"] { border-color: var(--hivis); background: var(--panel-2); }
.barra-herr svg { width: 24px; height: 24px; }
.barra-herr small { font-family: var(--f-cond); font-weight: 700; font-size: 10.5px; text-transform: uppercase; line-height: 1.1; }
.barra-herr .gasto { color: var(--espuma); font-family: var(--f-mono); font-size: 10px; }
.combo { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: 40px; color: var(--hivis); text-shadow: 0 3px 0 var(--hivis-tinta), 0 0 18px rgba(255,138,31,.5); pointer-events: none; opacity: 0; white-space: nowrap; }
.combo.ve { animation: combo .7s ease-out; }
@keyframes combo { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }
.falta { position: absolute; top: 50%; transform: translateY(-50%); border: 0; background: var(--hivis); color: var(--hivis-tinta); font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; padding: 10px 8px; box-shadow: 0 0 18px rgba(255,138,31,.6); animation: falta 1s ease-in-out infinite alternate; writing-mode: vertical-rl; }
#faltaI { left: 0; border-radius: 0 10px 10px 0; padding-left: max(8px, env(safe-area-inset-left, 0px)); transform: translateY(-50%) rotate(180deg); }
#faltaD { right: 0; border-radius: 10px 0 0 10px; padding-right: max(8px, env(safe-area-inset-right, 0px)); }
@keyframes falta { to { opacity: .55; } }

/* Rueda de herramientas */
.rueda { position: absolute; width: 250px; height: 250px; margin: -125px 0 0 -125px; pointer-events: none; }
.rueda .sector { position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: var(--panel-solido); border: 2px solid var(--linea); display: grid; place-items: center; align-content: center; text-align: center; }
.rueda .sector svg { width: 28px; height: 28px; }
.rueda .sector small { font-family: var(--f-cond); font-weight: 700; font-size: 11px; text-transform: uppercase; line-height: 1.05; }
.rueda .sector.sel { border-color: var(--hivis); background: var(--panel-2); transform: scale(1.12); }
.rueda .sector.off { opacity: .35; }
.rueda .centro { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--hivis); }

/* Marcas sobre la escena 3D (preparación) */
.marca { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); background: var(--hivis); color: var(--hivis-tinta); border: 2px solid rgba(255,255,255,.4); border-radius: 999px; padding: 6px 11px; font-family: var(--f-cond); font-weight: 700; font-size: 14px; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 3px 10px rgba(0,0,0,.5); animation: marca .7s ease-in-out infinite alternate; }
.marca.punto { width: 30px; height: 30px; padding: 0; }
.marca.hecha { background: var(--ok); animation: none; pointer-events: none; }
@keyframes marca { to { transform: translate(-50%, -50%) scale(1.1); } }

/* Pantallas (camioneta, taller, parte…) */
.pantalla { position: absolute; inset: 0; overflow-y: auto; background: linear-gradient(rgba(13,20,27,.5), rgba(13,20,27,.93) 38%); padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); padding-left: var(--lado-i); padding-right: var(--lado-d); }
.hoja { max-width: 580px; margin: 0 auto; display: grid; gap: 14px; }
.hoja p { margin: 0; }
.rotulo { font-family: var(--f-display); font-size: clamp(26px, 7.5vw, 38px); line-height: .95; color: var(--acero); text-wrap: balance; }
.rotulo span { color: var(--hivis); display: block; font-size: .6em; margin-top: 4px; }
.datos { display: flex; flex-wrap: wrap; gap: 6px; }
.dato { background: var(--panel); border: 1px solid var(--linea); border-radius: 4px; padding: 4px 10px; display: grid; }
.dato b { font-family: var(--f-mono); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dato i { font-style: normal; font-family: var(--f-cond); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--tenue); }
.dato small { font-size: 11px; color: var(--tenue); }
.jefe { background: var(--panel); border-left: 3px solid var(--grasa); padding: 10px 12px; border-radius: 0 6px 6px 0; display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
.cara { width: 40px; height: 40px; border-radius: 50% 50% 8px 8px; display: grid; place-items: center; font-family: var(--f-display); color: var(--hivis-tinta); }
.jefe b { font-family: var(--f-cond); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); display: block; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 2px solid var(--linea); position: sticky; top: 0; z-index: 4; background: rgb(13,20,27); margin-top: -4px; padding-top: 4px; }
.barra-salir { position: sticky; bottom: 0; z-index: 4; display: flex; align-items: center; gap: 10px; justify-content: space-between; background: rgba(13,20,27,.97); border-top: 2px solid var(--hivis); margin: 0 -8px; padding: 10px 8px max(10px, env(safe-area-inset-bottom, 0px)); }
.barra-salir > div { display: grid; min-width: 0; }
.barra-salir b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-salir .btn { flex: none; min-height: 48px; }
.mapa { display: grid; gap: 6px; }
.tablero { display: grid; gap: 6px; background: var(--panel); border: 1px solid #e58fbf55; border-radius: 10px; padding: 10px; }
.fila-tab { display: grid; grid-template-columns: auto auto auto 1fr; gap: 2px 8px; align-items: center; font-size: 14px; padding: 4px 6px; border-radius: 6px; }
.fila-tab.tuya { background: #ff8a1f22; outline: 1px solid var(--hivis); }
.fila-tab .hora { font-family: var(--f-mono); color: var(--tenue); font-size: 12px; }
.fila-tab i { width: 10px; height: 10px; border-radius: 3px; }
.fila-tab .dest { grid-column: 2 / -1; color: var(--tenue); font-size: 13px; }
.mapa svg { width: 100%; height: auto; border-radius: 10px; border: 2px solid var(--linea); display: block; }
.mapa .pin:active circle { stroke: #fff; }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--tenue); }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.orden.finde { border-color: var(--hivis); }
.misiones i { font-style: normal; font-family: var(--f-mono); font-size: 12px; color: var(--hivis); }
.misiones em { font-style: normal; font-size: 12px; color: var(--tenue); }
.tabs button { background: none; border: 0; padding: 12px 10px; min-height: 44px; font-family: var(--f-cond); font-weight: 700; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; color: var(--tenue); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--acero); border-color: var(--hivis); }
.tabs .cuenta { font-family: var(--f-mono); font-size: 12px; background: var(--hivis); color: var(--hivis-tinta); border-radius: 8px; padding: 0 5px; margin-left: 4px; }
h2.sec { margin: 4px 0 0; font-family: var(--f-cond); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--tenue); font-weight: 700; }
.orden { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 12px 14px; display: grid; gap: 7px; text-align: left; width: 100%; }
button.orden[aria-pressed="true"] { border-color: var(--hivis); box-shadow: inset 0 0 0 1px var(--hivis); }
.orden h3 { margin: 0; font-family: var(--f-cond); font-size: 21px; line-height: 1.1; color: var(--acero); }
.orden.fijo { border-left: 4px solid var(--ok); }
.fila { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.nota { font-size: 13px; color: var(--tenue); }
.pista { font-size: 14px; color: var(--grasa); }
.aviso { font-size: 14px; color: var(--mal); }
.pago { font-family: var(--f-mono); font-size: 20px; font-weight: 600; }
.chip { display: inline-block; font-family: var(--f-cond); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--panel-2); }
.chip.num { text-transform: none; font-family: var(--f-mono); font-weight: 600; letter-spacing: 0; }
.chip.ok { background: rgba(105,201,122,.18); color: var(--ok); }
.chip.mal { background: rgba(255,106,92,.18); color: var(--mal); }
.chip.naranja { background: var(--hivis); color: var(--hivis-tinta); }
.chip.suc-quemada { background: #0d0b0a; color: #c9b8a8; border: 1px solid #4a3a2c; }
.chip.suc-aceite { background: rgba(224,160,64,.2); color: #f0c060; }
.chip.suc-sarro { background: rgba(190,90,30,.25); color: #f09a5a; }
.companeros { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.comp { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px; display: grid; grid-template-columns: 40px 1fr; gap: 8px; text-align: left; align-items: start; width: 100%; }
.comp[aria-pressed="true"] { border-color: var(--hivis); box-shadow: inset 0 0 0 1px var(--hivis); }
.comp:disabled { opacity: .45; cursor: not-allowed; }
.comp b { font-family: var(--f-cond); font-size: 17px; display: block; }
.comp span { font-size: 12px; color: var(--tenue); display: block; }
.persona { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; }
.persona b { font-family: var(--f-cond); font-size: 17px; }
.persona span { font-size: 13px; color: var(--tenue); display: block; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--linea); background: var(--panel-2); border-radius: 6px; padding: 11px 16px; font-family: var(--f-cond); font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; }
.btn.prim { background: var(--hivis); border-color: var(--hivis); color: var(--hivis-tinta); }
.btn.peq { padding: 6px 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.barra { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
.barra div { height: 100%; background: var(--hivis); }
.cuentas { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 12px; }
.cuentas span:nth-child(even) { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.cuentas .total { font-weight: 700; border-top: 1px solid var(--linea); padding-top: 6px; }
.zonas-parte { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 12px; }
.cita { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.cita b { font-family: var(--f-cond); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); display: block; }
.portada { min-height: 34vh; display: grid; align-content: end; gap: 10px; }
.rotulo.grande { font-size: clamp(40px, 12vw, 64px); }
.empresa { display: grid; grid-template-columns: minmax(0, 190px) 1fr; gap: 12px; align-items: center; }
.furgo { width: 100%; height: auto; display: block; }
.empresa .rotulo { font-size: clamp(22px, 6vw, 32px); overflow-wrap: anywhere; }
.campo { display: grid; gap: 6px; }
.campo span { font-family: var(--f-cond); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }
.campo input { box-sizing: border-box; background: var(--panel-solido); color: var(--acero); border: 1px solid var(--linea); border-radius: 6px; padding: 11px 12px; font-size: 18px; width: 100%; }
.campo input:focus { outline: 2px solid var(--hivis); outline-offset: 1px; }
.color { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--linea); }
.color[aria-pressed="true"] { border-color: var(--acero); box-shadow: 0 0 0 2px var(--hivis); }
.rango { background: var(--panel); border: 1px dashed var(--linea); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.ajuste { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; text-align: left; width: 100%; }
.ajuste small { display: block; color: var(--tenue); font-size: 13px; }
.interruptor { width: 44px; height: 26px; border-radius: 13px; background: var(--linea); position: relative; flex: none; }
.interruptor::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--acero); transition: left .15s; }
[aria-pressed="true"] .interruptor { background: var(--ok); }
[aria-pressed="true"] .interruptor::after { left: 21px; }

/* Eventos y panel de preparación */
.evento { position: absolute; left: 0; right: 0; bottom: 0; padding-left: var(--lado-i); padding-right: var(--lado-d); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; pointer-events: none; }

  // Cuarto

  piezas.fuga = new T.Vector3(tub.position.x - .3, 1.55, -.9);

  // Campanas: superficies interiores sucias + piel exterior limpia + plástico y bolsa de la preparación

      const p = new T.Mesh(s.mesh.geometry, matPiel); p.position.copy(s.mesh.position).addScaledVector(normal, -.012); p.quaternion.copy(s.mesh.quaternion); mundo.add(p); };
    if (hood.tipo === 'inclinada') {

      pon(hood.fondo, lado, new T.Vector3(cx + hW / 2 - dx / 2, (hY0 + hY1) / 2, hZ), new T.Vector3(-hood.alto, -dx, 0).normalize());

// ------------------------------------------------------------------ cámara

const VISTA_GENERAL = { mira: new T.Vector3(-.2, 1.4, -.4), dir: new T.Vector3(2.6, .5, 3.8).normalize(), ancho: 5, dMin: 3.4, dMax: 5.5, fov: 55, pan: 0 };
const camT = { a: VISTA_GENERAL, mira: new T.Vector3(), objPos: new T.Vector3(), objMira: new T.Vector3(), off: 0, offX: 0 };
function irVista(v) { camT.a = v; }
const VISTA_FINAL = { mira: new T.Vector3(), dir: new T.Vector3(0, -.5, 1).normalize(), ancho: 3, dMin: 2.1, dMax: 3.2, fov: 55, pan: 0 };
let cine = null;   // el final del turno

const evEl = $('#evento');
function carta(titulo, texto, opciones, opts = {}) {
  M.ev = { bloquea: !!opts.bloquea, limite: opts.limite || 0, t: 0, alAgotar: opts.alAgotar };
  evEl.innerHTML = `<div class="carta" role="dialog"><h3>${esc(titulo)}</h3><p>${esc(texto)}</p>${opts.limite ? '<div class="cuenta-atras"><div id="cuenta" style="width:100%"></div></div>' : ''}<div class="opciones">${opciones.map((o, i) => `<button class="btn ${o.prim ? 'prim' : ''}" data-i="${i}">${esc(o.t)}${o.d ? `<small>${esc(o.d)}</small>` : ''}</button>`).join('')}</div></div>`;
  evEl.hidden = false;
  evEl.querySelectorAll('[data-i]').forEach(b => {
    const o = opciones[+b.dataset.i];
    if (o.mantener) {
      // Cuenta el tiempo real pulsado, aunque el temporizador llegue tarde en un móvil lento.
      let tm = null, t0 = 0; const txt = b.innerHTML, ms = o.mantener * 1000;
      const hecho = () => { clearTimeout(tm); tm = null; o.f(); };
      b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); b.textContent = 'Despacio… despacio…'; t0 = performance.now(); tm = setTimeout(hecho, ms); });
      b.addEventListener('pointerup', () => { if (!tm) return; if (performance.now() - t0 >= ms) hecho(); else { clearTimeout(tm); tm = null; b.innerHTML = txt; } });
      b.addEventListener('pointercancel', () => { if (tm) { clearTimeout(tm); tm = null; b.innerHTML = txt; } });
    } else b.onclick = () => o.f();
  });
}

function ensuciar(zona, cant) {
  for (const sf of zona.sfs) {
    const cx = rnd(0, sf.nx), cy = rnd(0, sf.ny), rr = sf.nx * .3;
    for (let i = 0; i < sf.d.length; i++) { const dd = Math.hypot(i % sf.nx - cx, ((i / sf.nx) | 0) - cy); if (dd < rr) sf.d[i] = Math.min(1.3, sf.d[i] + cant * (1 - dd / rr)); }
    sf.sucio = true;

}

// La competencia: la empresa del cuñado del alcalde roba órdenes o baja precios.
function rival(ordenes, avisos) {

  }

// Los clientes que se lleva El Cuñado se pueden recuperar ganándole un duelo en su cocina.

function prepararNoche() {
  const avisos = [];

function misionesHoy() {

// Negociar el precio antes de aceptar un trabajo. Si insistes de más, el cliente se va con El Cuñado.
function pantallaNegociar(i, msg) {
  const H = S.hoy, o = H.ordenes[i], C = CARACTER[o.caracter];
  if (o.pac === undefined) o.pac = C.pac;
  const prob = p => p >= .7 ? 'Seguramente acepta' : p >= .4 ? 'Puede que sí, puede que no' : 'Difícil';
  const intento = (o.intentos || 0) * .1, gar = C.garantia || 1.3;
  pantalla(`<div class="rotulo">Negociar<span>${esc(o.nombre)}</span></div>
    <div class="jefe">${cara('#e9e9e9', o.nombre[0])}<div><b>${C.n} · paciencia ${'●'.repeat(Math.max(0, o.pac))}${'○'.repeat(Math.max(0, C.pac - o.pac))}</b>${esc(msg || C.hola)}</div></div>
    <p class="nota">${esc(C.txt)}</p>
    <div class="fila"><span>Oferta de ahora</span><span class="pago">${dinero(o.pago)}</span></div>
    <div class="opciones neg">
      <button class="btn prim" data-n="ok">Firmar por ${dinero(o.pago)}<small>Trato hecho. Apretón de manos con grasa.</small></button>
      ${o.contra ? `<button class="btn" data-n="contra">Aceptar su contraoferta: ${dinero(o.contra)}<small>Ni tú ni yo.</small></button>` : ''}
      <button class="btn" data-n="15">Pedir un 15 % más: ${dinero(r10(o.pago * 1.15))}<small>${prob(C.p15 - intento)}. Si dice que no, pierde paciencia.</small></button>
      <button class="btn" data-n="30">Pedir un 30 % más: ${dinero(r10(o.pago * 1.3))}<small>${prob(C.p30 - intento)}. Arriesgado.</small></button>
      ${o.garantia ? '' : `<button class="btn" data-n="gar">Garantizar una A: ${dinero(r10(o.pago * gar))}<small>Si el inspector no pone A o A+, devuelves el 30 % y pierdes reputación.</small></button>`}
      <button class="btn" data-n="volver">Pensarlo<small>Volver sin decidir.</small></button>
    </div>`);
  P.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    const k = b.dataset.n; audio();
    if (k === 'volver') return pantallaCamioneta();
    if (k === 'ok') { o.negociado = o.firmado = true; sCaja(); guardar(); return pantallaCamioneta(); }
    if (k === 'contra') { o.pago = o.contra; o.contra = null; o.negociado = o.firmado = true; sCaja(); guardar(); return pantallaCamioneta(); }
    if (k === 'gar') { o.pago = r10(o.pago * gar); o.garantia = true; o.negociado = o.firmado = true; sCaja(); guardar(); return pantallaCamioneta(); }
    const sube = k === '15' ? 1.15 : 1.3, p = (k === '15' ? C.p15 : C.p30) - intento;
    o.intentos = (o.intentos || 0) + 1;
    if (azar(p)) { o.pago = r10(o.pago * sube); o.contra = null; tono(880, .12, .08, 'triangle'); guardar(); return pantallaNegociar(i, uno(['Está bien, está bien. Pero que brille.', 'Ándale pues. Me caíste bien.', 'Trato. Pero si veo una mancha, te llamo a las tres de la mañana.'])); }
    o.pac--; tono(300, .2, .08, 'triangle', 200);
    if (o.pac <= 0) {
      H.ordenes.splice(i, 1);
      if (H.sel >= i && H.sel > 0) H.sel--;
      for (const e of H.equipos || []) if (e.o !== null) e.o = e.o === i ? null : e.o > i ? e.o - 1 : e.o;
      H.avisos.push(`${o.nombre} se cansó de regatear y llamó a ${RIVAL}.`);
      guardar();
      pantalla(`<div class="rotulo">Se fue<span>${esc(o.nombre)}</span></div><div class="cita"><b>${esc(o.nombre)}</b>${esc(uno(['¿Sabe qué? Ya llamé a El Cuñado. Cobra menos. Y contesta rápido.', 'Mejor lo dejamos. Me duele la cabeza.', 'No, no y no. Adiós.']))}</div>
        <div class="acciones"><button class="btn prim" id="volverN">Volver</button></div>`);
      $('#volverN').onclick = pantallaCamioneta; return;
    }
    if (C.contra) { o.contra = r10(o.pago * (1 + rnd(.05, .1))); guardar(); return pantallaNegociar(i, `${C.no} Mi oferta final: ${dinero(o.contra)}.`); }
    guardar(); pantallaNegociar(i, C.no);
  });
}

// Los equipos extra: cada camioneta lleva un compañero (opcional) y hasta 3 ayudantes a otro trabajo la misma noche.

  return H.equipos;
}

  return { comps, ayud };
}

    ${eqs.map((e, k) => {
      const { comps, ayud } = ocupados(e), o = e.o !== null ? H.ordenes[e.o] : null;
      const libresO = H.ordenes.map((x, i) => [x, i]).filter(([x, i]) => !x.duelo && x.firmado && (!usadas.has(i) || i === e.o));
      const libresP = [...(e.comp ? [] : S.fijos.filter(id => !comps.has(id))).map(id => [`c:${id}`, `${COMPANEROS[id].n} (compañero)`]),
        ...S.cuadrilla.filter(c => !ayud.has(c.id) && !e.ayud.includes(c.id)).map(c => [`a:${c.id}`, `${c.n} · fuerza ${Math.round(c.fuerza * 100)}`])];
      const gente = [...(e.comp ? [[`c:${e.comp}`, COMPANEROS[e.comp].n]] : []), ...e.ayud.map(id => S.cuadrilla.find(c => c.id === id)).filter(Boolean).map(c => [`a:${c.id}`, c.n])];

// Angélica arma los equipos: a cada trabajo firmado, la gente que pide (los más fuertes primero). En un gigante tuyo, dos equipos para ayudarte.
function organizar() {
  const H = S.hoy, eqs = equiposHoy();
  eqs.forEach(e => { e.o = null; e.comp = null; e.ayud = []; });
  const comps = S.fijos.filter(id => id !== H.comp), gente = S.cuadrilla.filter(c => !H.ayud.includes(c.id)).sort((a, b) => b.fuerza * (b.cuidado || 3) - a.fuerza * (a.cuidado || 3));
  const mio = H.ordenes[H.sel], trabajos = H.ordenes.map((o, i) => [o, i]).filter(([o, i]) => i !== H.sel && o.firmado && !o.duelo && !o.gigante).sort((a, b) => b[0].pago - a[0].pago);
  const plan = mio && mio.gigante ? [['mio', 3], ['mio', 3], ...trabajos.map(([o, i]) => [i, sugerido(o)])] : trabajos.map(([o, i]) => [i, sugerido(o)]);
  let armados = 0, sinGente = 0;
  for (const e of eqs) {
    const [o, n] = plan.shift() || [];
    if (o === undefined) break;
    if ((comps.length ? 1 : 0) + gente.length < Math.min(n, 2)) { sinGente++; continue; }
    e.o = o; if (comps.length) e.comp = comps.shift();
    while (e.ayud.length + (e.comp ? 1 : 0) < n && gente.length && e.ayud.length < 3) e.ayud.push(gente.shift().id);
    if (e.ayud.length + (e.comp ? 1 : 0) < n) sinGente++; else armados++;
  }
  const quedan = plan.length;
  return `${uno(ANGELICA.frases)} ${armados} ${armados === 1 ? 'equipo sale' : 'equipos salen'} esta noche.${sinGente ? ` Me falta gente para ${sinGente} ${sinGente === 1 ? 'equipo' : 'equipos'}: contrata más.` : ''}${quedan && !sinGente ? ` Hay ${quedan} ${quedan === 1 ? 'trabajo firmado' : 'trabajos firmados'} sin camioneta: compra más camionetas.` : ''}`;
}
function resolverB(b) {
  const o = b.orden, gente = [...(b.comp ? [{ ...COMPANEROS[b.comp], id: null }] : []), ...b.ayud.map(id => S.cuadrilla.find(c => c.id === id)).filter(Boolean)];
  const fuerza = gente.reduce((a, g) => a + g.fuerza, 0), dif = o.micras / 1800 * o.campanas * (1 + o.filtros / 8) * (o.ayud > b.ayud.length ? 1.5 : 1);
  const ayudG = gente.filter(g => g.animo), animo = ayudG.length ? ayudG.reduce((a, g) => a + g.animo, 0) / ayudG.length : 3;
  let p = .2 + fuerza / dif * .45 + kit((b.k || 2) - 2) * .08 + (animo - 3) * .05 + (S.angelica ? .05 : 0);
  const cosas = []; let dano = 0;
  const torpe = gente.find(g => g.cuidado && azar((5 - g.cuidado) * .08));
  if (torpe) { dano += uno([20, 40]); cosas.push(`${torpe.n} tiró algo que no debía.`); }
  if (b.comp === 'lupe') { p += .15; cosas.push('Lupe revisó cada esquina dos veces. Y a los ayudantes, tres.'); }
  if (b.comp === 'beto' && azar(.4)) { dano = uno([40, 80, 120]); cosas.push(uno(['Beto rompió una lámpara del techo con la escalera.', 'Beto confundió el desengrasante con el refresco del chef.', 'Beto se quedó encerrado en la cámara fría veinte minutos.'])); }
  if (b.comp === 'chuy' && azar(.35)) { p -= .25; cosas.push('Chuy se durmió en el ducto. Lo despertó el gerente a las cinco.'); }
  p = clamp(p, .05, .95);
  const aprobado = azar(p), notaA = aprobado && azar(p * .7);
  if (o.pedido) cosas.push(aprobado ? 'Cumplieron el pedido especial del cliente.' : 'Se les olvidó el pedido especial. El cliente no está contento.');
  if (!cosas.length) cosas.push(uno(['Trabajaron callados, como profesionales. Raro, pero bien.', 'Pusieron cumbia y limpiaron a buen ritmo.', 'El gerente les invitó un café. Dicen que estaba bueno.']));
  const lineas = [[`Equipo B en ${o.nombre}${aprobado ? '' : ' (no pasó: pago parcial)'}`, aprobado ? o.pago : r10(o.pago * .4)], ['Equipo B: sueldos', -gente.reduce((a, g) => a + r10((g.sueldo || 0) * (g.prueba ? .8 : 1)), 0)], ['Equipo B: gasolina', -GASOLINA]];
  if (dano) lineas.push(['Equipo B: daños', -dano]);
  if (o.garantia && !notaA) lineas.push(['Equipo B: garantía de A incumplida', -r10(o.pago * .3)]);
  return { o, aprobado, notaA, gente, lineas, cosas, k: b.k, rep: (aprobado ? 3 : -5) + (o.garantia ? (notaA ? 1 : -3) : 0) };
}

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* no importa */ }
// En el APK: avisa si en GitHub hay una versión más nueva para instalar encima (la partida se queda).
const APK_URL = 'https://github.com/jlanuza94/El-Banquillo/releases/download/hood-cleaners-latest/Hood-Cleaners.apk';
let novedad = null;
function buscarNovedad() {
  const local = +window.HC_VERSION || 0;
  if (!local || novedad !== null || !window.fetch) return;
  novedad = 0;
  fetch('https://api.github.com/repos/jlanuza94/El-Banquillo/releases/tags/hood-cleaners-latest')
    .then(r => r.ok ? r.json() : null)
    .then(j => { const m = j && /Versi[oó]n:\s*(\d+)/.exec(j.body || ''); if (m && +m[1] > local) { novedad = +m[1]; pintarNovedad(); } })
    .catch(() => { /* sin conexión: ya avisará otro día */ });
}
function pintarNovedad() {
  const el = $('#novedad'); if (!el || !novedad) return;
  const app = window.HoodApp && window.HoodApp.actualizar;   // el APK descarga e instala sin salir del juego
  el.innerHTML = `<div class="novedad"><b>¡Hay una versión nueva del juego!</b><span class="nota" id="novedadTxt">${app ? 'Se instala encima de esta: tu partida se queda donde está. Android te pedirá confirmar.' : 'Descárgala e instálala encima de esta: tu partida se queda donde está.'}</span>
    <div class="acciones">${app ? '<button class="btn prim" id="actualizar">Actualizar ahora</button>' : `<a class="btn prim" href="${APK_URL}">Descargar la versión nueva</a>`}</div></div>`;
  const b = $('#actualizar'); if (b) b.onclick = () => { b.disabled = true; b.textContent = 'Descargando…'; window.HoodApp.actualizar(APK_URL); };
}
// La app avisa de cómo va: descargando (con %), instalando o error (entonces, por el navegador).
window.hcActualizacion = (estado, pct) => {
  const b = $('#actualizar'), t = $('#novedadTxt'); if (!b) return;
  if (estado === 'descargando') b.textContent = pct >= 0 ? `Descargando… ${pct} %` : 'Descargando…';
  else if (estado === 'instalando') { b.textContent = 'Instalando…'; if (t) t.textContent = 'Confirma en la pantalla de Android. Si te pide permiso para instalar apps de Hood Cleaners, actívalo y vuelve.'; }
  else { b.disabled = false; b.textContent = 'Reintentar'; if (t) t.innerHTML = `No se pudo instalar desde aquí. <a href="${APK_URL}">Descárgala con el navegador</a> e instálala encima.`; }
};

    <div class="jefe">${cara('#b9a27a', 'R')}<div><b>Don Rigo</b>¿Y tú quién eres? Habla fuerte, que el extractor hace ruido.</div></div>

    <div class="acciones"><button class="btn prim" id="empezarJ">${nueva_ ? 'Empezar' : 'Seguir'}</button><button class="btn" id="volverJ">Volver</button></div>`);

  $('#volverJ').onclick = pantallaInicio;

    <div class="jefe">${cara('#b9a27a', 'R')}<div><b>Don Rigo</b>${esc(jugador())}, ven a la camioneta. Tenemos que hablar. Trae la rasqueta.</div></div>

      <p class="nota">Tu nivel y tus mejoras se vienen contigo. Las herramientas buenas eran de Don Rigo: tú empiezas con una rasqueta vieja y una botella de espuma. Los clientes son suyos: tu reputación empieza en cero. Y empiezas tú solo.</p>

function nombrarEmpresa() {
  const NOMBRES = ['Grasa Cero', 'Campanas Relucientes', 'Los Limpiadores de Hoods', ...(S.jugador ? [`Limpiezas ${S.jugador}`, `${S.jugador} e Hijos`] : []), 'Ductos Felices', 'Brillo Nocturno'];
  const PINTURAS = [['#ff8a1f', 'naranja'], ['#2f6fd1', 'azul'], ['#d7382b', 'rojo'], ['#2e9e5b', 'verde'], ['#e8e3d6', 'blanco'], ['#7b4fd1', 'morado']];
  let nombre = uno(NOMBRES), color = PINTURAS[0][0];
  pantalla(`<div class="rotulo">Tu empresa<span>desde cero</span></div>
    <div id="vistaFurgo"></div>
    <label class="campo"><span>Nombre de la empresa</span><input id="nombreEmp" maxlength="26" autocomplete="off" spellcheck="false"></label>
    <div class="chips">${NOMBRES.map(n => `<button class="btn peq" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <h2 class="sec">Pintura de la camioneta</h2>
    <div class="chips">${PINTURAS.map(([c, n]) => `<button class="color" data-col="${c}" style="background:${c}" aria-label="Pintura ${n}" aria-pressed="${c === color}"></button>`).join('')}</div>
    <p class="nota">Empiezas tú solo, con ${dinero(300)} de finiquito más lo que ahorraste, la camioneta vieja y reputación cero. Cuando juntes para el adelanto, contrata a Beto en «Cuadrilla».</p>
    <div class="acciones"><button class="btn prim" id="fundar">Abrir la empresa</button></div>`);
  const inp = $('#nombreEmp'), fundar = $('#fundar');
  const pintar = () => { $('#vistaFurgo').innerHTML = furgo(nombre || 'Sin nombre', color, 0); fundar.disabled = !nombre; };
  inp.value = nombre; pintar();
  inp.oninput = () => { nombre = inp.value.trim(); pintar(); };
  P.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { nombre = inp.value = b.dataset.n; pintar(); });
  P.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { color = b.dataset.col; P.querySelectorAll('[data-col]').forEach(x => x.setAttribute('aria-pressed', x === b)); pintar(); });
  fundar.onclick = () => {
    if (!nombre) return;
    Object.assign(S, { fase: 'empresa', etapa: 0, empresa: { nombre, color }, rep: 0, clientes: [], cuadrilla: [], candidatos: [], hoy: null, compPref: 'solo', fijos: [], abierta: S.noche });
    S.dinero += 300;
    guardar(); sCaja(); tab = 'clientes';
    pantallaCamioneta();
  };
}

function subirEtapa() {
  const e = ETAPAS[S.etapa];
  const frases = ['', ['Don Rigo', 'Un taller propio. Con baño y todo. Lupe me llamó: busca trabajo y solo pide su propia taza. Contrátala en «Cuadrilla».'], ['Don Rigo', 'Oficina con fax. Nadie sabe usar el fax. Chuy ya se durmió en el sofá de la entrada: dice que si lo contratas, se despierta.'], ['Radio Grasa FM', 'Última hora: a esta empresa la llaman de un estadio. ¡De un estadio! El cuñado del alcalde pasó por delante y no los saludó. Eso es que van bien.'], ['Don Rigo', `Saliste en el noticiero de las seis. Siempre supe que valías, ${jugador()}. Mentira, pero se agradece. Ahora, ¿me das trabajo? Es broma. Bueno, medio broma.`]][S.etapa];
  pantalla(`<div class="empresa">${furgo(S.empresa.nombre, S.empresa.color, S.etapa)}<div class="rotulo">${esc(e.n)}<span>${esc(S.empresa.nombre)}</span></div></div>
    <div class="cita"><b>${esc(frases[0])}</b>${esc(frases[1])}</div>
    <p>${esc(e.txt)}</p>
    ${S.etapa === ETAPAS.length - 1 ? '<p class="pista">Llegaste a lo más alto. Puedes seguir jugando: la grasa nunca se acaba.</p>' : ''}
    <div class="acciones"><button class="btn prim" id="ok">Seguir</button></div>`);
  sDing(); tono(1760, .5, .08, 'sine', null, .3);
  $('#ok').onclick = siguiente;
}

// ------------------------------------------------------------------ bucle principal

function redimensionar() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', redimensionar);
// Fotos del álbum: se copian del lienzo justo después de dibujar (sin guardar el búfer de WebGL).
let fotoPend = null;
function pedirFoto(seg, cb) { fotoPend = { t: seg, cb }; }
function instantanea() {
  try {
    const k = 360 / Math.max(canvas.width, canvas.height), w = Math.round(canvas.width * k), h = Math.round(canvas.height * k);
    return lienzo(w, h, g => g.drawImage(canvas, 0, 0, w, h)).toDataURL('image/jpeg', .72);
  } catch (e) { return null; }
}
// El estilo elegido: color de la espuma y luz del casco.
function aplicarLook() {
  const e = look('espuma').c; U.espuma.value.set(e[0], e[1], e[2]); COL.espuma = e;
  lampara.color.setHex(look('linterna').c || 0xfff1dd);
}
// Luces: el apagón deja solo la linterna; la linterna disco cambia de color.
const C_NOCHE = new T.Color(0x0b1117), C_ALBA = new T.Color(0x3d4766), C_CIELO = new T.Color(0xcfe3ff), C_CIELO_ALBA = new T.Color(0xffc48a);
let alba = 0;
function luces(dt, ahora) {
  if (cine && (!M || M.fase !== 'parte')) cine = null;
  if (cine) {
    cine.t += dt;
    if (cine.t > .8) { const a = -.8 + (cine.t - .8) * .32; VISTA_FINAL.dir.set(Math.sin(a), -.42, Math.cos(a)).normalize(); if (camT.a !== VISTA_FINAL) irVista(VISTA_FINAL); }
  }
  const objAlba = cine ? clamp((cine.t - .3) / 2.4, 0, 1) : 0;
  if (Math.abs(objAlba - alba) > .001) {
    alba += (objAlba - alba) * Math.min(1, dt * (cine ? 3 : 2));
    escena.background.copy(C_NOCHE).lerp(C_ALBA, alba); escena.fog.color.copy(escena.background);
    cielo.color.copy(C_CIELO).lerp(C_CIELO_ALBA, alba); cielo.intensity = .55 + .5 * alba;
  }
  const oscuro = M && M.fase === 'turno' && M.apagon > 0, k = 1 - Math.exp(-dt * 4);
  R.toneMappingExposure += ((oscuro ? .45 : 1.05) - R.toneMappingExposure) * k;
  lampara.intensity += ((oscuro ? 2.4 : 1.1) - lampara.intensity) * k;
  const v = $('#oscuro'), op = +v.style.opacity || 0, obj = oscuro ? 1 : 0;
  if (op !== obj) v.style.opacity = Math.abs(obj - op) < .02 ? obj : op + (obj - op) * k;
  if (look('linterna').id === 'disco' && M) lampara.color.setHSL(ahora / 2500 % 1, .9, .7);
}
// Fuego del horno, brasas, neón y farolitos; el reloj de la pared sigue la hora del turno.
let relojMin = -1;
function titilar(ahora) {
  for (const b of piezas.brillos || []) {
    if (b.fuego) b.m.color.setHSL(.06 + Math.random() * .02, 1, .45 + Math.random() * .12);
    else if (b.brasa) b.m.emissiveIntensity = b.base * (.75 + Math.random() * .5);
    else if (b.neon) b.m.opacity = Math.random() < .015 ? .3 : 1;
    else if (b.farol) b.m.color.setHSL(.01, .85, .4 + Math.sin(ahora / 700) * .04);
    else if (b.gira) b.o.rotation.y += .012;
  }
  const min = M && M.fase === 'turno' ? Math.floor(clamp(M.t / M.dur, 0, 1) * 480) : M && M.fase === 'prep' ? Math.floor(M.prepMin) : 0;
  if (min !== relojMin) { relojMin = min; pintarRelojPared(min); }
}
// Si en el turno el juego va a menos de 25 imágenes por segundo durante un rato, se activa el modo ahorro.
const FPS = { t0: 0, n: 0, lentos: 0 };
function medirFps(ahora) {
  if (S.aj.ahorro) return;
  if (!FPS.t0) FPS.t0 = ahora;
  FPS.n++;
  if (ahora - FPS.t0 < 3000) return;
  const fps = FPS.n * 1000 / (ahora - FPS.t0); FPS.t0 = ahora; FPS.n = 0;
  FPS.lentos = fps < 25 ? FPS.lentos + 1 : 0;
  if (FPS.lentos >= 2 && !S.ahorroAuto) { S.aj.ahorro = true; S.ahorroAuto = true; calidad(); redimensionar(); guardar(); ayuda('Modo ahorro activado: el celular iba lento. Puedes quitarlo en Ajustes.', 6); }
}
let ult = performance.now(), faltaT = 0;
function bucle(ahora) {
  const dt = Math.min(.05, (ahora - ult) / 1000); ult = ahora;
  U.tiempo.value = ahora / 1000;
  if (M && M.fase === 'turno') { tickTurno(dt); medirFps(ahora); }
  else if (!M) { const a = ahora / 9000; VISTA_GENERAL.dir.set(Math.sin(a) * 2.6 + .4, .5, 3.6 + Math.cos(a) * .3).normalize(); }
  // Plástico que se arranca y cubiertas que se quitan
  if (piezas.faldas) for (const f of piezas.faldas) { const t = f.mesh.userData.vuela; if (t > 0) { f.mesh.userData.vuela = t - dt * 1.5; f.mesh.position.y -= dt * .9; f.mesh.rotation.x += dt * 4; if (f.mesh.userData.vuela <= 0) f.mesh.visible = false; } }
  if (piezas.aparatos) for (const ap of piezas.aparatos) { const c = ap.cubierta, t = c.userData.sube; if (t > 0) { c.userData.sube = t - dt; c.position.y += dt * 2.2; if (c.userData.sube <= 0) c.visible = false; } }
  // Cubiertas que caen sobre los aparatos
  if (piezas.aparatos) for (const ap of piezas.aparatos) { const c = ap.cubierta, t = c.userData.caida; if (t > 0) { c.userData.caida = Math.max(0, t - dt); c.position.y = .9 + (ap.alto + .1) / 2 + c.userData.caida * 1.4; } }
  if ((faltaT -= dt) <= 0) {
    faltaT = .35;
    const [izq, der] = M && (M.fase === 'turno' || M.fase === 'prep') ? faltaFuera() : [false, false];
    const txt = !M ? '' : M.fase === 'prep' || M.etapa === 'pelar' ? 'falta' : M.etapa === 'migdalear' ? 'falta migdalear' : 'falta grasa';
    $('#faltaI').hidden = !izq; $('#faltaD').hidden = !der; $('#faltaI').textContent = txt + ' ›'; $('#faltaD').textContent = txt + ' ›';
  }
  moverCamara(dt);
  moverParticulas(dt);
  if (MARCAS.length) moverMarcas();
  luces(dt, ahora); apagarPulsos(); radioTick(); moverTrozos(dt); titilar(ahora);
  R.render(escena, cam);
  if (fotoPend && (fotoPend.t -= dt) <= 0) { const f = fotoPend; fotoPend = null; f.cb(instantanea()); }
  requestAnimationFrame(bucle);
}

function arrancar(datos) {
  if (datos && datos.S && migrar(datos.S)) { S = datos.S; guardada = true; } else if (cargar()) guardada = true; else nueva();
  U.hl.value = S.aj.resaltar ? 1 : 0; aplicarLook();
  redimensionar();
  pantallaInicio();
  requestAnimationFrame(bucle);
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(arrancar) : arrancar(window.claude?.hot?.data ?? {});
})();
</script>
